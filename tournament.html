<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; connect-src 'self' https://api.avax.network https://rpc.ankr.com https://last-chad-runner.severin20.workers.dev https://cloud.walletconnect.com wss://relay.walletconnect.com wss://relay.walletconnect.org https://*.walletconnect.org https://*.walletconnect.com https://api.web3modal.org; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://fonts.reown.com; frame-src https://verify.walletconnect.com;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tournament — Members Only</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="nav.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #0a0705;
      background-image: url('assets/mainbg.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      font-family: 'Press Start 2P', monospace;
      color: #f5e6c8;
      padding-top: 60px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      font-size: clamp(0.7rem, 2.5vw, 1.2rem);
      color: #c9a84c;
      margin-bottom: 8px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    .sub-title {
      text-align: center;
      font-size: 0.38rem;
      color: #8a7a5a;
      margin-bottom: 24px;
    }

    .section {
      background: rgba(30, 20, 10, 0.85);
      border: 1px solid #5c4409;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 0.5rem;
      color: #c9a84c;
      margin-bottom: 12px;
      border-bottom: 1px solid #5c4409;
      padding-bottom: 8px;
    }

    .chad-select, .tournament-select {
      width: 100%;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.42rem;
      padding: 10px 12px;
      background: rgba(20, 14, 8, 0.9);
      border: 2px solid #5c4409;
      border-radius: 4px;
      color: #f5e6c8;
      cursor: pointer;
      margin-bottom: 12px;
    }
    .chad-select:focus, .tournament-select:focus { border-color: #c9a84c; outline: none; }
    .chad-select option, .tournament-select option { background: #1e140a; color: #f5e6c8; }

    .info-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.38rem;
      padding: 4px 0;
      border-bottom: 1px dashed rgba(92, 68, 9, 0.3);
    }
    .info-row:last-child { border-bottom: none; }
    .info-label { color: #8a7a5a; }
    .info-value { color: #f5e6c8; }
    .info-value.ok { color: #4caf50; }
    .info-value.no { color: #ff4444; }

    .action-btn {
      width: 100%;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.5rem;
      padding: 14px;
      border: 2px solid #c9a84c;
      border-radius: 6px;
      background: linear-gradient(180deg, #5c4409 0%, #3a2a06 100%);
      color: #f5e6c8;
      cursor: pointer;
      margin-top: 12px;
      transition: all 0.2s;
    }
    .action-btn:hover { background: linear-gradient(180deg, #7a5c12 0%, #5c4409 100%); }
    .action-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .status-msg {
      font-size: 0.38rem;
      margin-top: 8px;
      min-height: 1.2em;
    }
    .status-msg.ok { color: #4caf50; }
    .status-msg.err { color: #ff4444; }

    .leaderboard-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.35rem;
      padding: 5px 0;
      border-bottom: 1px dashed rgba(92, 68, 9, 0.2);
    }
    .leaderboard-row:last-child { border-bottom: none; }
    .lb-rank { color: #c9a84c; width: 30px; flex-shrink: 0; }
    .lb-chad { color: #f5e6c8; flex: 1; padding: 0 8px; }
    .lb-score { color: #4caf50; }

    .connect-prompt {
      text-align: center;
      font-size: 0.45rem;
      color: #8a7a5a;
      padding: 40px 20px;
    }

    .no-tournaments {
      font-size: 0.38rem;
      color: #8a7a5a;
      text-align: center;
      padding: 16px 0;
    }

    /* Header */
    .header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: rgba(10, 10, 15, 0.85);
      border-bottom: 2px solid #3d2e0a;
      backdrop-filter: blur(8px);
    }

    .wallet-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.5rem;
      padding: 8px 14px;
      background: linear-gradient(180deg, #c9a84c 0%, #8b6914 100%);
      border: 2px solid #d4a017;
      border-radius: 4px;
      color: #1a1005;
      cursor: pointer;
    }
    .wallet-btn.connected { font-size: 0.45rem; }

    .wallet-wrapper { position: relative; }
    .disconnect-dropdown {
      display: none;
      position: absolute;
      top: 100%; right: 0;
      background: rgba(20, 14, 8, 0.97);
      border: 1px solid #5c4409;
      border-radius: 4px;
      padding: 4px;
      z-index: 200;
      min-width: 140px;
    }
    .disconnect-dropdown.show { display: block; }
    .disconnect-btn {
      width: 100%;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.4rem;
      padding: 8px 12px;
      background: transparent;
      border: none;
      color: #ff4444;
      cursor: pointer;
      text-align: left;
    }
    .disconnect-btn:hover { background: rgba(255,68,68,0.1); }
  </style>
</head>
<body>
  <header class="header">
    <div id="nav-placeholder"></div>
    <div class="wallet-wrapper">
      <button class="wallet-btn" id="walletBtn">Connect Wallet</button>
      <div class="disconnect-dropdown" id="disconnectDropdown">
        <button class="disconnect-btn" id="disconnectBtn">DISCONNECT</button>
      </div>
    </div>
  </header>

  <main class="container">
    <h1>TOURNAMENT</h1>
    <div class="sub-title">Members Only Casino Tournament</div>

    <!-- Tournament selector -->
    <div class="section">
      <div class="section-title">SELECT TOURNAMENT</div>
      <select id="tournamentSelect" class="tournament-select">
        <option value="">Loading tournaments...</option>
      </select>
      <div id="tournamentInfo"></div>
    </div>

    <!-- Not connected -->
    <div id="connectPrompt" class="connect-prompt">
      Connect wallet to enter tournament
    </div>

    <!-- Connected content -->
    <div id="tournamentContent" style="display:none">
      <div class="section">
        <div class="section-title">YOUR CHAD</div>
        <select id="chadSelect" class="chad-select">
          <option value="">Select a Chad...</option>
        </select>
        <div id="chadInfo"></div>
        <button class="action-btn" id="enterBtn" disabled>ENTER TOURNAMENT</button>
        <button class="action-btn" id="lockBtn" disabled style="margin-top:8px">LOCK SCORE</button>
        <div class="status-msg" id="actionMsg"></div>
      </div>
    </div>

    <!-- Leaderboard -->
    <div class="section" id="leaderboardSection" style="display:none">
      <div class="section-title">LEADERBOARD (<span id="lbCount">0</span>)</div>
      <div id="leaderboardList">
        <div class="no-tournaments">No entries yet</div>
      </div>
    </div>
  </main>

  <div id="wallet-modal-placeholder"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
  <script type="module">
    import {
      connectWallet, autoReconnect, disconnect,
      getSigner, getUserAddress, truncateAddress
    } from './js/wallet.js';
    import {
      CONTRACT_ADDRESS, READ_RPC, MEMBERS_ONLY_ABI,
      TOURNAMENT_ADDRESS, TOURNAMENT_ABI
    } from './js/config.js';

    const readProvider = new ethers.providers.JsonRpcProvider(READ_RPC);

    const tournamentSelect = document.getElementById('tournamentSelect');
    const chadSelect       = document.getElementById('chadSelect');
    const enterBtn         = document.getElementById('enterBtn');
    const lockBtn          = document.getElementById('lockBtn');
    const actionMsg        = document.getElementById('actionMsg');

    let selectedTournamentId = null;

    // ========== LOAD TOURNAMENTS ==========
    async function loadTournaments() {
      if (!TOURNAMENT_ADDRESS) {
        tournamentSelect.innerHTML = '<option value="">Tournament not deployed</option>';
        return;
      }
      try {
        const tc = new ethers.Contract(TOURNAMENT_ADDRESS, TOURNAMENT_ABI, readProvider);
        const nextId = await tc.nextTournamentId();
        const total = nextId.toNumber ? nextId.toNumber() : Number(nextId);

        tournamentSelect.innerHTML = '<option value="">Select a tournament...</option>';
        for (let i = 0; i < total; i++) {
          try {
            const t = await tc.getTournament(i);
            if (!t.active) continue;
            const now = Math.floor(Date.now() / 1000);
            if (Number(t.endTime) < now) continue;
            const opt = document.createElement('option');
            opt.value = i;
            opt.textContent = t.name + (t.chipCost > 0 ? ` (${t.chipCost} chips)` : ' (FREE)');
            tournamentSelect.appendChild(opt);
          } catch (_) {}
        }
        if (tournamentSelect.options.length === 1) {
          tournamentSelect.innerHTML = '<option value="">No active tournaments</option>';
        }
      } catch (err) {
        tournamentSelect.innerHTML = '<option value="">Failed to load</option>';
        console.error(err);
      }
    }

    // ========== SHOW TOURNAMENT INFO ==========
    async function showTournamentInfo(tournamentId) {
      const infoEl = document.getElementById('tournamentInfo');
      infoEl.textContent = '';
      document.getElementById('leaderboardSection').style.display = 'none';
      if (!TOURNAMENT_ADDRESS) return;
      try {
        const tc = new ethers.Contract(TOURNAMENT_ADDRESS, TOURNAMENT_ABI, readProvider);
        const t = await tc.getTournament(tournamentId);
        const now = Math.floor(Date.now() / 1000);
        const endDate = new Date(Number(t.endTime) * 1000).toLocaleDateString();

        const rows = [
          ['Status', Number(t.endTime) > now ? 'ACTIVE' : 'ENDED', Number(t.endTime) > now ? 'ok' : 'no'],
          ['Ends', endDate, ''],
          ['Entry Cost', t.chipCost > 0 ? t.chipCost + ' chips' : 'Free', ''],
          ['Starting Chips', t.tournamentChips.toString(), ''],
          ['Rebuy', t.rebuyAllowed ? 'Yes' : 'No', ''],
          ['Entries', t.entryCount.toString(), ''],
        ];
        rows.forEach(([label, val, cls]) => {
          const row = document.createElement('div');
          row.className = 'info-row';
          row.innerHTML = `<span class="info-label">${label}</span><span class="info-value ${cls}">${val}</span>`;
          infoEl.appendChild(row);
        });

        // Load leaderboard
        await loadLeaderboard(tournamentId);
      } catch (err) {
        console.error('Failed to load tournament info:', err);
      }
    }

    // ========== LEADERBOARD ==========
    async function loadLeaderboard(tournamentId) {
      const section = document.getElementById('leaderboardSection');
      const listEl  = document.getElementById('leaderboardList');
      const countEl = document.getElementById('lbCount');
      section.style.display = 'block';
      listEl.innerHTML = '';
      if (!TOURNAMENT_ADDRESS) return;
      try {
        const tc = new ethers.Contract(TOURNAMENT_ADDRESS, TOURNAMENT_ABI, readProvider);
        const lc = new ethers.Contract(CONTRACT_ADDRESS, MEMBERS_ONLY_ABI, readProvider);
        const count = await tc.getLeaderboardCount(tournamentId);
        const total = count.toNumber ? count.toNumber() : Number(count);
        countEl.textContent = total;
        if (total === 0) {
          listEl.innerHTML = '<div class="no-tournaments">No entries yet</div>';
          return;
        }
        const limit = Math.min(total, 50);
        const { tokenIds, scores } = await tc.getLeaderboard(tournamentId, 0, limit);
        for (let i = 0; i < tokenIds.length; i++) {
          const tid = tokenIds[i].toNumber ? tokenIds[i].toNumber() : Number(tokenIds[i]);
          const score = scores[i].toNumber ? scores[i].toNumber() : Number(scores[i]);
          let name = '';
          try { name = await lc.tokenName(tid); } catch (_) {}
          const row = document.createElement('div');
          row.className = 'leaderboard-row';
          row.innerHTML = `
            <span class="lb-rank">#${i + 1}</span>
            <span class="lb-chad">Chad #${tid}${name ? ' ' + name : ''}</span>
            <span class="lb-score">${score} chips</span>
          `;
          listEl.appendChild(row);
        }
      } catch (err) {
        listEl.innerHTML = '<div class="no-tournaments">Failed to load leaderboard</div>';
        console.error(err);
      }
    }

    // ========== LOAD USER CHADS ==========
    async function loadUserChads() {
      const addr = getUserAddress();
      if (!addr || !CONTRACT_ADDRESS) return;
      try {
        const lc = new ethers.Contract(CONTRACT_ADDRESS, MEMBERS_ONLY_ABI, readProvider);
        const balance = await lc.balanceOf(addr);
        chadSelect.innerHTML = '<option value="">Select a Chad...</option>';
        for (let i = 0; i < balance.toNumber(); i++) {
          const tokenId = await lc.tokenOfOwnerByIndex(addr, i);
          const name = await lc.tokenName(tokenId);
          const opt = document.createElement('option');
          opt.value = tokenId.toString();
          opt.textContent = '#' + tokenId + (name ? ' — ' + name : '');
          chadSelect.appendChild(opt);
        }
      } catch (err) {
        console.error('Failed to load chads:', err);
      }
    }

    // ========== LOAD ENTRY STATUS ==========
    async function loadEntryStatus(tournamentId, tokenId) {
      const infoEl = document.getElementById('chadInfo');
      infoEl.textContent = '';
      enterBtn.disabled = true;
      lockBtn.disabled = true;
      actionMsg.textContent = '';
      if (!TOURNAMENT_ADDRESS || !tournamentId) return;
      try {
        const tc = new ethers.Contract(TOURNAMENT_ADDRESS, TOURNAMENT_ABI, readProvider);
        const entry = await tc.getEntry(tournamentId, tokenId);
        const entered = entry.entered;
        const busted  = entry.busted;
        const tChips  = entry.tournamentChips.toNumber ? entry.tournamentChips.toNumber() : Number(entry.tournamentChips);
        const score   = entry.score.toNumber ? entry.score.toNumber() : Number(entry.score);

        const rows = [
          ['Entered', entered ? 'Yes' : 'No', entered ? 'ok' : ''],
          ['Tournament Chips', entered ? tChips.toString() : '—', ''],
          ['Locked Score', entered ? score.toString() : '—', score > 0 ? 'ok' : ''],
          ['Busted', busted ? 'Yes' : 'No', busted ? 'no' : ''],
        ];
        rows.forEach(([label, val, cls]) => {
          const row = document.createElement('div');
          row.className = 'info-row';
          row.innerHTML = `<span class="info-label">${label}</span><span class="info-value ${cls}">${val}</span>`;
          infoEl.appendChild(row);
        });

        enterBtn.disabled = entered && !busted;
        lockBtn.disabled = !entered || tChips === 0;
        enterBtn.textContent = busted ? 'REBUY' : (entered ? 'ENTERED' : 'ENTER TOURNAMENT');
      } catch (err) {
        console.error('Entry status load failed:', err);
      }
    }

    // ========== ENTER TOURNAMENT ==========
    enterBtn.addEventListener('click', async () => {
      const tokenId      = parseInt(chadSelect.value);
      const tournamentId = parseInt(tournamentSelect.value);
      if (!tokenId || isNaN(tournamentId) || !getSigner()) return;
      try {
        enterBtn.disabled = true;
        enterBtn.textContent = 'ENTERING...';
        actionMsg.textContent = '';
        const tc = new ethers.Contract(TOURNAMENT_ADDRESS, TOURNAMENT_ABI, getSigner());
        const tx = await tc.enterTournament(tournamentId, tokenId);
        await tx.wait();
        actionMsg.textContent = 'Entered! Good luck.';
        actionMsg.className = 'status-msg ok';
        await loadEntryStatus(tournamentId, tokenId);
        await loadLeaderboard(tournamentId);
      } catch (err) {
        actionMsg.textContent = err.reason || err.message || 'Entry failed';
        actionMsg.className = 'status-msg err';
        enterBtn.disabled = false;
        enterBtn.textContent = 'ENTER TOURNAMENT';
      }
    });

    // ========== LOCK SCORE ==========
    lockBtn.addEventListener('click', async () => {
      const tokenId      = parseInt(chadSelect.value);
      const tournamentId = parseInt(tournamentSelect.value);
      if (!tokenId || isNaN(tournamentId) || !getSigner()) return;
      try {
        lockBtn.disabled = true;
        lockBtn.textContent = 'LOCKING...';
        actionMsg.textContent = '';
        const tc = new ethers.Contract(TOURNAMENT_ADDRESS, TOURNAMENT_ABI, getSigner());
        const tx = await tc.lockScore(tournamentId, tokenId);
        await tx.wait();
        actionMsg.textContent = 'Score locked!';
        actionMsg.className = 'status-msg ok';
        await loadEntryStatus(tournamentId, tokenId);
        await loadLeaderboard(tournamentId);
      } catch (err) {
        actionMsg.textContent = err.reason || err.message || 'Lock failed';
        actionMsg.className = 'status-msg err';
        lockBtn.disabled = false;
        lockBtn.textContent = 'LOCK SCORE';
      }
    });

    // ========== SELECTORS ==========
    tournamentSelect.addEventListener('change', async () => {
      const val = tournamentSelect.value;
      selectedTournamentId = val !== '' ? parseInt(val) : null;
      if (selectedTournamentId !== null) {
        await showTournamentInfo(selectedTournamentId);
        const chadVal = chadSelect.value;
        if (chadVal) await loadEntryStatus(selectedTournamentId, parseInt(chadVal));
      } else {
        document.getElementById('tournamentInfo').textContent = '';
        document.getElementById('leaderboardSection').style.display = 'none';
      }
    });

    chadSelect.addEventListener('change', async () => {
      const val = chadSelect.value;
      if (val && selectedTournamentId !== null) {
        await loadEntryStatus(selectedTournamentId, parseInt(val));
      } else {
        document.getElementById('chadInfo').textContent = '';
        enterBtn.disabled = true;
        lockBtn.disabled = true;
      }
    });

    // ========== WALLET ==========
    const walletBtn        = document.getElementById('walletBtn');
    const disconnectDropdown = document.getElementById('disconnectDropdown');
    const disconnectBtn    = document.getElementById('disconnectBtn');

    function onConnected(addr) {
      walletBtn.textContent = truncateAddress(addr);
      walletBtn.classList.add('connected');
      document.getElementById('connectPrompt').style.display = 'none';
      document.getElementById('tournamentContent').style.display = 'block';
      loadUserChads();
      if (typeof closeWalletModal !== 'undefined') closeWalletModal();
    }

    function onDisconnected() {
      walletBtn.textContent = 'Connect Wallet';
      walletBtn.classList.remove('connected');
      document.getElementById('connectPrompt').style.display = 'block';
      document.getElementById('tournamentContent').style.display = 'none';
      disconnectDropdown.classList.remove('show');
    }

    walletBtn.addEventListener('click', () => {
      if (getUserAddress()) { disconnectDropdown.classList.toggle('show'); return; }
      connectWallet(null, { onConnected, onDisconnected }).catch(err => console.error(err));
    });

    disconnectBtn.addEventListener('click', () => {
      disconnectDropdown.classList.remove('show');
      disconnect(onDisconnected);
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.wallet-wrapper')) disconnectDropdown.classList.remove('show');
    });

    document.addEventListener('wallet-selected', e => {
      connectWallet(e.detail.wallet, { onConnected, onDisconnected })
        .catch(err => alert('Connection error: ' + (err.message || err)));
    });

    // ========== INIT ==========
    (async () => {
      await loadTournaments();
      await autoReconnect({ onConnected, onDisconnected });
    })();
  </script>
  <script src="js/wallet-modal.js"></script>
  <script src="nav.js"></script>
</body>
</html>
