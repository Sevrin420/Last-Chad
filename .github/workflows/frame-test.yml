name: Frame Test (5 Chads)

# Frames Chad_1 through Chad_5 as a test run
# Output: assets/Chads 333/framed/Chad_1.png ... Chad_5.png

on:
  workflow_dispatch:

jobs:
  frame-test:
    name: Frame 5 Chads
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Pillow
        run: pip install Pillow

      - name: Frame Chad_1 through Chad_5
        run: |
          python3 - <<'PYEOF'
          from PIL import Image
          import os

          SRC_DIR = "assets/Chads 333"
          FRAME   = "assets/frames/frame.png"
          OUT_DIR = "assets/Chads 333/framed"
          os.makedirs(OUT_DIR, exist_ok=True)

          frame = Image.open(FRAME).convert("RGBA")
          fw, fh = frame.size

          for i in range(1, 6):
              src = os.path.join(SRC_DIR, f"Chad_{i}.jpg")
              if not os.path.exists(src):
                  print(f"ERROR: {src} not found")
                  exit(1)
              chad = Image.open(src).convert("RGBA")
              chad = chad.resize((fw, fh), Image.LANCZOS)
              combined = Image.alpha_composite(chad, frame)
              out = os.path.join(OUT_DIR, f"Chad_{i}.png")
              combined.convert("RGB").save(out, "PNG", optimize=True)
              print(f"  Chad_{i}.png ✓")

          print("Done. 5 framed Chads saved to", OUT_DIR)
          PYEOF

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "assets/Chads 333/framed/"
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Frame test: Chad_1 through Chad_5"
            git pull --rebase origin main
            git push origin main
          fi
