name: Frame All Chads (333)

# Frames Chad_001 through Chad_333
# Output: assets/Chads 333/framed/Chad_001.png ... Chad_333.png

on:
  workflow_dispatch:

jobs:
  frame-all:
    name: Frame 333 Chads
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Pillow
        run: pip install Pillow

      - name: Frame Chad_001 through Chad_333
        run: |
          python3 - <<'PYEOF'
          from PIL import Image
          import os

          SRC_DIR = "assets/Chads 333"
          FRAME   = "assets/frames/frame.png"
          OUT_DIR = "assets/Chads 333/framed"
          os.makedirs(OUT_DIR, exist_ok=True)

          frame = Image.open(FRAME).convert("RGBA")
          fw, fh = frame.size

          # Inner window coordinates (transparent area of the frame)
          WIN_LEFT, WIN_TOP, WIN_RIGHT, WIN_BOTTOM = 163, 140, 730, 807
          win_w = WIN_RIGHT - WIN_LEFT
          win_h = WIN_BOTTOM - WIN_TOP

          for i in range(1, 334):
              src = os.path.join(SRC_DIR, f"Chad_{i:03d}.jpg")
              if not os.path.exists(src):
                  print(f"ERROR: {src} not found")
                  exit(1)

              chad = Image.open(src).convert("RGBA")
              cw, ch = chad.size

              # Scale up so the image is at least as wide AND tall as the window
              # then crop to exact window size from center — no stretching
              scale = max(win_w / cw, win_h / ch)
              chad = chad.resize((int(cw * scale), int(ch * scale)), Image.LANCZOS)
              cw, ch = chad.size
              left  = (cw - win_w) // 2
              top   = (ch - win_h) // 2
              chad  = chad.crop((left, top, left + win_w, top + win_h))

              # Paste into position on blank canvas, then composite frame on top
              canvas = Image.new("RGBA", (fw, fh), (0, 0, 0, 0))
              canvas.paste(chad, (WIN_LEFT, WIN_TOP))
              combined = Image.alpha_composite(canvas, frame)

              out = os.path.join(OUT_DIR, f"Chad_{i:03d}.png")
              combined.convert("RGB").save(out, "PNG", optimize=True)
              print(f"  Chad_{i:03d}.png ✓")

          print("Done. 333 framed Chads saved to", OUT_DIR)
          PYEOF

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "assets/Chads 333/framed/"
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Frame all: Chad_001 through Chad_333"
            git pull --rebase origin main
            git push origin main
          fi
