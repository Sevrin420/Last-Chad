name: Update WalletConnect Bundle

# Rebuilds /assets/walletconnect-provider.js from the latest
# @walletconnect/ethereum-provider npm package and commits it.
# Run from: Repo → Actions → "Update WalletConnect Bundle" → Run workflow

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: scripts
        run: |
          npm init -y
          npm install @walletconnect/ethereum-provider@latest esbuild

      - name: Build bundle
        working-directory: scripts
        run: |
          npx esbuild build-walletconnect-entry.mjs \
            --bundle \
            --format=iife \
            --outfile=../assets/walletconnect-provider.js \
            --minify \
            --platform=browser \
            --define:process.env.NODE_ENV='"production"' \
            --define:global=window \
            --log-level=info

      - name: Show bundle size
        run: ls -lh assets/walletconnect-provider.js

      - name: Commit updated bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/walletconnect-provider.js scripts/build-walletconnect-entry.mjs
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update WalletConnect EthereumProvider bundle to latest"
          git push origin main
