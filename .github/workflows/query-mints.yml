name: Query Mint History

on:
  workflow_dispatch:
    inputs:
      contract_address:
        description: 'Contract address to query'
        required: true
        default: '0xd8d166DcA70D7EF700A30ea071D8A01c6E451E78'
      network:
        description: 'Network'
        required: true
        default: 'avalanche'
        type: choice
        options:
          - fuji
          - avalanche

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Query mint events
        env:
          CONTRACT_ADDRESS: ${{ github.event.inputs.contract_address }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          npx hardhat run scripts/queryMints.js --network ${{ github.event.inputs.network }}
