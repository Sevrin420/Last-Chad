name: Deploy

# Trigger manually from GitHub Actions tab:
# Repo → Actions → "Deploy" → Run workflow → pick target
on:
  workflow_dispatch:
    inputs:
      network:
        description: 'Network'
        required: true
        default: 'fuji'
        type: choice
        options:
          - fuji
          - avalanche
      target:
        description: 'What to deploy'
        required: true
        default: 'everything'
        type: choice
        options:
          - everything       # Deploy all 3 contracts (MembersOnly + Items + Casino) + wire + worker
          - worker           # Cloudflare Worker only
          - verify           # Verify the 3 contracts on Snowtrace (no deploy)
          - fix-worker       # Sync config.js addresses into worker + redeploy (safe, no contract changes)
          - setup-invitation # Create invitation item + airdrop to wallets
          - airdrop-member   # Mint NFT + chips to a wallet
          - reset-tables     # Reset all 6 public craps tables (nuke stuck game state)

# ─────────────────────────────────────────────────────────────────────────────
# Required GitHub secrets (Repo → Settings → Secrets and variables → Actions):
#
#   DEPLOYER_PRIVATE_KEY  — deployer wallet private key (hex, no 0x prefix)
#   ORACLE_ADDRESS        — oracle wallet public address (for setOracle on-chain)
#   CF_API_TOKEN          — Cloudflare API token (Workers:Edit permission)
#   CF_ACCOUNT_ID         — Cloudflare account ID
#   ORACLE_PRIVATE_KEY    — oracle private key stored inside the Worker
#   AGORA_APP_CERT        — Agora App Certificate for RTC token generation
#   KV_NAMESPACE_ID       — RUNNER_KV production namespace ID
#   KV_PREVIEW_ID         — RUNNER_KV preview namespace ID
#   SNOWTRACE_API_KEY     — Snowtrace API key for contract verification
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Job 1: Deploy contracts
  # ───────────────────────────────────────────────────────────────────────────
  deploy-contract:
    name: Deploy Contracts (${{ inputs.network }})
    runs-on: ubuntu-latest
    if: inputs.target == 'everything'
    environment: mainnet

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Deploy everything (3 contracts + wiring)
        env:
          PRIVATE_KEY:    ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          ORACLE_ADDRESS: ${{ secrets.ORACLE_ADDRESS }}
        run: npx hardhat run scripts/deployEverything.js --network ${{ inputs.network }}

      - name: Commit updated config + game page
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add js/config.js worker/wrangler.toml games/clubnile.html
          if git diff --cached --quiet; then
            echo "config files unchanged — skipping commit"
          else
            git commit -m "chore: update contract addresses after ${{ inputs.network }} deploy [skip ci]"
            git push origin ${{ github.ref_name }}
          fi

  # ───────────────────────────────────────────────────────────────────────────
  # Job 2: Deploy Cloudflare Worker
  # always() lets this run even when deploy-contract was skipped (target=worker)
  # ───────────────────────────────────────────────────────────────────────────
  deploy-worker:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    needs: [deploy-contract]
    if: |
      always() &&
      (inputs.target == 'worker' ||
       (inputs.target == 'everything' && needs.deploy-contract.result == 'success'))

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci

      - name: Patch KV namespace IDs into wrangler.toml
        working-directory: worker
        env:
          KV_ID:      ${{ secrets.KV_NAMESPACE_ID }}
          KV_PREVIEW: ${{ secrets.KV_PREVIEW_ID }}
        run: |
          sed -i "s|REPLACE_WITH_KV_NAMESPACE_ID|${KV_ID}|g" wrangler.toml
          sed -i "s|REPLACE_WITH_KV_PREVIEW_ID|${KV_PREVIEW}|g" wrangler.toml

      - name: Deploy Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Push ORACLE_PRIVATE_KEY secret to Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          ORACLE_PRIVATE_KEY:    ${{ secrets.ORACLE_PRIVATE_KEY }}
        run: printf '%s' "$ORACLE_PRIVATE_KEY" | npx wrangler secret put ORACLE_PRIVATE_KEY

      - name: Push AGORA_APP_CERT secret to Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          AGORA_APP_CERT:        ${{ secrets.AGORA_APP_CERT }}
        run: |
          if [ -n "$AGORA_APP_CERT" ]; then
            printf '%s' "$AGORA_APP_CERT" | npx wrangler secret put AGORA_APP_CERT
          else
            echo "AGORA_APP_CERT not set — skipping"
          fi

  # ───────────────────────────────────────────────────────────────────────────
  # Job: Verify the 3 contracts on Snowtrace (read-only)
  # Reads addresses from js/config.js; no private key needed.
  # ───────────────────────────────────────────────────────────────────────────
  verify-contracts:
    name: Verify Contracts (${{ inputs.network }})
    runs-on: ubuntu-latest
    if: inputs.target == 'verify'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Verify MembersOnly + Items + Casino on Snowtrace
        env:
          SNOWTRACE_API_KEY: ${{ secrets.SNOWTRACE_API_KEY }}
          ORACLE_ADDRESS:    ${{ secrets.ORACLE_ADDRESS }}
        run: npx hardhat run scripts/verifyAll.js --network ${{ inputs.network }}

  # ───────────────────────────────────────────────────────────────────────────
  # Job: Fix Worker — sync addresses from js/config.js and redeploy
  # Safe to run anytime — no on-chain transactions.
  # ───────────────────────────────────────────────────────────────────────────
  fix-worker:
    name: Fix & Redeploy Worker
    runs-on: ubuntu-latest
    if: inputs.target == 'fix-worker'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync contract addresses from js/config.js → wrangler.toml
        working-directory: worker
        run: |
          CONTRACT=$(grep "CONTRACT_ADDRESS\b" ../js/config.js | head -1 | sed "s/.*'\(0x[a-fA-F0-9]*\)'.*/\1/")
          CASINO=$(grep "CASINO_ADDRESS" ../js/config.js | head -1 | sed "s/.*'\(0x[a-fA-F0-9]*\)'.*/\1/")
          RPC=$(grep "READ_RPC" ../js/config.js | head -1 | sed "s/.*'\(https[^']*\)'.*/\1/")

          echo "Contract: $CONTRACT"
          echo "Casino:   $CASINO"
          echo "RPC:      $RPC"

          sed -i "s|CONTRACT_ADDRESS.*=.*\"0x[a-fA-F0-9]*\"|CONTRACT_ADDRESS      = \"${CONTRACT}\"|" wrangler.toml
          sed -i "s|CASINO_ADDRESS.*=.*\"0x[a-fA-F0-9]*\"|CASINO_ADDRESS        = \"${CASINO}\"|" wrangler.toml
          sed -i "s|READ_RPC.*=.*\"https[^\"]*\"|READ_RPC              = \"${RPC}\"|" wrangler.toml

          echo "--- Updated wrangler.toml ---"
          cat wrangler.toml

      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci

      - name: Patch KV namespace IDs into wrangler.toml
        working-directory: worker
        env:
          KV_ID:      ${{ secrets.KV_NAMESPACE_ID }}
          KV_PREVIEW: ${{ secrets.KV_PREVIEW_ID }}
        run: |
          sed -i "s|REPLACE_WITH_KV_NAMESPACE_ID|${KV_ID}|g" wrangler.toml
          sed -i "s|REPLACE_WITH_KV_PREVIEW_ID|${KV_PREVIEW}|g" wrangler.toml

      - name: Deploy Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Push ORACLE_PRIVATE_KEY secret to Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          ORACLE_PRIVATE_KEY:    ${{ secrets.ORACLE_PRIVATE_KEY }}
        run: printf '%s' "$ORACLE_PRIVATE_KEY" | npx wrangler secret put ORACLE_PRIVATE_KEY

      - name: Push AGORA_APP_CERT secret to Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          AGORA_APP_CERT:        ${{ secrets.AGORA_APP_CERT }}
        run: |
          if [ -n "$AGORA_APP_CERT" ]; then
            printf '%s' "$AGORA_APP_CERT" | npx wrangler secret put AGORA_APP_CERT
          else
            echo "AGORA_APP_CERT not set — skipping"
          fi

      - name: Commit synced wrangler.toml
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add worker/wrangler.toml
          if git diff --cached --quiet; then
            echo "wrangler.toml already up to date — skipping commit"
          else
            git commit -m "chore: sync worker contract addresses from config.js [skip ci]"
            git push origin ${{ github.ref_name }}
          fi

  # ───────────────────────────────────────────────────────────────────────────
  # Job: Setup invitation item + airdrop
  # ───────────────────────────────────────────────────────────────────────────
  setup-invitation:
    name: Setup Invitation (${{ inputs.network }})
    runs-on: ubuntu-latest
    if: inputs.target == 'setup-invitation'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Create invitation item + airdrop
        env:
          PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          AIRDROP_WALLETS: ${{ vars.AIRDROP_WALLETS || '' }}
        run: npx hardhat run scripts/setupInvitation.js --network ${{ inputs.network }}

  # ───────────────────────────────────────────────────────────────────────────
  # Job: Airdrop a Member NFT + chips to a wallet
  # ───────────────────────────────────────────────────────────────────────────
  airdrop-member:
    name: Airdrop Member (${{ inputs.network }})
    runs-on: ubuntu-latest
    if: inputs.target == 'airdrop-member'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Mint NFT + award chips
        env:
          PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          AIRDROP_TO: ${{ vars.AIRDROP_TO || vars.AIRDROP_WALLETS }}
          AIRDROP_CHIPS: ${{ vars.AIRDROP_CHIPS || '0' }}
        run: npx hardhat run scripts/airdropMember.js --network ${{ inputs.network }}

  # ───────────────────────────────────────────────────────────────────────────
  # Job: Reset all public craps tables (nuke stuck game state in DOs)
  # ───────────────────────────────────────────────────────────────────────────
  reset-tables:
    name: Reset All Craps Tables
    runs-on: ubuntu-latest
    if: inputs.target == 'reset-tables'

    steps:
      - name: Reset all 6 public tables via /tables/reset-all
        env:
          ORACLE_PRIVATE_KEY: ${{ secrets.ORACLE_PRIVATE_KEY }}
        run: |
          WORKER_URL="https://last-chad-runner.severin20.workers.dev"
          echo "Resetting all public craps tables..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${WORKER_URL}/tables/reset-all" \
            -H "Authorization: Bearer ${ORACLE_PRIVATE_KEY}" \
            -H "Content-Type: application/json")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP ${HTTP_CODE}"
          echo "$BODY" | jq . 2>/dev/null || echo "$BODY"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Reset failed with HTTP ${HTTP_CODE}"
            exit 1
          fi
          echo "All tables reset successfully."
