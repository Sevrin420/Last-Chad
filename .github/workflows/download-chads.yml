name: Download Chads 333 from Google Drive

on:
  workflow_dispatch:

jobs:
  download:
    name: Pull Chads 333 into assets/
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install gdown
        run: pip install gdown

      - name: Download folder from Google Drive
        run: |
          gdown --folder "https://drive.google.com/drive/folders/13Zj2j2xGmHv0mpAEmDNUXGWLQGc7FADa" \
            --output "assets/Chads 333" \
            --remaining-ok
          echo "--- Downloaded files ---"
          ls -lh "assets/Chads 333/" | head -20
          echo "Total files: $(ls "assets/Chads 333/" | wc -l)"

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "assets/Chads 333/"
          if git diff --cached --quiet; then
            echo "No new files — folder may already be up to date"
          else
            git commit -m "Add Chads 333 images from Google Drive"
            git push origin main
          fi
