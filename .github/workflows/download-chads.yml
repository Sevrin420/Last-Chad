name: Download Chads 333 from Google Drive

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'What to do'
        required: true
        default: 'rename-only'
        type: choice
        options:
          - download             # Download from Drive only
          - rename-only          # Rename files in Chads 333 to Chad_1...Chad_333
          - frame-only           # Apply frame to already-downloaded files

jobs:
  download:
    name: Pull + Frame Chads 333
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pip install gdown Pillow

      - name: Download folder from Google Drive
        if: inputs.action == 'download'
        run: |
          pip install requests Pillow gdown -q
          python3 - <<'PYEOF'
          import requests, os, time

          FOLDER_ID = "13Zj2j2xGmHv0mpAEmDNUXGWLQGc7FADa"
          OUT_DIR   = "assets/Chads 333/333 Chads"
          os.makedirs(OUT_DIR, exist_ok=True)

          session = requests.Session()
          session.headers.update({"User-Agent": "Mozilla/5.0"})

          def list_files(folder_id):
              files = []
              page_token = None
              api = "https://www.googleapis.com/drive/v3/files"
              while True:
                  params = {
                      "q": f"'{folder_id}' in parents and trashed=false",
                      "fields": "nextPageToken,files(id,name,mimeType)",
                      "pageSize": 1000,
                      "supportsAllDrives": True,
                  }
                  if page_token:
                      params["pageToken"] = page_token
                  r = session.get(api, params=params)
                  if r.status_code == 200:
                      data = r.json()
                      files.extend(data.get("files", []))
                      page_token = data.get("nextPageToken")
                      if not page_token:
                          break
                  else:
                      break
              return files

          def download_file(file_id, dest_path):
              url = f"https://drive.google.com/uc?export=download&id={file_id}"
              r = session.get(url, stream=True)
              for key, val in r.cookies.items():
                  if "download_warning" in key.lower():
                      url += f"&confirm={val}"
                      r = session.get(url, stream=True)
                      break
              with open(dest_path, "wb") as f:
                  for chunk in r.iter_content(32768):
                      f.write(chunk)

          print("Listing files in folder...")
          files = list_files(FOLDER_ID)

          if not files:
              print("Public API returned no results, falling back to gdown...")
              import subprocess
              subprocess.run([
                  "gdown", "--folder",
                  f"https://drive.google.com/drive/folders/{FOLDER_ID}",
                  "--output", "assets/Chads 333",
                  "--remaining-ok"
              ], check=True)
          else:
              img_files = [f for f in files if not f["mimeType"].startswith("application/vnd.google-apps")]
              print(f"Found {len(img_files)} files. Downloading...")
              for i, f in enumerate(img_files, 1):
                  dest = os.path.join(OUT_DIR, f["name"])
                  if os.path.exists(dest):
                      print(f"  [{i}/{len(img_files)}] {f['name']} already exists, skipping")
                      continue
                  print(f"  [{i}/{len(img_files)}] {f['name']}")
                  download_file(f["id"], dest)
                  time.sleep(0.1)
              print(f"Done. {len(img_files)} files downloaded.")
          PYEOF

      - name: Rename files to Chad_1...Chad_333
        if: inputs.action == 'rename-only'
        run: |
          python3 - <<'PYEOF'
          import os, glob

          SRC_DIR = "assets/Chads 333"

          files = sorted([
              f for f in glob.glob(os.path.join(SRC_DIR, "*"))
              if f.lower().endswith((".png", ".jpg", ".jpeg", ".webp"))
          ])

          if not files:
              print("ERROR: No images found in", SRC_DIR)
              exit(1)

          print(f"Found {len(files)} images. Renaming...")

          # First pass: rename to temp names to avoid collisions
          for i, src in enumerate(files, start=1):
              os.rename(src, os.path.join(SRC_DIR, f"__tmp_{i}.jpg"))

          # Second pass: rename to final Chad_X.jpg names
          tmp_files = sorted(glob.glob(os.path.join(SRC_DIR, "__tmp_*.jpg")),
                             key=lambda x: int(x.split("__tmp_")[1].replace(".jpg","")))
          for i, src in enumerate(tmp_files, start=1):
              dest = os.path.join(SRC_DIR, f"Chad_{i:03d}.jpg")
              os.rename(src, dest)
              print(f"  Chad_{i:03d}.jpg")

          print(f"Done. {len(tmp_files)} files renamed.")
          PYEOF

      - name: Apply frame and rename Chad_1 … Chad_333
        if: inputs.action == 'frame-only'
        run: |
          python3 - <<'PYEOF'
          from PIL import Image
          import os, glob, sys

          SRC_DIR  = "assets/Chads 333"
          FRAME    = "assets/frames/frame.png"
          OUT_DIR  = "assets/chads/framed"
          os.makedirs(OUT_DIR, exist_ok=True)

          files = sorted([
              f for f in glob.glob(os.path.join(SRC_DIR, "**", "*"), recursive=True)
              if f.lower().endswith((".png", ".jpg", ".jpeg", ".webp"))
          ])

          if not files:
              print("ERROR: No images found in", SRC_DIR)
              sys.exit(1)

          print(f"Found {len(files)} images. Applying frame...")

          frame = Image.open(FRAME).convert("RGBA")
          fw, fh = frame.size

          for i, src_path in enumerate(files, start=1):
              chad = Image.open(src_path).convert("RGBA")
              chad = chad.resize((fw, fh), Image.LANCZOS)
              combined = Image.alpha_composite(chad, frame)
              out_path = os.path.join(OUT_DIR, f"Chad_{i}.png")
              combined.convert("RGB").save(out_path, "PNG", optimize=True)
              print(f"  [{i}/{len(files)}] {os.path.basename(src_path)} → Chad_{i}.png")

          print(f"Done. {len(files)} framed Chads saved to {OUT_DIR}/")
          PYEOF

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "assets/Chads 333/"
          git add "assets/chads/framed/" 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Chads 333: ${{ inputs.action }}"
            git pull --rebase origin main
            git push origin main
          fi
