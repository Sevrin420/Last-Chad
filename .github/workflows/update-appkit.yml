name: Update AppKit Bundle

# Rebuilds /assets/appkit.js from the latest @reown/appkit packages and commits it.
# Run from: Repo → Actions → "Update AppKit Bundle" → Run workflow

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: scripts
        run: |
          npm init -y
          npm install @reown/appkit@latest @reown/appkit-adapter-ethers@latest esbuild

      - name: Build bundle
        working-directory: scripts
        run: |
          npx esbuild build-appkit-entry.mjs \
            --bundle \
            --format=iife \
            --outfile=../assets/appkit.js \
            --minify \
            --platform=browser \
            --define:process.env.NODE_ENV='"production"' \
            --define:global=window \
            --log-level=info

      - name: Show bundle size
        run: ls -lh assets/appkit.js

      - name: Commit updated bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/appkit.js scripts/build-appkit-entry.mjs
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update AppKit bundle to latest"
          git push origin main
