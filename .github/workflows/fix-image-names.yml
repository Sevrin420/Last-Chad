name: Fix Image Names + Metadata

# Renames framed Chads from Chad_001.png → chad_1.png (no zero-padding, lowercase)
# and regenerates all 333 metadata files to point to the new names.
# No contract redeploy needed.

on:
  workflow_dispatch:

jobs:
  fix:
    name: Rename Images + Regenerate Metadata
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename framed images and regenerate metadata
        run: |
          python3 - <<'PYEOF'
          import os, json, shutil

          FRAMED_DIR = "assets/Chads 333/framed"
          META_DIR   = "metadata"
          BASE_URL   = "https://lastchad.xyz/assets/Chads%20333/framed"

          # Rename Chad_001.png → chad_1.png etc.
          renamed = 0
          for i in range(1, 334):
              old_name = f"Chad_{i:03d}.png"
              new_name = f"chad_{i}.png"
              old_path = os.path.join(FRAMED_DIR, old_name)
              new_path = os.path.join(FRAMED_DIR, new_name)
              if os.path.exists(old_path) and not os.path.exists(new_path):
                  shutil.move(old_path, new_path)
                  renamed += 1
                  print(f"  Renamed {old_name} → {new_name}")
              elif os.path.exists(new_path):
                  print(f"  Already exists: {new_name}")
              else:
                  print(f"  WARNING: {old_path} not found")

          print(f"\nRenamed {renamed} files.\n")

          # Regenerate all 333 metadata files with new image URLs
          for i in range(1, 334):
              folder = os.path.join(META_DIR, str(i))
              os.makedirs(folder, exist_ok=True)
              metadata = {
                  "name": f"Last Chad #{i}",
                  "description": "Last Chad \u2014 one of 333 NFT characters in a multiplayer Web3 RPG on Avalanche. Level up, quest, and compete in the endgame craps tournament.",
                  "image": f"{BASE_URL}/chad_{i}.png",
                  "attributes": [
                      {"trait_type": "Chad Number", "value": str(i)}
                  ]
              }
              out = os.path.join(folder, "index.html")
              with open(out, "w") as f:
                  f.write(json.dumps(metadata, ensure_ascii=False))
              print(f"  metadata/{i}/index.html → chad_{i}.png ✓")

          print("\nDone. 333 metadata files updated.")
          PYEOF

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "assets/Chads 333/framed/" metadata/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix image names: Chad_001.png → chad_1.png, update all metadata"
            git pull --rebase origin main
            git push origin main
          fi
