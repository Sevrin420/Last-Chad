name: Disable Broken Partner Contracts

# Tests each partner NFT contract's balanceOf() and disables any that revert.
# Run from: Repo → Actions → "Disable Broken Partner Contracts" → Run workflow
# Requires: OWNER_PRIVATE_KEY secret set in repo Settings → Secrets

on:
  workflow_dispatch:

jobs:
  disable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Disable broken partners
        env:
          PRIVATE_KEY: ${{ secrets.OWNER_PRIVATE_KEY }}
        run: npx hardhat run scripts/disable-partners.js --network avalanche
