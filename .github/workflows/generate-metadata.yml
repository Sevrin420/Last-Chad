name: Generate NFT Metadata (333)

# Creates/updates metadata/1 through metadata/333
# Each points to the framed Chad image hosted on GitHub Pages

on:
  workflow_dispatch:

jobs:
  generate:
    name: Generate 333 Metadata Files
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate metadata files
        run: |
          python3 - <<'PYEOF'
          import os, json

          BASE_URL = "https://lastchad.xyz/assets/Chads%20333/framed"
          META_DIR = "metadata"

          for i in range(1, 334):
              folder = os.path.join(META_DIR, str(i))
              os.makedirs(folder, exist_ok=True)

              metadata = {
                  "name": f"Last Chad #{i}",
                  "description": "Last Chad — one of 333 NFT characters in a multiplayer Web3 RPG on Avalanche. Level up, quest, and compete in the endgame craps tournament.",
                  "image": f"{BASE_URL}/Chad_{i:03d}.png",
                  "attributes": [
                      {"trait_type": "Chad Number", "value": str(i)}
                  ]
              }

              out = os.path.join(folder, "index.html")
              with open(out, "w") as f:
                  f.write(json.dumps(metadata))

              print(f"  metadata/{i}/index.html ✓")

          print("Done. 333 metadata files written.")
          PYEOF

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add metadata/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Generate metadata for all 333 framed Chads"
            git pull --rebase origin main
            git push origin main
          fi
