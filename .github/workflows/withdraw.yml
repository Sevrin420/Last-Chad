name: Withdraw AVAX to Owner

# Calls withdraw() on LastChad contract — sends all collected AVAX to owner wallet.
# Run from: Repo → Actions → "Withdraw AVAX to Owner" → Run workflow
# Requires: OWNER_PRIVATE_KEY secret set in repo Settings → Secrets

on:
  workflow_dispatch:

jobs:
  withdraw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Withdraw AVAX
        env:
          PRIVATE_KEY: ${{ secrets.OWNER_PRIVATE_KEY }}
        run: npx hardhat run scripts/withdraw.js --network avalanche
