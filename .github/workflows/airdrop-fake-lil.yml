name: Airdrop Fake Lil

# ─────────────────────────────────────────────────────────────────────────────
# Airdrops Fake Lil NFTs to a wallet address (owner only).
#
# Required secret:
#   DEPLOYER_PRIVATE_KEY  — owner wallet private key (hex, no 0x prefix)
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      contract_address:
        description: 'FakeLil contract address'
        required: true
        type: string
      recipient:
        description: 'Recipient wallet address'
        required: true
        default: '0xa3b4ac626e7896b65e25b794c278f5efa0ceb05a'
        type: string
      quantity:
        description: 'Number of NFTs to airdrop'
        required: true
        default: '6'
        type: string
      network:
        description: 'Target network'
        required: true
        default: 'avalanche'
        type: choice
        options:
          - avalanche
          - fuji

jobs:
  airdrop:
    name: Airdrop ${{ inputs.quantity }} Fake Lil → ${{ inputs.recipient }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run airdrop
        env:
          PRIVATE_KEY:     ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          FAKELIL_ADDRESS: ${{ inputs.contract_address }}
          RECIPIENT:       ${{ inputs.recipient }}
          QUANTITY:        ${{ inputs.quantity }}
        run: npx hardhat run scripts/airdropFakeLil.js --network ${{ inputs.network }}
