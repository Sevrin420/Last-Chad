name: Register Partner NFTs

# Registers all partner NFT collections on the LastChad contract.
# Safe to re-run — skips already-registered partners.

on:
  workflow_dispatch:

jobs:
  register:
    name: Register Partners (Avalanche Mainnet)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Register partner NFTs on-chain
        env:
          PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
        run: npx hardhat run scripts/registerPartners.js --network avalanche
