name: Compress Member Images

# Converts all images in assets/members/ to PNG ~250KB each and renames
# them member001.png, member002.png, etc.

on:
  workflow_dispatch:

jobs:
  compress:
    name: Compress & Rename
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick webp

      - name: Convert, compress and rename images
        run: |
          SRC="assets/members"
          OUT="assets/members-out"
          mkdir -p "$OUT"

          counter=1
          for img in $(find "$SRC" -maxdepth 1 -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.webp' \) | sort); do
            num=$(printf "%03d" $counter)
            tmp="/tmp/member_${num}.png"

            # Convert any format to PNG first
            if [[ "$img" == *.webp ]]; then
              dwebp "$img" -o "$tmp" 2>/dev/null
            else
              cp "$img" "$tmp"
            fi

            # Resize and compress to ~250KB using ImageMagick quality reduction
            convert "$tmp" -resize '1200x1200>' -quality 85 -define png:compression-level=9 "$OUT/member${num}.png"

            # If still too big, reduce further
            size_kb=$(( $(stat -c%s "$OUT/member${num}.png") / 1024 ))
            if [ "$size_kb" -gt 300 ]; then
              convert "$tmp" -resize '800x800>' -quality 80 -colors 256 -define png:compression-level=9 "$OUT/member${num}.png"
              size_kb=$(( $(stat -c%s "$OUT/member${num}.png") / 1024 ))
            fi

            echo "  $(basename $img) → member${num}.png (${size_kb}KB)"
            rm -f "$tmp"
            counter=$((counter + 1))
          done

          echo ""
          echo "── Results ──"
          echo "Images: $((counter - 1))"
          ORIG_SIZE=$(du -sh "$SRC" | cut -f1)
          NEW_SIZE=$(du -sh "$OUT" | cut -f1)
          echo "Original:   $ORIG_SIZE"
          echo "Compressed: $NEW_SIZE"

          # Replace originals
          rm -f "$SRC"/*.png "$SRC"/*.jpg "$SRC"/*.jpeg "$SRC"/*.webp
          mv "$OUT"/*.png "$SRC"/
          rmdir "$OUT"
          rm -f "$SRC/test"

          ls -lh "$SRC"

      - name: Commit compressed images
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/members/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Compress member NFT images: PNG ~250KB, member001.png naming"
            git push origin ${{ github.ref_name }}
          fi
