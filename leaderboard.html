<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; connect-src 'self' https://api.avax.network https://api.avax-test.network https://rpc.ankr.com https://last-chad-runner.severin20.workers.dev https://cloud.walletconnect.com wss://relay.walletconnect.com wss://relay.walletconnect.org https://*.walletconnect.org https://*.walletconnect.com https://api.web3modal.org; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://fonts.reown.com; frame-src https://verify.walletconnect.com;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard | Members Only</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="nav.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      font-family: 'Press Start 2P', monospace;
      color: #f5e6c8;
      overflow-x: hidden;
    }

    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image: url('assets/membersonly/membersbg.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    .bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 50% 30%, rgba(90,65,30,0.4) 0%, transparent 70%),
        linear-gradient(180deg, rgba(30,20,10,0.3) 0%, rgba(30,20,10,0.6) 100%);
    }

    .header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background: rgba(30,20,10,0.9);
      border-bottom: 2px solid #5c4409;
      backdrop-filter: blur(8px);
    }

    .page-title {
      font-size: clamp(0.6rem, 1.5vw, 0.9rem);
      color: #c9a84c;
    }

    main {
      position: relative;
      z-index: 1;
      max-width: 900px;
      margin: 80px auto 40px;
      padding: 0 16px;
    }

    /* ── Summary Stats ── */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    .summary-card {
      background: rgba(30,20,10,0.85);
      border: 2px solid #5c4409;
      border-radius: 6px;
      padding: 14px;
      text-align: center;
    }
    .summary-card .label {
      font-size: 0.36rem;
      color: #8a7a5a;
      margin-bottom: 8px;
    }
    .summary-card .value {
      font-size: 0.7rem;
      color: #c9a84c;
    }

    /* ── Player Table ── */
    .player-table {
      width: 100%;
      border-collapse: collapse;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.38rem;
    }
    .player-table th {
      text-align: left;
      padding: 10px 12px;
      color: #8a7a5a;
      border-bottom: 2px solid #5c4409;
      font-size: 0.34rem;
    }
    .player-table td {
      padding: 10px 12px;
      border-bottom: 1px solid #3d2e0a;
      color: #f5e6c8;
    }
    .player-table tr:hover td {
      background: rgba(92,68,9,0.2);
    }
    .rank-1 td { color: #ffd700; }
    .rank-2 td { color: #c0c0c0; }
    .rank-3 td { color: #cd7f32; }

    .loading-msg {
      text-align: center;
      padding: 40px;
      color: #8a7a5a;
      font-size: 0.45rem;
    }

    @media (max-width: 600px) {
      .player-table { font-size: 0.32rem; }
      .player-table th { font-size: 0.28rem; }
      .summary-grid { grid-template-columns: 1fr 1fr; }
    }

    @media (min-width: 900px) {
      main { max-width: 100%; }
    }
  </style>
</head>
<body>
  <div class="bg"></div>

  <header class="header">
    <div id="nav-placeholder"></div>
    <span class="page-title">LEADERBOARD</span>
  </header>

  <main>
    <!-- Summary Stats -->
    <div class="summary-grid" id="summaryGrid">
      <div class="summary-card"><div class="label">TOTAL MINTED</div><div class="value" id="statMinted">—</div></div>
      <div class="summary-card"><div class="label">MAX SUPPLY</div><div class="value" id="statMax">222</div></div>
      <div class="summary-card"><div class="label">TOP CHIPS</div><div class="value" id="statTopChips">—</div></div>
    </div>

    <!-- Players Table -->
    <div id="tab-players">
      <div class="loading-msg" id="playersLoading">Loading players...</div>
      <table class="player-table" id="playerTable" style="display:none;">
        <thead>
          <tr>
            <th>#</th>
            <th>CHAD</th>
            <th>CHIPS</th>
            <th>LEVEL</th>
            <th>TIER</th>
          </tr>
        </thead>
        <tbody id="playerBody"></tbody>
      </table>
    </div>
  </main>

  <script src="nav.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
  <script type="module">
    import { CONTRACT_ADDRESS, READ_RPC, MEMBERS_ONLY_ABI } from './js/config.js';

    const provider = new ethers.providers.JsonRpcProvider(READ_RPC);
    const nft = new ethers.Contract(CONTRACT_ADDRESS, MEMBERS_ONLY_ABI, provider);

    let players = [];

    async function loadAll() {
      if (!CONTRACT_ADDRESS) return;

      try {
        const total = await nft.totalMinted();
        const totalNum = total.toNumber ? total.toNumber() : Number(total);

        document.getElementById('statMinted').textContent = totalNum;

        // Load all players in parallel
        players = [];
        const batch = [];
        for (let i = 1; i <= totalNum; i++) {
          batch.push((async (tid) => {
            try {
              const [chips, level, tier, name] = await Promise.all([
                nft.getChips(tid),
                nft.getLevel(tid),
                nft.tokenTier(tid),
                nft.tokenName(tid).catch(() => ''),
              ]);
              players.push({
                tokenId: tid,
                name: name || ('CHAD #' + tid),
                chips: chips.toNumber ? chips.toNumber() : Number(chips),
                level: level.toNumber ? level.toNumber() : Number(level),
                tier: tier.toNumber ? tier.toNumber() : Number(tier),
              });
            } catch (_) {}
          })(i));
        }
        await Promise.all(batch);

        // Summary
        if (players.length > 0) {
          const topChips = Math.max(...players.map(p => p.chips));
          document.getElementById('statTopChips').textContent = topChips;
        }

        renderPlayers();

      } catch (err) {
        console.error('Leaderboard load error:', err);
        document.getElementById('playersLoading').textContent = 'Failed to load — check contract address';
      }
    }

    function renderPlayers() {
      document.getElementById('playersLoading').style.display = 'none';
      const table = document.getElementById('playerTable');
      const body  = document.getElementById('playerBody');

      const sorted = [...players].sort((a, b) => b.chips - a.chips);

      body.innerHTML = sorted.slice(0, 100).map((p, i) => {
        const rank = i + 1;
        const cls = rank <= 3 ? ` class="rank-${rank}"` : '';
        const tierStr = p.tier > 0 ? 'T' + p.tier : '—';
        return `<tr${cls}>
          <td>${rank}</td>
          <td>${p.name}</td>
          <td>${p.chips}</td>
          <td>${p.level}</td>
          <td>${tierStr}</td>
        </tr>`;
      }).join('');

      table.style.display = 'table';
    }

    loadAll();
  </script>
</body>
</html>
