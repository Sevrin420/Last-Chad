<html lang="en">
<head>

  <title>Docs | Members Only</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="nav.css">
  <style>
    /* ── the docs live inside the gold console screen ── */
    html, body {
      height: 100%;
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 0%, #1a1326 0%, #0c0912 70%) #0c0912;
    }
    body { display: flex; justify-content: center; align-items: center; }
    #console {
      position: relative;
      width: min(100vw, calc(100dvh * 832 / 1248));
      aspect-ratio: 832 / 1248;
      container-type: inline-size;
    }
    #console img.frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }
    #screen {
      position: absolute;
      left: 4.33%;
      top: 3.12%;
      width: 91.2%;
      height: 60.65%;
      z-index: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      background:
        url('assets/membersonly/membersbg.jpg') center / cover no-repeat #0a0a0f;
    }
    #bezel {
      position: absolute;
      left: 3.37%;
      top: 2.56%;
      width: 93.24%;
      height: 61.77%;
      z-index: 3;
      pointer-events: none;
      border-style: solid;
      border-color: #0a0810;
      border-width: 0.84cqw 1.08cqw 0.84cqw 0.96cqw;
    }
    #bezel-in {
      position: absolute;
      left: 4.03%;
      top: 2.92%;
      width: 91.8%;
      height: 61.05%;
      z-index: 3;
      pointer-events: none;
      border: 0.3cqw solid #34303c;
    }
    .bg { display: none; }
    .header { position: sticky; top: 0; }
    .main { padding: 24px 16px 48px; }
    .lobby-btn {
      display: block;
      margin: 24px auto 8px;
      padding: 20px 32px;
      font-family: 'Press Start 2P', monospace;
      font-size: 1rem;
      color: #0a0a0f;
      background: #c9a84c;
      border: none;
      border-bottom: 6px solid #7a6020;
      border-right: 6px solid #7a6020;
      cursor: pointer;
      image-rendering: pixelated;
      letter-spacing: 0.05em;
    }
    .lobby-btn:hover {
      background: #e8c060;
      border-color: #5c4409;
    }
    .lobby-btn:active {
      border-bottom-width: 2px;
      border-right-width: 2px;
      transform: translate(4px, 4px);
    }
    #lobby-scene {
      margin-top: 12px;
    }
    #lobby1-img {
      max-width: 220px;
      width: 50%;
      display: block;
      margin: 0 auto;
      opacity: 0;
      transition: opacity 1.2s ease;
    }
    #lobby-text-box {
      margin-top: 12px;
      text-align: center;
      min-height: 2rem;
    }
    #lobby-line {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.65rem;
      color: #c9a84c;
      line-height: 2.2;
      opacity: 0;
      transition: opacity 0.45s ease;
    }
    #lobby-choices {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
      margin-top: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }
    .lobby-choice-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.6rem;
      color: #0a0a0f;
      background: #c9a84c;
      border: none;
      border-bottom: 5px solid #7a6020;
      border-right: 5px solid #7a6020;
      padding: 14px 20px;
      cursor: pointer;
      letter-spacing: 0.04em;
      width: 100%;
      max-width: 360px;
      text-align: center;
    }
    .lobby-choice-btn:hover {
      background: #e8c060;
      border-color: #5c4409;
    }
    .lobby-choice-btn:active {
      border-bottom-width: 2px;
      border-right-width: 2px;
      transform: translate(3px, 3px);
    }

    /* ===== Inline Dice Game ===== */
    #lobby-dice-section {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }
    .dice-row { display: flex; justify-content: center; gap: 8px; }
    .dice-col { display: flex; flex-direction: column; align-items: center; gap: 8px; perspective: 400px; }
    .dice-box {
      width: clamp(52px, 14vw, 80px);
      height: clamp(52px, 14vw, 80px);
      background: linear-gradient(145deg,
        #f8f8f8 0%,
        #e6e6e6 18%,
        #d2d2d2 36%,
        #c4c4c4 52%,
        #b2b2b2 68%,
        #a2a2a2 82%,
        #929292 100%
      );
      border: 2px solid #9a9a9a;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: border-color 0.2s, box-shadow 0.2s;
      box-shadow:
        inset 3px 3px 8px rgba(255, 255, 255, 0.88),
        inset -2px -2px 6px rgba(0, 0, 0, 0.28),
        2px 2px 0 #878787,
        3px 3px 0 #767676,
        4px 4px 0 #656565,
        5px 5px 12px rgba(0, 0, 0, 0.72);
    }
    @keyframes dice-tumble {
      0%   { transform: rotateX(0deg)   rotateZ(0deg); }
      100% { transform: rotateX(360deg) rotateZ(270deg); }
    }
    .dice-box.rolling {
      animation: dice-tumble 0.28s linear infinite;
      border-color: #c9a84c;
      box-shadow:
        inset 3px 3px 8px rgba(255, 255, 255, 0.88),
        inset -2px -2px 6px rgba(0, 0, 0, 0.28),
        2px 2px 0 #878787,
        3px 3px 0 #767676,
        4px 4px 0 #656565,
        5px 5px 12px rgba(0, 0, 0, 0.72),
        0 0 18px rgba(201, 168, 76, 0.45);
    }
    .dice-box.kept {
      border-color: #4caf50;
      box-shadow:
        inset 3px 3px 8px rgba(255, 255, 255, 0.88),
        inset -2px -2px 6px rgba(0, 0, 0, 0.24),
        2px 2px 0 #878787,
        3px 3px 0 #767676,
        4px 4px 0 #656565,
        5px 5px 12px rgba(0, 0, 0, 0.72),
        0 0 12px rgba(76, 175, 80, 0.35);
    }
    .dice-box.settled { border-color: #c9a84c; }
    .dice-face {
      width: 100%; height: 100%;
      display: grid;
      grid-template-rows: 1fr 1fr 1fr;
      grid-template-columns: 1fr 1fr 1fr;
      padding: 14%; gap: 2px;
    }
    .dice-face .dot {
      width: 100%; aspect-ratio: 1; background: #111; border-radius: 50%;
      box-shadow:
        inset 1px 1px 3px rgba(0, 0, 0, 0.95),
        0 1px 1px rgba(255, 255, 255, 0.18);
    }
    .dice-box.kept .dice-face .dot {
      background: #111;
      box-shadow:
        inset 1px 1px 3px rgba(0, 0, 0, 0.95),
        0 1px 1px rgba(255, 255, 255, 0.18);
    }
    .dot { visibility: hidden; }
    .keep-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(0.3rem, 1.5vw, 0.4rem);
      padding: 6px 0;
      width: clamp(52px, 14vw, 80px);
      color: #8a7a5a;
      background: rgba(61, 46, 10, 0.3);
      border: 3px solid #3d2e0a;
      cursor: pointer;
      transition: all 0.15s;
      touch-action: manipulation;
      box-shadow: inset -2px -2px 0 #1a1200, inset 2px 2px 0 #5c4409, 2px 2px 0 #000;
    }
    .keep-btn:hover { border-color: #5c4409; color: #c9a84c; }
    .keep-btn.active { border-color: #4caf50; color: #4caf50; background: rgba(76,175,80,0.1); }
    .keep-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .roll-section { margin-top: 20px; text-align: center; }
    .roll-btn {
      padding: 14px 40px;
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(0.65rem, 2.5vw, 0.85rem);
      color: #fff;
      background: linear-gradient(180deg, #c9a84c 0%, #8b6914 50%, #5c4409 100%);
      border: 3px solid #d4a017;
      border-radius: 6px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.2s;
      text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
      box-shadow: inset 0 2px 0 rgba(255,220,120,0.4), inset 0 -2px 0 rgba(0,0,0,0.4), 0 4px 0 #3d2e0a, 0 6px 15px rgba(0,0,0,0.5);
      touch-action: manipulation;
      animation: roll-glow 2s ease-in-out infinite;
    }
    .roll-btn:hover { animation: none; background: linear-gradient(180deg, #dabb5e 0%, #a07d1e 50%, #6b5010 100%); border-color: #f5e6c8; }
    .roll-btn:active { transform: translateY(3px); box-shadow: inset 0 2px 4px rgba(0,0,0,0.5), 0 1px 0 #3d2e0a; }
    .roll-btn:disabled { opacity: 0.4; cursor: not-allowed; animation: none; }
    @keyframes roll-glow {
      0%,100% { box-shadow: inset 0 2px 0 rgba(255,220,120,0.4), inset 0 -2px 0 rgba(0,0,0,0.4), 0 4px 0 #3d2e0a, 0 6px 15px rgba(0,0,0,0.5), 0 0 15px rgba(139,105,20,0.2); }
      50%      { box-shadow: inset 0 2px 0 rgba(255,220,120,0.4), inset 0 -2px 0 rgba(0,0,0,0.4), 0 4px 0 #3d2e0a, 0 6px 15px rgba(0,0,0,0.5), 0 0 28px rgba(201,168,76,0.4); }
    }
    .rolls-left { margin-top: 12px; font-size: 0.4rem; color: #8a7a5a; font-family: 'Press Start 2P', monospace; }
    .score-box {
      display: flex; margin-top: 20px; padding: 18px 24px;
      background: #0a0a0f; border: 3px solid #5c4409; border-radius: 6px;
      min-width: 260px; gap: 20px; align-items: flex-start;
    }
    .checklist { display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; }
    .check-item {
      display: flex; align-items: center; gap: 10px;
      font-size: clamp(0.45rem, 2vw, 0.6rem);
      color: #e53935; transition: color 0.3s;
      font-family: 'Press Start 2P', monospace;
    }
    .check-item.checked { color: #4caf50; }
    .check-box {
      width: 22px; height: 22px; border: 3px solid #e53935;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: border-color 0.3s, background 0.3s;
    }
    .check-item.checked .check-box { border-color: #4caf50; background: rgba(76,175,80,0.15); }
    .check-mark { display: none; color: #4caf50; font-size: 1.4rem; line-height: 0; margin-top: -2px; }
    .check-item.checked .check-mark { display: block; }
    .score-right {
      flex: 1; text-align: center; display: flex;
      flex-direction: column; align-items: center; justify-content: center; min-height: 80px;
    }
    .score-label { font-size: clamp(0.55rem, 2.5vw, 0.75rem); color: #8a7a5a; margin-bottom: 10px; line-height: 2; font-family: 'Press Start 2P', monospace; }
    .score-value { font-size: clamp(1.8rem, 7vw, 3rem); color: #c9a84c; font-family: 'Press Start 2P', monospace; }
    .score-box.no-score .score-label { color: #e53935; }
    .score-box.no-score .score-value { color: #e53935; }

    /* --- Wallet Button --- */
    .wallet-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.55rem;
      padding: 10px 18px;
      background: linear-gradient(180deg, #c9a84c 0%, #8b6914 100%);
      border: 2px solid #d4a017;
      border-radius: 4px;
      color: #1a1005;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: inset 0 1px 0 rgba(255, 220, 120, 0.4), 0 2px 6px rgba(0, 0, 0, 0.5);
    }
    .wallet-btn:hover {
      background: linear-gradient(180deg, #dabb5e 0%, #a07d1e 100%);
      box-shadow: inset 0 1px 0 rgba(255, 220, 120, 0.5), 0 2px 10px rgba(201, 168, 76, 0.4);
    }
    .wallet-btn.connected {
      background: linear-gradient(180deg, #c9a84c 0%, #8b6914 100%);
      border-color: #d4a017;
      color: #1a1005;
      font-size: 0.5rem;
    }
    .wallet-wrapper { position: relative; }
    .disconnect-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      background: linear-gradient(180deg, #1e1608 0%, #140f05 100%);
      border: 2px solid #5c4409;
      border-radius: 4px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.7);
      z-index: 110;
      min-width: 160px;
    }
    .disconnect-dropdown.show { display: block; }
    .disconnect-btn {
      width: 100%;
      padding: 12px 16px;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.45rem;
      color: #e53935;
      background: none;
      border: none;
      cursor: pointer;
      text-align: center;
      transition: background 0.15s;
    }
    .disconnect-btn:hover { background: rgba(229, 57, 53, 0.15); }

    /* --- Wallet Modal --- */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: linear-gradient(180deg, #1e1608 0%, #140f05 100%);
      border: 3px solid #5c4409;
      border-radius: 8px;
      padding: 28px 24px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(139, 105, 20, 0.15);
    }
    .modal-title {
      font-size: 0.7rem;
      color: #c9a84c;
      text-align: center;
      margin-bottom: 24px;
    }
    .wallet-option {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 10px;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.5rem;
      color: #f5e6c8;
      background: rgba(61, 46, 10, 0.3);
      border: 2px solid #3d2e0a;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .wallet-option:hover {
      border-color: #8b6914;
      background: rgba(92, 68, 9, 0.3);
      box-shadow: 0 0 10px rgba(139, 105, 20, 0.2);
    }
    .wallet-option:active { transform: scale(0.97); }
    .wallet-icon {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
    }
    .modal-close {
      display: block;
      margin: 16px auto 0;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.45rem;
      color: #5c4409;
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
    }
    .modal-close:hover { color: #c9a84c; }

    /* === Desktop === */
    @media (min-width: 900px) {
      #lobby-dice-section { max-width: 100%; }
      .lobby-choice-btn { max-width: 100%; }
      #lobby1-img { max-width: 100%; }
    }

    /* === Collapsible Sections === */
    .doc-toggle {
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 0;
      padding: 0;
    }
    .doc-toggle::after {
      content: '▶';
      font-size: 1rem;
      color: #f7931a;
      transition: transform 0.25s ease, color 0.2s;
      flex-shrink: 0;
    }
    .doc-section.open .doc-toggle::after {
      transform: rotate(90deg);
      color: #f7931a;
    }
    .doc-toggle:hover::after { color: #ffb84d; }
    .doc-body {
      display: none;
      margin-top: 16px;
    }
    .doc-section.open .doc-body { display: block; }

    /* === Stat Bonuses Section === */
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 16px 0;
    }
    @media (min-width: 600px) { .stat-grid { grid-template-columns: repeat(4, 1fr); } }
    .stat-card {
      background: rgba(10,8,3,0.5);
      border: 2px solid #3a2a0a;
      border-radius: 4px;
      padding: 14px 10px;
      text-align: center;
    }
    .stat-card .stat-icon { font-size: 1.4rem; margin-bottom: 8px; display: block; }
    .stat-card .stat-name {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.42rem;
      color: #c9a84c;
      letter-spacing: 1px;
      display: block;
      margin-bottom: 8px;
    }
    .stat-card .stat-desc {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.35rem;
      color: #8a7a5a;
      line-height: 1.8;
      display: block;
    }
    .stat-rule-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 12px;
      padding: 12px 14px;
      background: rgba(10,8,3,0.4);
      border-left: 3px solid #c9a84c;
    }
    .stat-rule-row .rule-icon { font-size: 1rem; flex-shrink: 0; margin-top: 2px; }
    .stat-rule-row p { margin: 0 !important; font-size: 0.38rem; line-height: 2; color: #d4c4a0; }
  </style>
</head>
<body>

<div id="console">
  <div id="screen">

  <header class="header">
    <div id="nav-placeholder"></div>
    <span class="header-title">DOCS</span>
    <div class="wallet-wrapper">
      <button class="wallet-btn" id="walletBtn">Connect Wallet</button>
      <div class="disconnect-dropdown" id="disconnectDropdown">
        <button class="disconnect-btn" id="disconnectBtn">DISCONNECT</button>
      </div>
    </div>
  </header>

  <main class="main">

    <div style="position: relative; background: rgba(0,0,0,0.85); border: 2px solid #5a3d00; border-radius: 6px; padding: 20px 24px; margin-bottom: 24px; font-size: 0.65rem; line-height: 2.2; overflow: hidden;">
      <img src="assets/membersonly/docs_dealer.png" alt="Dealer" style="position: absolute; right: 0; bottom: 0; width: 30%; image-rendering: pixelated; z-index: 0;">
      <p style="text-align: center; margin-bottom: 2px !important; font-size: 1.1rem; font-family: 'Press Start 2P', monospace; color: #ffffff !important; position: relative; z-index: 1;">Members Only</p>
      <p style="text-align: center; margin-bottom: 14px !important; font-size: 0.55rem; color: #e8c060 !important; position: relative; z-index: 1;">(a private casino)</p>
      <p style="color: #4caf50 !important; margin-bottom: 6px !important; font-weight: bold; letter-spacing: 1px; position: relative; z-index: 1;">&#9670; Supply: <span style="color: #66bb6a !important;">222</span></p>
      <p style="color: #4caf50 !important; margin-bottom: 0 !important; font-weight: bold; letter-spacing: 1px; position: relative; z-index: 1;">&#9670; Mint: <span style="color: #66bb6a !important;">0.01 Avax</span></p>
    </div>

    <!-- CHIPS -->
    <div class="doc-section">
      <h2 class="doc-toggle" style="color: #e8c060; font-size: 0.975rem;">&#127922; CHIPS</h2>
      <div class="doc-body"></div>
    </div>

    <!-- TIERS & LEVELS -->
    <div class="doc-section">
      <h2 class="doc-toggle" style="color: #c9a84c; font-size: 0.975rem;">&#9670; TIERS &amp; LEVELS</h2>
      <div class="doc-body"></div>
    </div>

    <!-- CRAPS -->
    <div class="doc-section">
      <h2 class="doc-toggle" style="color: #f7931a; font-size: 0.975rem;">&#127922; CRAPS</h2>
      <div class="doc-body"></div>
    </div>

    <!-- TOURNAMENTS -->
    <div class="doc-section">
      <h2 class="doc-toggle" style="color: #f7931a; font-size: 0.975rem;">&#9733; TOURNAMENTS</h2>
      <div class="doc-body"></div>
    </div>

    <!-- MARKET -->
    <div class="doc-section">
      <h2 class="doc-toggle" style="color: #e8c060; font-size: 0.975rem;">&#9851; MARKET</h2>
      <div class="doc-body"></div>
    </div>

  </main>

  <!-- Wallet Modal -->
  <div id="wallet-modal-placeholder"></div>

  </div><!-- /#screen -->
  <img class="frame" src="assets/membersonly/egypt-console.png" alt="Members Only console">
  <div id="bezel"></div>
  <div id="bezel-in"></div>
</div><!-- /#console -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
  <script src="nav.js"></script>
  <script type="module">
    import { connectWallet, autoReconnect, disconnect, getSigner, truncateAddress } from './js/wallet.js';

    const walletBtn = document.getElementById('walletBtn');

    const disconnectDropdown = document.getElementById('disconnectDropdown');
    const disconnectBtn = document.getElementById('disconnectBtn');

    let userAddress = null;

    function onConnected(addr) {
      userAddress = addr;
      walletBtn.textContent = truncateAddress(addr);
      walletBtn.classList.add('connected');
      closeWalletModal();
    }

    function onDisconnected() {
      userAddress = null;
      walletBtn.textContent = 'Connect Wallet';
      walletBtn.classList.remove('connected');
    }

    // ========== MODAL EVENTS ==========
    walletBtn.addEventListener('click', () => {
      if (userAddress) { disconnectDropdown.classList.toggle('show'); return; }
      openWalletModal();
    });

    disconnectBtn.addEventListener('click', () => {
      disconnectDropdown.classList.remove('show');
      disconnect(onDisconnected);
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.wallet-wrapper')) disconnectDropdown.classList.remove('show');
    });

    document.addEventListener('wallet-selected', e => {
      connectWallet(e.detail.wallet, { onConnected, onDisconnected })
        .catch(err => { console.error('Wallet connection error:', err); alert('Connection error: ' + (err.message || err)); });
    });

    // ========== AUTO-RECONNECT ==========
    autoReconnect({ onConnected, onDisconnected });

    // ========== COLLAPSIBLE SECTIONS ==========
    document.querySelectorAll('.doc-toggle').forEach(h2 => {
      h2.addEventListener('click', () => {
        h2.closest('.doc-section').classList.toggle('open');
      });
    });

  </script>
  <script src="js/wallet-modal.js"></script>
  <script src="nav.js"></script>
</body>
</html>
