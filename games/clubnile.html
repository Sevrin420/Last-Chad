'use strict';
/* ==========================================================================
   CLUB NILE — a 1920s Egyptian speakeasy casino (top-down, LTTP-style).
   Scenes: 'floor' · 'blackjack' · 'craps'.

   MULTIPLAYER: real players only at the tables. A lightweight WebSocket
   layer connects to the Worker's ClubNileRoom Durable Object:
     'lobby' room     — casino-wide chat (always connected)
     'craps'/'blackjack' rooms — table presence, emoji reactions, chip tips
   Game hands/rolls stay client-side for now; when wallet sign-in lands,

   ========================================================================== */

const TS = 16, COLS = 15, ROWS = 15, W = 240, H = 240;

const ctx = cvs.getContext('2d');
/* 2x supersampled backing store: the game still thinks in 240x240, but
   every asset can carry half-pixel detail — the jump from NES chunk to
   SNES polish */

ctx.imageSmoothingEnabled = false;

/* ---------------------------- palette ---------------------------- */
/* SNES-grade palette: every material gets a 3-4 tone ramp
   (highlight / base / shadow) instead of a single flat NES colour */

  floorA:'#f4e2b0', floorB:'#e8d194', floorC:'#d9bd7e', floorDot:'#c4a263',
  wall:'#d2a259', wallLight:'#eac272', wallDark:'#a87e3f', wallLine:'#8a6733',

  feltGreen:'#2f8a56', feltGreenHi:'#45aa6e', feltGreenDark:'#226844',
  feltBlue:'#2f55a0', feltBlueHi:'#4272c2', feltBlueDark:'#24437e',
  gold:'#ffdf7a', goldHi:'#fff2b8', goldDark:'#cfa63e',
  white:'#f9f5ea', black:'#17121a',
  red:'#c0392b', dim:'#8d8398',
  flame1:'#ffb347', flame2:'#ffd97a', flame3:'#ff8c42',
  leaf:'#4bb367', leafHi:'#66cc78', leafDark:'#31804a',

/* deterministic 2D hash for dithering/texture */

/* ============================ sprites ============================ */

   H hat  h hat band  G gold accent  K hair  S skin  s skin shade
   E eye  T top  t top accent  u top shade  B bottom  b bottom shade

const HEADS = {

const LEGS = {

    ['....BBB..BBB....','....BBB..BBB....','....bbb..bbb....','....FFF..FFF....','....fff..fff....'],
    ['...BBB....BBB...','...BBB....BBB...','...bbb....bbb...','...FFF....FFF...','..fff......fff..']
  ],

function paintRows(g, rows, pal, yOff) {
  for (let y = 0; y < rows.length; y++) {
    const r = rows[y];
    for (let x = 0; x < r.length; x++) {
      const ch = r[x];
      if (ch === '.' || !pal[ch]) continue;
      g.fillStyle = pal[ch];
      g.fillRect(x, y + yOff, 1, 1);
    }

/* SNES-ifier: dark selective outline + top-light shading pass, the way
   LTTP sprites read — light from above, shadow on the underside edges */
function snesify(c) {
  const w = c.width, h = c.height;
  const g = c.getContext('2d');
  const src = g.getImageData(0, 0, w, h);
  const out = g.createImageData(w, h);
  const A = (x, y) => (x < 0 || y < 0 || x >= w || y >= h) ? 0 : src.data[(y * w + x) * 4 + 3];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = (y * w + x) * 4;
    if (src.data[i + 3] > 0) {
      let r = src.data[i], gg = src.data[i + 1], b = src.data[i + 2];
      if (A(x, y - 1) === 0) { r = Math.min(255, r * 1.22 + 12); gg = Math.min(255, gg * 1.22 + 12); b = Math.min(255, b * 1.18 + 8); }
      else if (A(x, y + 1) === 0 || A(x + 1, y) === 0) { r *= 0.76; gg *= 0.76; b *= 0.8; }
      out.data[i] = r; out.data[i + 1] = gg; out.data[i + 2] = b; out.data[i + 3] = 255;
    } else if (A(x - 1, y) || A(x + 1, y) || A(x, y - 1) || A(x, y + 1)) {
      out.data[i] = 38; out.data[i + 1] = 22; out.data[i + 2] = 26; out.data[i + 3] = 255;
    }
  }
  g.putImageData(out, 0, 0);
}
function buildFrame(head, body, legs, pal, mirror) {
  /* 18x24 logical frame, 2x backing → snesify runs at half-pixel
     resolution for fine outlines and smooth top-light modelling */
  const c = document.createElement('canvas');
  c.width = 36; c.height = 48;
  c.lw = 18; c.lh = 24;
  const g = c.getContext('2d');
  g.setTransform(2, 0, 0, 2, 0, 0);
  g.imageSmoothingEnabled = false;
  g.translate(1, 1);
  paintRows(g, head, pal, 0);
  paintRows(g, body, pal, 10);
  paintRows(g, legs, pal, 17);
  g.setTransform(1, 0, 0, 1, 0, 0);
  snesify(c);
  if (!mirror) return c;
  const m = document.createElement('canvas');
  m.width = 36; m.height = 48;
  m.lw = 18; m.lh = 24;
  const mg = m.getContext('2d');
  mg.translate(36, 0); mg.scale(-1, 1);
  mg.drawImage(c, 0, 0);
  return m;
}
function makeCharacter(headStyle, bodyStyle, pal) {
  const hd = HEADS[headStyle], bd = BODIES[bodyStyle], lg = LEGS[bodyStyle];
  const out = {};
  out.down  = [0,1].map(f => buildFrame(hd.down, bd, lg[f], pal, false));
  out.up    = [0,1].map(f => buildFrame(hd.up,   bd, lg[f], pal, false));
  out.left  = [0,1].map(f => buildFrame(hd.side, bd, lg[f], pal, false));
  out.right = [0,1].map(f => buildFrame(hd.side, bd, lg[f], pal, true));
  return out;
}

/* ==================== HD character pipeline (LTTP-grade) ====================
   Grids are authored at HALF-PIXEL cells (32x44 per frame vs the old 16x22),
   which is where SNES-style faces, lapels and hands come from. Colours are
   TRAIT-DRIVEN: a character is just { skin, hat, hair, coat, pants, ... }
   base colours, and ramp() derives the warm-highlight / cool-shadow 3-tone
   ramp for each material the way LTTP palettes do. This is the foundation
   for the 333 NFT characters: each NFT's metadata traits (head style, outfit,
   colour set) map straight onto makeCharacterHD() — unique characters come
   from data, not hand-drawn sprites. */
function hex2rgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function mixc(a, b, t) {
  const A = hex2rgb(a), B = hex2rgb(b);
  const c = A.map((v, i) => Math.round(v + (B[i] - v) * t));
  return '#' + c.map(v => v.toString(16).padStart(2, '0')).join('');
}
/* LTTP shading: highlights lean warm cream, shadows lean cool plum —
   pushed hard for the bold cartoon read */
function ramp(base) {
  return { hi: mixc(base, '#fff3cf', 0.4), base, sh: mixc(base, '#2c1e3e', 0.48) };
}

       catchlight, rounded corners. High 3/4 camera: fez top disc with

       bodies/legs stay 16-cell halves (32 wide), centred at paint. */

function paintRowsHD(g, rows, pal, yOff, xOff) {
  for (let y = 0; y < rows.length; y++) {
    const r = rows[y];
    for (let x = 0; x < r.length; x++) {
      const ch = r[x];
      if (ch === '.' || !pal[ch]) continue;
      g.fillStyle = pal[ch];
      g.fillRect((x + (xOff || 0)) * 0.5, y * 0.5 + yOff, 0.5, 0.5);
    }
  }
}
/* selective outline only — the material ramps carry the shading now */
function outlineHD(c) {
  const w = c.width, h = c.height;
  const g = c.getContext('2d');
  const src = g.getImageData(0, 0, w, h);
  const out = g.createImageData(w, h);
  const A = (x, y) => (x < 0 || y < 0 || x >= w || y >= h) ? 0 : src.data[(y * w + x) * 4 + 3];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = (y * w + x) * 4;
    if (src.data[i + 3] > 0) {
      out.data[i] = src.data[i]; out.data[i + 1] = src.data[i + 1];
      out.data[i + 2] = src.data[i + 2]; out.data[i + 3] = 255;
    } else if (A(x - 1, y) || A(x + 1, y) || A(x, y - 1) || A(x, y + 1)) {
      out.data[i] = 38; out.data[i + 1] = 22; out.data[i + 2] = 26; out.data[i + 3] = 255;
    }
  }
  g.putImageData(out, 0, 0);
}
function buildFrameHD(head, body, legs, pal, mirror) {
  const c = document.createElement('canvas');
  c.width = 40; c.height = 56;
  c.lw = 20; c.lh = 28;
  const g = c.getContext('2d');
  g.setTransform(2, 0, 0, 2, 0, 0);
  g.imageSmoothingEnabled = false;
  g.translate(1, 1);
  paintRowsHD(g, head, pal, 0, 0);      // 32 rows x 36 cells → 16lp of head
  paintRowsHD(g, body, pal, 16, 2);     // 12 rows x 32 cells → 6lp of body
  paintRowsHD(g, legs, pal, 22, 2);     // 8 rows x 32 cells → 4lp of legs
  g.setTransform(1, 0, 0, 1, 0, 0);
  outlineHD(c);
  if (!mirror) return c;
  const m = document.createElement('canvas');
  m.width = 40; m.height = 56;
  m.lw = 20; m.lh = 28;
  const mg = m.getContext('2d');
  mg.translate(40, 0); mg.scale(-1, 1);
  mg.drawImage(c, 0, 0);
  return m;
}

function setChips(v) {
  chips = Math.max(0, v);
  localStorage.setItem('clubnile_chips', String(chips));
}
/* ── stake journal (anti-scum failsafe) ──────────────────────────────
   Every hand in flight is journaled with enough state to SETTLE it, not
   refund it — quitting, reloading or crashing mid-hand can never dodge
   a loss:
   · blackjack: you stand on the cards you had; the dealer plays out
   · craps: place/hardways come down (as allowed at a real table), but a
     pass bet with the point ON is a contract bet and rides to resolution */
function journal(obj) {
  if (obj) localStorage.setItem('clubnile_pending2', JSON.stringify(obj));
  else localStorage.removeItem('clubnile_pending2');
}
function simulatePassBet(point) {
  for (;;) {
    const sum = (1 + Math.floor(Math.random() * 6)) + (1 + Math.floor(Math.random() * 6));
    if (sum === point) return true;
    if (sum === 7) return false;
  }
}
const bootNotes = [];
(function settleOrphan() {
  /* legacy numeric journal (pre-settlement builds): plain refund once */
  const legacy = parseInt(localStorage.getItem('clubnile_pending') || '0', 10);
  if (legacy > 0) { setChips(chips + legacy); bootNotes.push('Interrupted game — ' + legacy + ' chips returned'); }
  localStorage.removeItem('clubnile_pending');
  let j = null;
  try { j = JSON.parse(localStorage.getItem('clubnile_pending2') || 'null'); } catch (e) {}
  localStorage.removeItem('clubnile_pending2');
  if (!j) return;
  if (j.g === 'bj') {
    const bet = Math.max(0, Math.floor(j.bet || 0));
    if (!bet) return;
    const deck = (Array.isArray(j.deck) && j.deck.length >= 10) ? j.deck : newDeck();
    const hand = Array.isArray(j.hand) ? j.hand : [];
    const dealer = Array.isArray(j.dealer) ? j.dealer : [];
    while (hand.length < 2) hand.push(deck.pop());
    while (dealer.length < 2) dealer.push(deck.pop());
    while (handValue(dealer) < 17) dealer.push(deck.pop());
    const pv = handValue(hand), dv = handValue(dealer);
    let payout = 0, msg;
    if (pv > 21) msg = 'bust, -' + bet;
    else if (dv > 21 || pv > dv) { payout = bet * 2; msg = 'you won! +' + bet; }
    else if (pv === dv) { payout = bet; msg = 'push'; }
    else msg = 'dealer ' + dv + ' beats ' + pv + ', -' + bet;
    if (payout) setChips(chips + payout);
    bootNotes.push('Interrupted blackjack hand settled: ' + msg);
  } else if (j.g === 'cr') {
    const bets = j.bets || {};
    const point = Math.floor(j.point || 0);
    let refund = 0;
    for (const k in bets) if (k !== 'pass') refund += Math.max(0, Math.floor(bets[k] || 0));
    const pass = Math.max(0, Math.floor(bets.pass || 0));
    if (!point) refund += pass;
    if (refund > 0) { setChips(chips + refund); bootNotes.push('Craps bets taken down: ' + refund + ' chips returned'); }
    if (point && pass > 0) {
      if (simulatePassBet(point)) { setChips(chips + pass * 2); bootNotes.push('Your pass bet rode on: point ' + point + ' hit! +' + pass); }
      else bootNotes.push('Your pass bet rode on: seven out, -' + pass);
    }
  }
})();

const WS_BASE = new URLSearchParams(location.search).get('ws') ||
                'wss://last-chad-runner.severin20.workers.dev';

function makeRoom(room, handlers) {
  const obj = {
    status: 'connecting', closed: false, ws: null,
    send(m) { if (this.ws && this.ws.readyState === 1) this.ws.send(JSON.stringify(m)); },
    close() { this.closed = true; try { this.ws && this.ws.close(); } catch (e) {} }
  };
  let delay = 1000;
  function connect() {
    if (obj.closed) return;
    let ws;
    try {
      ws = new WebSocket(WS_BASE + '/clubnile/ws?room=' + encodeURIComponent(room) +
        '&name=' + encodeURIComponent(myName) + '&sprite=' + mySprite);
    } catch (e) { obj.status = 'off'; retry(); return; }
    obj.ws = ws;
    ws.onopen = () => { obj.status = 'on'; delay = 1000; };
    ws.onmessage = e => {
      let m; try { m = JSON.parse(e.data); } catch (err) { return; }
      const h = handlers[m.t];
      if (h) h(m);
    };
    ws.onclose = () => { obj.status = 'off'; retry(); };
    ws.onerror = () => {};
  }
  function retry() {
    if (obj.closed) return;
    setTimeout(connect, delay);
    delay = Math.min(delay * 2, 15000);
  }
  connect();
  return obj;
}

function addPopup(target, kind, str, life, delay) {
  /* the dealer speaks one line at a time */
  if (target === 'dealer' && kind === 'bubble') {
    for (let i = popups.length - 1; i >= 0; i--) {
      if (popups[i].target === 'dealer' && popups[i].kind === 'bubble') popups.splice(i, 1);
    }
  }
  let ttl = life || (kind === 'bubble' ? 360 : 150);
  if (kind === 'bubble') {
    /* bubbles type out at ~0.5 chars/tick — guarantee the whole line
       scrolls in and still hangs around long enough to read */
    ttl = Math.max(ttl, Math.ceil(str.length / 0.5) + 170);
  }
  popups.push({ target, kind, str, t: 0, life: ttl, delay: delay || 0 });
  if (popups.length > 12) popups.shift();
}

const input = { up:false, down:false, left:false, right:false };
let aQueued = false, bQueued = false;
let tapUp = false, tapDown = false, tapLeft = false, tapRight = false;
const tapQ = { up:false, down:false, left:false, right:false };
let prevIn = { up:false, down:false, left:false, right:false };
function readTaps() {
  tapUp = (input.up && !prevIn.up) || tapQ.up;
  tapDown = (input.down && !prevIn.down) || tapQ.down;
  tapLeft = (input.left && !prevIn.left) || tapQ.left;
  tapRight = (input.right && !prevIn.right) || tapQ.right;
  tapQ.up = tapQ.down = tapQ.left = tapQ.right = false;
  prevIn = { ...input };
}
function typing() {
  const a = document.activeElement;
  return a && a.tagName === 'INPUT';
}
addEventListener('keydown', e => {
  if (typing()) {
    if (e.key === 'Escape') { e.target.blur(); toggleChat(false); }
    return;
  }
  const k = e.key;
  sound.unlock();
  if (!e.repeat && (k === 'm' || k === 'M')) { sound.toggleMute(); updateMuteBtn(); }
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(k)) e.preventDefault();
  if (k === 'ArrowUp'    || k === 'w' || k === 'W') { input.up = true;    if (!e.repeat) tapQ.up = true; }
  if (k === 'ArrowDown'  || k === 's' || k === 'S') { input.down = true;  if (!e.repeat) tapQ.down = true; }
  if (k === 'ArrowLeft'  || k === 'a' || k === 'A') { input.left = true;  if (!e.repeat) tapQ.left = true; }
  if (k === 'ArrowRight' || k === 'd' || k === 'D') { input.right = true; if (!e.repeat) tapQ.right = true; }
  if (!e.repeat && (k === 'Enter' || k === ' ' || k === 'e' || k === 'E' || k === 'z' || k === 'Z')) aQueued = true;
  if (!e.repeat && (k === 'Escape' || k === 'x' || k === 'X' || k === 'Backspace')) {
    if (chatOpen()) toggleChat(false); else bQueued = true;
  }
  if (!e.repeat && (k === 'c' || k === 'C')) toggleChat();
});
addEventListener('keyup', e => {
  const k = e.key;
  if (k === 'ArrowUp'    || k === 'w' || k === 'W') input.up = false;
  if (k === 'ArrowDown'  || k === 's' || k === 'S') input.down = false;
  if (k === 'ArrowLeft'  || k === 'a' || k === 'A') input.left = false;
  if (k === 'ArrowRight' || k === 'd' || k === 'D') input.right = false;
});
const dpadEl = document.getElementById('dpad');
function dpadFrom(e) {
  const r = dpadEl.getBoundingClientRect();
  const nx = (e.clientX - r.left) / r.width - 0.5;
  const ny = (e.clientY - r.top) / r.height - 0.5;
  input.up = input.down = input.left = input.right = false;
  if (Math.abs(nx) < 0.08 && Math.abs(ny) < 0.08) return;
  if (Math.abs(nx) > Math.abs(ny)) { if (nx < 0) input.left = true; else input.right = true; }
  else { if (ny < 0) input.up = true; else input.down = true; }
}
dpadEl.addEventListener('pointerdown', e => { dpadEl.setPointerCapture(e.pointerId); dpadEl.classList.add('pressed'); dpadFrom(e); });
dpadEl.addEventListener('pointermove', e => { if (dpadEl.classList.contains('pressed')) dpadFrom(e); });
['pointerup','pointercancel'].forEach(ev => dpadEl.addEventListener(ev, () => {
  dpadEl.classList.remove('pressed');
  input.up = input.down = input.left = input.right = false;
}));
function bindButton(id, fn) {

  ['pointerup','pointercancel','pointerleave'].forEach(ev => el.addEventListener(ev, () => el.classList.remove('pressed')));
}

/* ============================ sound ============================ */
/* All audio is synthesised live with the Web Audio API — no files, so it
   loads instantly and passes the CSP untouched. Two looping mood tunes
   (title mystique / speakeasy swing) run on a lookahead scheduler, and
   small one-shot voices cover chips, dice, cards, footsteps and text. */
const sound = (() => {
  let ac = null, master, musicBus, sfxBus, noiseBuf;
  let muted = localStorage.getItem('clubnile_mute') === '1';
  let tune = null, stepAt = 0, stepN = 0, lastBlip = 0, stepFoot = 0;
  const F = n => 440 * Math.pow(2, (n - 69) / 12);      // midi note → Hz

  /* — the two mood tunes, written on the double harmonic (“Nile”) scale —
     D  Eb  F#  G  A  Bb  C#  ·  32 eighth-note steps per loop           */
  const _ = 0;
  const TUNES = {
    title: {   /* slow torchlit mystery for the card */
      stepDur: 0.36, swing: 0,
      mel:  [74,_,_,_, 73,_,74,_, 70,_,_,_, 69,_,_,_,  67,_,69,_, 70,_,69,_, 66,_,_,_, _,_,_,_],
      bass: [38,_,_,_, _,_,_,_, 45,_,_,_, _,_,_,_,  38,_,_,_, _,_,_,_, 46,_,_,_, 45,_,_,_],
      hat: null, snare: null, melGain: 0.13, bassGain: 0.42
    },
    casino: {  /* jaunty 1920s swing for the floor and the tables */
      stepDur: 0.27, swing: 0.085,
      mel:  [62,_,66,_, 67,_,69,_, 70,69,_,67, 69,_,_,_,  62,_,66,_, 67,_,69,_, 74,_,73,70, 69,_,_,_],
      bass: [38,_,41,_, 45,_,47,_, 48,_,47,_, 45,_,41,_,  38,_,41,_, 45,_,47,_, 50,_,49,_, 45,_,45,_],
      hat:  [1,_,1,_, 1,_,1,_, 1,_,1,_, 1,_,1,_,  1,_,1,_, 1,_,1,_, 1,_,1,_, 1,_,1,_],
      snare:[_,_,_,_, _,_,_,_, 1,_,_,_, _,_,_,_,  _,_,_,_, _,_,_,_, 1,_,_,_, _,_,_,_],
      melGain: 0.11, bassGain: 0.4
    }
  };

  function ensure() {
    if (ac) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    ac = new AC();
    master = ac.createGain(); master.gain.value = muted ? 0 : 1;
    master.connect(ac.destination);
    musicBus = ac.createGain(); musicBus.gain.value = 0.16; musicBus.connect(master);
    sfxBus = ac.createGain(); sfxBus.gain.value = 0.5; sfxBus.connect(master);
    noiseBuf = ac.createBuffer(1, ac.sampleRate / 2, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    setInterval(schedule, 90);
    return true;
  }
  function unlock() {                    // must run inside a user gesture
    if (!ensure()) return;
    if (ac.state === 'suspended') ac.resume();
  }
  function tone(t, freq, dur, type, gain, bus, slide) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(gain, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(bus);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function hiss(t, dur, gain, freq, q, bus) {
    const s = ac.createBufferSource(); s.buffer = noiseBuf;
    const f = ac.createBiquadFilter(); f.type = 'bandpass';
    f.frequency.value = freq; f.Q.value = q;
    const g = ac.createGain();
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(bus || sfxBus);
    s.start(t); s.stop(t + dur + 0.05);
  }
  function schedule() {
    if (!tune || ac.state !== 'running') return;
    if (stepAt < ac.currentTime) stepAt = ac.currentTime + 0.05;
    const T = TUNES[tune];
    while (stepAt < ac.currentTime + 0.28) {
      const i = stepN % 32;
      if (!muted) {
        const when = stepAt + (T.swing && (i % 2) ? T.swing : 0);
        if (T.mel[i]) tone(when, F(T.mel[i]), T.stepDur * 1.9, 'square', T.melGain, musicBus);
        if (T.bass[i]) tone(when, F(T.bass[i]), T.stepDur * (T.swing ? 1.7 : 3.6), 'triangle', T.bassGain, musicBus);
        if (T.hat && T.hat[i]) hiss(when, 0.03, 0.07, 6200, 2, musicBus);
        if (T.snare && T.snare[i]) hiss(when, 0.09, 0.11, 1700, 0.8, musicBus);
      }
      stepAt += T.stepDur; stepN++;
    }
  }
  function ready() { return ac && ac.state === 'running' && !muted; }
  const t0 = () => ac.currentTime;

  return {
    unlock,
    get muted() { return muted; },
    toggleMute() {
      muted = !muted;
      localStorage.setItem('clubnile_mute', muted ? '1' : '0');
      if (ac) master.gain.value = muted ? 0 : 1;
      return muted;
    },
    setTune(name) {
      if (name === tune) return;
      tune = name; stepN = 0; stepAt = 0;
    },
    blip(hi) {                          // typewriter text tick
      if (!ready()) return;
      if (t0() - lastBlip < 0.05) return;
      lastBlip = t0();
      tone(t0(), hi ? 1240 : 1020, 0.045, 'square', 0.05, sfxBus);
    },
    step() {                            // soft sandstone footstep
      if (!ready()) return;
      stepFoot = 1 - stepFoot;
      hiss(t0(), 0.05, 0.09, stepFoot ? 750 : 620, 1.4);
    },
    chip() {                            // ceramic chips clicking down
      if (!ready()) return;
      tone(t0(), 1900, 0.03, 'square', 0.11, sfxBus);
      tone(t0() + 0.045, 1450, 0.035, 'square', 0.09, sfxBus);
    },
    tick() {                            // carousel / menu move
      if (!ready()) return;
      tone(t0(), 820, 0.04, 'square', 0.07, sfxBus);
    },
    click() {                           // dice rattling in the tumble
      if (!ready()) return;
      hiss(t0(), 0.025, 0.12, 3100, 2);
    },
    thud() {                            // dice landing on the felt
      if (!ready()) return;
      tone(t0(), 170, 0.1, 'triangle', 0.28, sfxBus, 85);
    },
    card() {                            // a card swished across the felt
      if (!ready()) return;
      hiss(t0(), 0.07, 0.11, 2400, 0.7);
    },
    win() {                             // little payout fanfare
      if (!ready()) return;
      [62, 66, 69, 74].forEach((n, i) => tone(t0() + i * 0.07, F(n), 0.12, 'square', 0.09, sfxBus));
    },
    lose() {                            // two-note slump
      if (!ready()) return;
      tone(t0(), F(50), 0.16, 'triangle', 0.2, sfxBus);
      tone(t0() + 0.15, F(44), 0.24, 'triangle', 0.2, sfxBus);
    }
  };
})();

const dlg = { open:false, id:null, name:'', pages:[], page:0, chars:0, action:null };
const DLG_SPEED = 0.22;   // slow, cosy typewriter
function wrapText(text, maxW) {
  const words = text.split(' ');
  const lines = [];
  let cur = '';
  ctx.font = FONT;
  for (const w of words) {
    const test = cur ? cur + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; }
    else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}
function openDialog(id) {
  const t = NPC_TALK[id];
  const line = nextLine(id);
  dlg.open = true; dlg.id = id; dlg.name = t.name;
  dlg.pages = line.pages;
  dlg.page = 0; dlg.chars = 0;
  dlg.action = line.action;
  const npc = npcs.find(n => n.id === id);
  if (npc) {
    if (player.y > npc.y + 8) npc.dir = 'down';
    else if (player.x < npc.x - 8) npc.dir = 'left';
    else if (player.x > npc.x + 8) npc.dir = 'right';
  }
}
function dialogSelect() {
  const full = dlg.pages[dlg.page].length;
  if (dlg.chars < full) { dlg.chars = full; return; }
  if (dlg.page < dlg.pages.length - 1) { dlg.page++; dlg.chars = 0; return; }
  dlg.open = false;
  if (dlg.action === 'exit') { window.location.href = '../clublounge.html'; return; }
  if (dlg.action === 'craps') startTransition(() => enterCraps());
  if (dlg.action === 'blackjack') startTransition(() => enterBlackjack());
}

/* ============================ interaction / movement ============================ */
function facingTile() {
  const tc = Math.floor(player.x / TS), tr = Math.floor((player.y - 4) / TS);
  let dc = 0, dr = 0;
  if (player.dir === 'up') dr = -1; else if (player.dir === 'down') dr = 1;
  else if (player.dir === 'left') dc = -1; else dc = 1;
  return key(tc + dc, tr + dr);
}
function nearGuest() {
  for (const g of guests) {
    const d = Math.abs(g.x - player.x) + Math.abs(g.y - player.y);
    if (d < 22) return g;
  }
  return null;
}
function interactTarget() {
  const t = talkMap[facingTile()];
  if (t) return { id: t, guest: null };
  const g = nearGuest();
  if (g) return { id: g.id, guest: g };
  return null;
}
const WALK_SPEED = 0.8;
const GUEST_SPEED = 0.3;
function blocked(px, py) {
  const pts = [[px-4,py-2],[px+3,py-2],[px-4,py+3],[px+3,py+3]];
  for (const [x,y] of pts) {
    if (solid.has(key(Math.floor(x/TS), Math.floor(y/TS)))) return true;
  }
  return false;
}
function moveEntity(ent, dx, dy, speed) {
  let moved = false;
  if (dx) {
    const nx = ent.x + dx * speed;
    if (!blocked(nx, ent.y)) { ent.x = nx; moved = true; }
  }
  if (dy) {
    const ny = ent.y + dy * speed;
    if (!blocked(ent.x, ny)) { ent.y = ny; moved = true; }
  }
  return moved;
}

/* ============================ floor background ============================ */
const bg = document.createElement('canvas');
bg.width = W * 2; bg.height = H * 2;
bg.lw = W; bg.lh = H;
(function paintBackground() {
  const g = bg.getContext('2d');
  g.setTransform(2, 0, 0, 2, 0, 0);
  g.imageSmoothingEnabled = false;
  /* ── sandstone floor: 3-tone checker + dithered grain + inlays ── */
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const t = (c + r) % 2 ? C.floorA : C.floorB;
      g.fillStyle = t;
      g.fillRect(c*TS, r*TS, TS, TS);
      /* per-tile bevel: light top edge, dark bottom edge */
      g.fillStyle = 'rgba(255,246,220,0.35)';
      g.fillRect(c*TS, r*TS, TS, 1);
      g.fillStyle = 'rgba(140,110,70,0.25)';
      g.fillRect(c*TS, r*TS + TS - 1, TS, 1);
      /* fine grain dither (half-pixel flecks) */
      for (let k = 0; k < 9; k++) {
        const hx = h2(c * 9 + k, r), px = hx % TS, py = h2(r * 9 + k, c) % TS;
        g.fillStyle = hx % 3 === 0 ? 'rgba(255,246,214,0.5)' : (hx % 2 ? C.floorC : C.floorDot);
        g.fillRect(c*TS + px + (hx % 2) * 0.5, r*TS + py, 0.5, 0.5);
      }
      /* occasional scarab inlay tile */
      if (h2(c, r) % 19 === 3 && r > 2 && r < 13) {
        const ix = c*TS + 5, iy = r*TS + 5;
        g.fillStyle = C.floorDot;
        g.fillRect(ix + 2, iy, 2, 1); g.fillRect(ix + 1, iy + 1, 4, 2);
        g.fillRect(ix, iy + 2, 1, 1); g.fillRect(ix + 5, iy + 2, 1, 1);
        g.fillRect(ix + 2, iy + 3, 2, 2);
        g.fillStyle = 'rgba(255,246,220,0.5)';
        g.fillRect(ix + 2, iy + 1, 1, 1);
      }
    }
  }
  /* ── rug: tone-ramped weave, double gold border, fringe, medallion ── */
  const rx = RUG.c0*TS, ry = RUG.r0*TS, rw = (RUG.c1-RUG.c0+1)*TS, rh = (RUG.r1-RUG.r0+1)*TS;
  for (let y = 0; y < rh; y++) {
    const band = y < 3 ? C.rugLight : (y > rh - 4 ? C.rugDark : C.rug);
    g.fillStyle = band;
    g.fillRect(rx, ry + y, rw, 1);
  }
  /* weave dither */
  for (let y = 2; y < rh - 2; y += 2) for (let x = (y % 4) ? 2 : 4; x < rw - 2; x += 4) {
    g.fillStyle = (h2(x, y) % 2) ? C.rugDark : C.rugLight;
    g.fillRect(rx + x, ry + y, 0.5, 1);
    g.fillStyle = 'rgba(255,220,180,0.12)';
    g.fillRect(rx + x + 0.5, ry + y, 0.5, 0.5);
  }
  g.strokeStyle = C.rugGold; g.lineWidth = 1;
  g.strokeRect(rx + 1.5, ry + 1.5, rw - 3, rh - 3);

function makeCanvas(w, h, painter) {
  const c = document.createElement('canvas');
  c.width = w * 2; c.height = h * 2;      // 2x backing for fine detail
  const g = c.getContext('2d');
  g.setTransform(2, 0, 0, 2, 0, 0);
  g.imageSmoothingEnabled = false;
  painter(g);
  c.lw = w; c.lh = h;                      // logical size for drawImage
  return c;
}

function newDeck() {
  const d = [];
  for (let s = 0; s < 4; s++) for (let r = 1; r <= 13; r++) d.push({ r, s });
  for (let i = d.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [d[i], d[j]] = [d[j], d[i]];

function handValue(hand) {
  let v = 0, aces = 0;
  for (const c of hand) {
    if (c.r === 1) { aces++; v += 11; }
    else v += Math.min(c.r, 10);
  }
  while (v > 21 && aces > 0) { v -= 10; aces--; }
  return v;
}

  } else if (scene === 'blackjack') {
    if (bjHandLive()) {
      /* the hand stands where it is and settles — leaving can't dodge it */
      while (bj.dealQ && bj.dealQ.length) {
        const n = bj.dealQ.shift();
        (n === 'dealer' ? bj.dealer : bj.hand).push(bj.deck.pop());
      }
      while (bj.hand.length < 2) bj.hand.push(bj.deck.pop());
      while (bj.dealer.length < 2) bj.dealer.push(bj.deck.pop());
      while (handValue(bj.dealer) < 17) bj.dealer.push(bj.deck.pop());
      const dv = handValue(bj.dealer), pv = handValue(bj.hand);
      let payout = 0, msg;
      if (pv > 21) msg = 'bust, -' + bj.bet;
      else if (dv > 21 || pv > dv) { payout = bj.bet * 2; msg = 'you won! +' + bj.bet; }
      else if (pv === dv) { payout = bj.bet; msg = 'push'; }
      else msg = 'dealer ' + dv + ' beats ' + pv + ', -' + bj.bet;
      if (payout) setChips(chips + payout);
      journal(null);
      pushChat('', 'Hand settled on the way out: ' + msg, true);
      bj.state = 'bet';
    }
    startTransition(() => leaveTable('blackjack'));
  }
}

/* speech bubble with rounded corners. Modes: 'above' (players — box over
   the head), 'below' (blackjack dealer — billboard under him), 'ne' (craps
   stickman — box above and to the right of his head). */
function bubblePath(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function drawBubble(cx, anchorY, text, mode, age) {
  const big = mode !== 'above';             // dealer lines get the big bubble
  const maxW = big ? 168 : (text.length > 24 ? 132 : 100);
  const lineH = big ? 12 : 10;
  const pad = big ? 7 : 4;
  ctx.font = FONT;
  /* never truncate: the box grows with the text (up to a cap), and past
     the cap the typewriter scrolls line by line through the whole thing */
  const lines = wrapText(text, maxW - pad * 2);
  const maxLines = big ? 4 : 3;
  const shown = Math.min(lines.length, maxLines);
  const w = Math.min(maxW, Math.max(...lines.map(l => ctx.measureText(l).width)) + pad * 2);
  const h = shown * lineH + pad * 2 - 2;
  let x, y;
  if (mode === 'ne') {                      // above and right of the head
    x = Math.max(2, Math.min(W - w - 2, cx + 4));
    y = anchorY - h - 6;
  } else {
    x = Math.max(2, Math.min(W - w - 2, Math.round(cx - w / 2)));
    y = mode === 'below' ? anchorY + 5 : anchorY - h - 5;
  }
  ctx.fillStyle = 'rgba(10,6,14,0.35)';     // soft drop shadow
  bubblePath(x + 1, y + 2, w, h, 5); ctx.fill();
  ctx.fillStyle = 'rgba(247,243,232,0.97)';
  bubblePath(x, y, w, h, 5); ctx.fill();
  ctx.strokeStyle = C.black; ctx.lineWidth = 1;
  bubblePath(x + 0.5, y + 0.5, w - 1, h - 1, 5); ctx.stroke();
  /* tail */
  ctx.fillStyle = 'rgba(247,243,232,0.97)';
  ctx.beginPath();
  if (mode === 'below') {
    ctx.moveTo(cx - 4, y + 1); ctx.lineTo(cx, y - 5); ctx.lineTo(cx + 4, y + 1);
  } else if (mode === 'ne') {
    ctx.moveTo(x + 5, y + h - 1); ctx.lineTo(cx, anchorY + 3); ctx.lineTo(x + 13, y + h - 1);
  } else {
    ctx.moveTo(cx - 4, y + h - 1); ctx.lineTo(cx, y + h + 5); ctx.lineTo(cx + 4, y + h - 1);
  }
  ctx.closePath(); ctx.fill();
  /* typewriter with a scrolling window: find the line being typed and
     keep it in view, sliding earlier lines up and out */
  const r = age === undefined ? text.length + 99 : Math.floor(age * 0.5);
  let acc = 0, cl = lines.length - 1;
  for (let i = 0; i < lines.length; i++) {
    if (r < acc + lines[i].length + 1) { cl = i; break; }
    acc += lines[i].length + 1;
  }
  const start = Math.max(0, cl - (maxLines - 1));
  let before = 0;
  for (let i = 0; i < start; i++) before += lines[i].length + 1;
  ctx.fillStyle = C.black;
  ctx.textBaseline = 'top';
  let rem = r - before;
  for (let i = start; i < Math.min(lines.length, start + maxLines); i++) {
    if (rem <= 0) break;
    ctx.fillText(lines[i].slice(0, rem), x + pad, y + pad + (i - start) * lineH);
    rem -= lines[i].length + 1;
  }
}

        bj.state = 'dealerTurn'; bj.hole = false; bj.timer = 0;
      }
    }
    bQueued = false;
  }
  else if (bj.state === 'dealerTurn') {
    aQueued = bQueued = false;
    /* the dealer announces the hole card the moment it flips */
    if (!bj.revealed) {
      bj.revealed = true;
      if (!bj.busted) {
        dealerSay('Dealer turns ' + CARD_CALLED[bj.dealer[0].r] + " — that's " + handValue(bj.dealer), 320, CALL_BEAT);
      } else {
        dealerSay('Too many, friend. House takes it.', 320, CALL_BEAT);
      }
    }
    if (++bj.timer >= 180) {         // slow, announced draws
      bj.timer = 0;
      if (!bj.busted && handValue(bj.dealer) < 17) {
        const card = bj.deck.pop();
        bj.dealer.push(card);
        sound.card();
        const dv = handValue(bj.dealer);
        const called = CARD_CALLED[card.r];
        dealerSay(dv > 21
          ? called.charAt(0).toUpperCase() + called.slice(1) + '... ' + dv + '! Dealer busts!'
          : 'Dealer draws ' + called + ' — ' + dv, 320, CALL_BEAT);
      }
      else {
        const dv = handValue(bj.dealer), pv = handValue(bj.hand);
        const natural = pv === 21 && bj.hand.length === 2;
        let payout = 0;
        if (bj.busted) { bj.result = 'BUST  -' + bj.bet; }
        else if (natural && !(dv === 21 && bj.dealer.length === 2)) {
          payout = bj.bet + Math.floor(bj.bet * 1.5);
          bj.result = 'BLACKJACK!  +' + Math.floor(bj.bet * 1.5);
        }
        else if (dv > 21 || pv > dv) { payout = bj.bet * 2; bj.result = 'YOU WIN  +' + bj.bet; }
        else if (pv === dv) { payout = bj.bet; bj.result = 'PUSH'; }
        else { bj.result = 'DEALER WINS  -' + bj.bet; }
        if (payout) setChips(chips + payout);   // payout mint (≙ claimWinnings)
        if (payout > bj.bet) sound.win();
        else if (payout === 0) sound.lose();
        journal(null);                          // stake settled — clear the journal
        if (!bj.busted && dv <= 21) dealerSay('Dealer stands on ' + dv + '.', 340, CALL_BEAT);
        bj.flash = payout > bj.bet ? 40 : 0;
        bj.state = 'result'; bj.actIdx = 0;
        lastActMs = Date.now();
      }
    }
  }
  else if (bj.state === 'result') {
    if (bj.flash > 0) bj.flash--;
    maybeTableQuip('blackjack');
    bjTrayTap();
    const pick = bjMenu(['AGAIN','EMOJI','TIP'], 'actIdx');
    if (aQueued) {
      aQueued = false;
      if (pick === 'AGAIN') {
        if (bj.betAmt >= 1 && bj.betAmt <= chips) bjStartHand();
        else bj.state = 'bet';
      }
      else if (pick === 'EMOJI') modal = { type:'emoji', idx:0 };
      else openTipModal();
    }
  }
}

      if (cr.bets.pass) { const w = cr.bets.pass; setChips(chips + w * 2); winTot += w; out.push(sum + '! PASS WINS +' + w); cr.bets.pass = 0; }
      else out.push(sum + ' ON THE COME OUT');
    } else if (sum === 2 || sum === 3 || sum === 12) {
      if (cr.bets.pass) { out.push('CRAPS ' + sum + ' · PASS DOWN -' + cr.bets.pass); cr.bets.pass = 0; }
      else out.push('CRAPS ' + sum);
    } else {
      cr.point = sum;
      out.push('POINT IS ' + sum);
    }
  } else {
    if (sum === 7) {
      seven = true;
      let lost = cr.bets.pass;
      PLACE_NUMS.forEach(n => lost += cr.bets['p' + n]);
      HARD_NUMS.forEach(n => lost += cr.bets['h' + n]);
      out.push('SEVEN OUT');
      if (lost) out.push('-' + lost + ' CHIPS DOWN');
      cr.bets = crBetKeys();
      cr.point = 0;
    } else {
      if (sum === cr.point) {
        out.push('POINT ' + sum + ' HIT!');
        if (cr.bets.pass) { const w = cr.bets.pass; setChips(chips + w * 2); winTot += w; cr.bets.pass = 0; }
        cr.point = 0;
      }
      if (cr.bets['p' + sum]) {
        const [a, b] = PLACE_PAY[sum];
        const w = Math.floor(cr.bets['p' + sum] * a / b);
        setChips(chips + w); winTot += w;
        out.push('PLACE ' + sum + ' PAYS +' + w);
      }
      if (HARD_NUMS.includes(sum) && cr.bets['h' + sum]) {
        if (hard) {
          const w = cr.bets['h' + sum] * HARD_PAY[sum];
          setChips(chips + w); winTot += w;
          out.push('HARD ' + sum + '! +' + w);
        } else {
          out.push('EASY ' + sum + ' · HARD ' + sum + ' DOWN');
          cr.bets['h' + sum] = 0;
        }
      }
      if (!out.length) out.push(sum + ' · NO ACTION');
    }
  }
  /* the stickman makes the call — a beat after the dice land */
  dealerSay(crCall(d1, d2, prevPoint, cr.point), 380, CALL_BEAT);
  cr.flash = winTot > 0 ? 40 : 0;
  if (winTot > 0) sound.win();
  else if (seven) sound.lose();
  cr.outcome = out.slice(0, 2);
  crJournal();
  if (cr.postRoll) {
    /* shared roll: server state is authoritative; board stays open and
       the outcome text clears when the next betting phase arrives */
    cr.point = cr.postRoll.point;
    cr.net.shooter = cr.postRoll.shooter;
    cr.postRoll = null;
    cr.mode = 'board';
  } else {
    cr.outT = seven || winTot > 0 ? 330 : 270;   // let the call breathe
    cr.mode = 'outcome';
  }
}
function crUpdate() {
  /* failsafe: dropped connection mid-game → refund and continue solo */
  if (cr.net.active && !(social.table && social.table.status === 'on')) crGoSolo();
  /* dice animation always progresses (server rolls arrive any time).
     Long lazy tumble: faces flip slowly, the first bone settles early,
     the second keeps spinning before it drops. */
  if (cr.mode === 'rolling') {
    aQueued = bQueued = false;
    const land = cr.rollLand || cr.dice;
    if (cr.rollT > CR_LOCK1) {
      if (cr.rollT % 10 === 0) {
        cr.dice = [1 + Math.floor(Math.random() * 6), 1 + Math.floor(Math.random() * 6)];
        sound.click();
      }
    } else {
      cr.dice[0] = land[0];
      if (cr.rollT % 8 === 0) { cr.dice[1] = 1 + Math.floor(Math.random() * 6); sound.click(); }
    }
    if (--cr.rollT <= 0) {
      cr.dice = [land[0], land[1]];
      cr.rollLand = null;
      sound.thud();
      crResolve();
    }
    return;
  }
  if (modalUpdate()) { lastActMs = Date.now(); return; }
  /* B anywhere at the table → leave confirmation */
  if (bQueued) { bQueued = false; lastActMs = Date.now(); openLeaveModal(); return; }
  if (cr.mode === 'outcome') {          /* solo pause between rolls */
    if (cr.flash > 0) cr.flash--;
    if (--cr.outT <= 0 || aQueued) {
      aQueued = false; lastActMs = Date.now();
      cr.mode = 'board';
      if (!cr.net.active) crSoloPhase('betting');
    }
    return;
  }
  if (cr.flash > 0) cr.flash--;
  if (!cr.outcome.length) maybeTableQuip('craps');
  /* idle kick: frees the seat so the table never waits on a ghost */
  if (aQueued || tapUp || tapDown || tapLeft || tapRight || tapNow) lastActMs = Date.now();
  else if (Date.now() - lastActMs > IDLE_KICK_MS) {
    crCashOut('Idle at craps');
    pushChat('', 'Idle at craps — seat freed', true);
    startTransition(() => leaveTable('craps'));
    return;
  }
  /* solo table clock: betting window → roll window → (auto) roll */
  if (!cr.net.active && Date.now() > cr.solo.until) {
    if (cr.solo.phase === 'betting') crSoloPhase('action');
    else if (crTotalBets() > 0) { crStartRoll(); return; }
    else crSoloPhase('betting');
  }
  const unit = UNITS[cr.unitIdx];
  const netOn = cr.net.active;
  const canBet = netOn
    ? (cr.net.phase === 'betting' || cr.net.phase === 'outcome')
    : cr.solo.phase === 'betting';
  /* taps: chip tray selects a denomination (X = take-down mode),
     tapping a felt spot lays or lifts chips */
  if (tapNow) {
    const hit = trayHit(tapNow, true);
    if (hit === TRAY.length) { cr.removeMode = !cr.removeMode; sound.tick(); }
    else if (hit >= 0) { cr.unitIdx = hit; cr.removeMode = false; sound.tick(); }
    else {
      const spot = crSpotAt(tapNow);
      if (spot) {
        if (!canBet) flash(netOn ? 'DICE ARE OUT · BETS CLOSED' : 'ROLL WINDOW · BETS CLOSED');
        else if (cr.removeMode) {
          if (cr.bets[spot] <= 0) flash('NOTHING ON THAT SPOT');
          else if (spot === 'pass' && cr.point !== 0) flash('PASS RIDES UNTIL DECIDED');
          else {
            const take = Math.min(unit, cr.bets[spot]);
            cr.bets[spot] -= take;
            setChips(chips + take);
            sound.chip();
            crJournal();
          }
        }
        else if (spot === 'pass' && cr.point !== 0) flash('PASS BETS: COME OUT ONLY');
        else if (chips < unit) flash('NOT ENOUGH CHIPS');
        else { cr.bets[spot] += unit; setChips(chips - unit); sound.chip(); crJournal(); }
      }
    }
  }
  /* d-pad: scrolling action carousel */
  if (tapLeft)  { cr.menuIdx = (cr.menuIdx + CR_MENU.length - 1) % CR_MENU.length; caroNudge(-1); }
  if (tapRight) { cr.menuIdx = (cr.menuIdx + 1) % CR_MENU.length; caroNudge(1); }
  if (aQueued) {
    aQueued = false;
    const item = CR_MENU[cr.menuIdx];
    if (item === 'ROLL') {
      if (netOn) {
        if (cr.net.phase === 'action' && cr.net.shooter === social.youId) social.table.send({ t: 'roll' });
        else if (cr.net.phase === 'action') flash('WAITING ON THE SHOOTER');
        else flash('DICE ROLL ON THE TABLE CLOCK');
      } else {
        if (cr.solo.phase !== 'action') flash('BETS OPEN · ROLL WINDOW NEXT');
        else if (crTotalBets() === 0) flash('PLACE A BET FIRST');
        else crStartRoll();
      }
    }
    else if (item === 'EMOJI') modal = { type:'emoji', idx:0 };
    else if (item === 'TIP') openTipModal();
    else if (item === 'LEAVE') openLeaveModal();
  }
}
function crRender() {
  ctx.drawImage(crRoom, 0, 0, W, H);
  drawFlame(ctx, 30, 10); drawFlame(ctx, 202, 10);

    if (!amt) continue;

  }

    if (!amt) continue;
    const b = hardBox(i);

  const die1Tumbling = cr.mode === 'rolling' && cr.rollT > CR_LOCK1;
  const die2Tumbling = cr.mode === 'rolling';
  const s1 = die1Tumbling ? (tick % 2 ? 1 : -1) : 0;
  const s2 = die2Tumbling ? (tick % 2 ? -1 : 1) : 0;
  drawDie(ctx, DICE_POS[0].x + s1, DICE_POS[0].y + (die1Tumbling ? (tick % 3) - 1 : 0), cr.dice[0], 14);
  drawDie(ctx, DICE_POS[1].x + s2, DICE_POS[1].y + (die2Tumbling ? ((tick + 1) % 3) - 1 : 0), cr.dice[1], 14);
  if (cr.mode !== 'rolling') {
    ctx.textAlign = 'center';
    ctx.fillStyle = C.white;
    ctx.fillText(String(cr.dice[0] + cr.dice[1]), 43, 127);
    ctx.textAlign = 'left';
  }
  /* seats + your win hop */
  const hop = (cr.flash > 0 && Math.floor(tick / 10) % 2) ? -1 : 0;
  drawTableSeats(CR_SEATS, hop);
  const seatPos = tableSeatPos(CR_SEATS, { x: 16, y: 94, mode: 'ne' });
  /* shooter marker: a little die above whoever holds the dice */
  if (cr.net.active && cr.net.shooter) {
    const sp = seatPos(cr.net.shooter === social.youId ? 'you' : cr.net.shooter);
    if (sp) drawDie(ctx, sp.x + 8, sp.y - 27, 5, 8);
  }
  drawPopups(seatPos);
  if (modal) { modalDraw(seatPos); drawNetDot(); return; }
  /* slim control band: carousel + chip tray only — the felt and the
     dealer carry all the game information */
  uiPanelSmall();
  ctx.font = FONT; ctx.textBaseline = 'top';
  const live = cr.net.active ? cr.net : cr.solo;
  const secs = Math.max(0, Math.ceil((live.until - Date.now()) / 1000));
  if (cr.mode === 'rolling') {
    drawTray(cr.unitIdx, true, cr.removeMode);
    drawRollPopup();
    drawNetDot();
    return;
  }
  if (flashT > 0) {
    flashT--;
    uiText(flashMsg, '#e05a70', 203);
  } else if (cr.mode === 'outcome' || (cr.net.active && cr.outcome.length)) {
    const win = cr.flash > 0 && Math.floor(tick / 6) % 2;
    const line = cr.outcome[Math.floor(tick / 100) % Math.max(1, cr.outcome.length)] || '';
    uiText(line, win ? C.gold : C.white, 203);
  } else if (cr.removeMode) {
    uiText('TAP A BET TO TAKE IT DOWN', '#ff9c8a', 203);
  } else {
    drawCarousel(CR_MENU, cr.menuIdx, 202);
  }
  drawTray(cr.unitIdx, true, cr.removeMode);
  if (cr.mode === 'board' && (live.phase === 'betting' || live.phase === 'action')) {
    drawTimerBox(live.phase === 'betting' ? 'BETS' : 'ROLL', secs, secs <= 3);

function floorUpdate() {
  if (dlg.open) {
    const prevCh = Math.floor(dlg.chars);
    dlg.chars += DLG_SPEED;
    const nowCh = Math.floor(dlg.chars);
    if (nowCh > prevCh && nowCh % 2 === 0 && nowCh <= dlg.pages[dlg.page].length) sound.blip();
    if (aQueued) { aQueued = false; dialogSelect(); }
    if (bQueued) { bQueued = false; dlg.open = false; }
    return;
  }
  let dx = 0, dy = 0;
  if (input.left) { dx = -1; player.dir = 'left'; }
  else if (input.right) { dx = 1; player.dir = 'right'; }
  if (input.up) { dy = -1; if (!dx) player.dir = 'up'; }
  else if (input.down) { dy = 1; if (!dx) player.dir = 'down'; }
  player.moving = !!(dx || dy);
  if (player.moving) {
    moveEntity(player, dx, dy, WALK_SPEED);
    player.animT++;
    if (player.animT % 13 === 0) { player.frame = 1 - player.frame; sound.step(); }
  } else { player.frame = 0; }

  if (aQueued) {
    aQueued = false;
    const t = interactTarget();
    if (t) {
      if (t.guest) {
        t.guest.dir = player.x < t.guest.x ? 'left' : 'right';
        t.guest.moveT = 120;
        t.guest.dx = 0; t.guest.dy = 0;
      }
      openDialog(t.id);
    }
  }
  if (bQueued) bQueued = false;

  for (const g of guests) {
    g.moveT--;
    if (g.moveT <= 0) {
      g.moveT = 50 + Math.floor(Math.random() * 90);
      const roll = Math.random();
      if (roll < 0.4) { g.dx = 0; g.dy = 0; }
      else {
        const dirs = [[0,-1,'up'],[0,1,'down'],[-1,0,'left'],[1,0,'right']];
        const d = dirs[Math.floor(Math.random() * 4)];
        g.dx = d[0]; g.dy = d[1]; g.dir = d[2];
      }
    }
    if (g.dx || g.dy) {
      const moved = moveEntity(g, g.dx, g.dy, GUEST_SPEED);
      if (!moved) { g.dx = 0; g.dy = 0; }
      else {
        g.animT++;
        if (g.animT % 18 === 0) g.frame = 1 - g.frame;
      }
    } else g.frame = 0;
    g.x = Math.max(1.5*TS, Math.min(13.5*TS - 1, g.x));
    g.y = Math.max(4.5*TS, Math.min(13.5*TS - 1, g.y));
  }
  for (const p of confetti) {
    p.y += p.v; p.sway += 0.02;
    p.x += Math.sin(p.sway) * 0.1;
    if (p.y > 236) { p.y = 34; p.x = 16 + Math.random() * 208; }

  if (tick % 60 === 0 && Math.random() < 0.05 && !dlg.open) {
    const ids = ['bartender', 'craps', 'blackjack', 'guestF', 'guestM'];
    const id = ids[Math.floor(Math.random() * ids.length)];
    if (!popups.some(p => p.target === id && p.kind === 'bubble')) {
      addPopup(id, 'bubble', randomQuip(id), 330);
    }
  }
}

  g.strokeRect(bx + 3.5, by + 3.5, bw - 7, bh - 7);
  g.fillStyle = C.goldHi;
  g.fillRect(bx + 1, by + 1, 2, 2); g.fillRect(bx + bw - 3, by + 1, 2, 2);
  g.fillRect(bx + 1, by + bh - 3, 2, 2); g.fillRect(bx + bw - 3, by + bh - 3, 2, 2);
  g.font = FONT;
  g.textBaseline = 'top';
  g.fillStyle = C.gold;
  g.fillText(dlg.name, bx + 8, by + 7);
  const full = dlg.pages[dlg.page];
  const shown = full.slice(0, Math.floor(dlg.chars));
  const lines = wrapText(shown, bw - 20);
  g.fillStyle = C.white;
  for (let i = 0; i < Math.min(lines.length, 3); i++) {
    g.fillText(lines[i], bx + 8, by + 22 + i * 13);
  }
  if (dlg.chars >= full.length && Math.floor(tick / 20) % 2) {
    g.fillStyle = C.gold;
    g.fillText('▼', bx + bw - 16, by + bh - 13);
  }
}
function drawTitle(g) {
  g.fillStyle = 'rgba(10,7,16,' + (0.85 * titleAlpha) + ')';
  g.fillRect(0, 0, W, H);
  g.globalAlpha = titleAlpha;
  g.textAlign = 'center'; g.textBaseline = 'middle';
  /* art-deco sunburst behind the title */
  g.strokeStyle = 'rgba(217,174,95,0.28)'; g.lineWidth = 1;
  for (let i = -4; i <= 4; i++) {
    g.beginPath();
    g.moveTo(W/2, 100);
    g.lineTo(W/2 + i * 26, 20);
    g.stroke();
  }
  g.font = '16px "Press Start 2P", monospace';
  g.fillStyle = '#5e2216';                       // deep drop shadow
  g.fillText('CLUB', W/2 + 1, 89.5);
  g.fillText('NILE', W/2 + 1, 111.5);
  const tGrad = g.createLinearGradient(0, 78, 0, 120);
  tGrad.addColorStop(0, C.goldHi);
  tGrad.addColorStop(0.5, C.gold);
  tGrad.addColorStop(1, C.goldDark);
  g.fillStyle = tGrad;
  g.fillText('CLUB', W/2, 88);
  g.fillText('NILE', W/2, 110);
  /* deco divider */
  g.fillStyle = C.rugGold;
  g.fillRect(W/2 - 40, 124, 80, 1);
  g.fillStyle = C.goldHi;
  g.fillRect(W/2 - 2, 122, 4, 4);
  g.font = FONT;
  g.fillStyle = C.white;
  g.fillText('EST. 1926', W/2, 136);
  g.fillStyle = C.rugGold;
  g.fillText('MEMBERS ONLY', W/2, 150);
  if (Math.floor(tick / 30) % 2) {
    g.fillStyle = C.white;
    g.fillText('PRESS A', W/2, 190);
  }
  g.globalAlpha = 1;
  g.textAlign = 'left';
  g.textBaseline = 'top';
}
function floorRender() {
  ctx.drawImage(bg, 0, 0, W, H);
  drawFlame(ctx, 3*TS + 4, 18);
  drawFlame(ctx, 11*TS + 4, 18);
  const items = [];
  items.push({ y: BAR.row*TS + 16, draw: g => g.drawImage(barCanvas, BAR.c0*TS, BAR.row*TS - 6, barCanvas.lw, barCanvas.lh) });
  items.push({ y: (CRAPS_T.r1+1)*TS, draw: g => g.drawImage(crapsCanvas, CRAPS_T.c0*TS, CRAPS_T.r0*TS, crapsCanvas.lw, crapsCanvas.lh) });
  items.push({ y: (BJ_T.r1+1)*TS,    draw: g => g.drawImage(bjCanvas, BJ_T.c0*TS, BJ_T.r0*TS, bjCanvas.lw, bjCanvas.lh) });
  PALMS.forEach(([c, r]) => items.push({ y: (r+1)*TS, draw: g => g.drawImage(palmCanvas, c*TS - 3, r*TS - 17, palmCanvas.lw, palmCanvas.lh) }));
  items.push({ y: 152, draw: g => g.drawImage(sarcCanvas, 9, 94, sarcCanvas.lw, sarcCanvas.lh) });
  items.push({ y: 148, draw: g => g.drawImage(pharaohCanvas, 202, 90, pharaohCanvas.lw, pharaohCanvas.lh) });
  npcs.forEach(n => items.push({ y: n.y, draw: g => drawEntity(g, { ...n, staticNPC: true }, tick + n.x) }));
  guests.forEach(gu => items.push({ y: gu.y, draw: g => drawEntity(g, gu, 0) }));
  items.push({ y: player.y, draw: g => drawEntity(g, { ...player, sprite: 'player' }, 0) });
  items.sort((a, b) => a.y - b.y);
  for (const it of items) it.draw(ctx);
  for (const p of confetti) {
    ctx.fillStyle = p.col;
    ctx.globalAlpha = 0.7;
    ctx.fillRect(Math.round(p.x), Math.round(p.y), 1, 2);
  }
  ctx.globalAlpha = 1;
  if (started && !dlg.open) {
    const t = interactTarget();
    if (t) {
      const bounce = Math.floor(tick / 20) % 2;
      ctx.font = FONT;
      ctx.fillStyle = C.gold;
      ctx.fillText('!', Math.round(player.x) - 2, Math.round(player.y) - 34 - bounce);
    }
  }
  /* popups over heads on the floor: you, the staff, and the regulars */
  drawPopups(target => {
    if (target === 'you') return { x: player.x, y: player.y - 6 };
    const npc = npcs.find(n => n.id === target);
    if (npc) return { x: npc.x, y: npc.y - 4 };
    const gu = guests.find(g2 => g2.id === target);
    if (gu) return { x: gu.x, y: gu.y - 4 };
    return null;
  });
  const vg = ctx.createRadialGradient(W/2, H/2 - 10, 60, W/2, H/2, 190);
  vg.addColorStop(0, 'rgba(255,190,90,0.05)');
  vg.addColorStop(1, 'rgba(8,5,14,0.42)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
  if (dlg.open) drawDialog(ctx);
  if (titleAlpha > 0) drawTitle(ctx);
}

/* ============================ main loop ============================ */
function update() {
  tick++;
  sound.setTune(!started || titleAlpha > 0.5 ? 'title' : 'casino');
  readTaps();
  tapNow = tapPt; tapPt = null;
  if (started && titleAlpha > 0) titleAlpha = Math.max(0, titleAlpha - 0.03);
  if (!started && (input.up || input.down || input.left || input.right || aQueued)) {
    started = true; aQueued = false;
  }
  if (trans.active) {
    trans.t++;
    if (trans.t === 15 && trans.mid) { trans.mid(); trans.mid = null; }
    if (trans.t >= 30) trans.active = false;
    aQueued = bQueued = false;
    return;
  }
  if (!started) { aQueued = bQueued = false; return; }
  if (chatOpen()) { aQueued = bQueued = false; return; }   // chat panel has focus
  if (scene === 'floor') floorUpdate();
  else if (scene === 'blackjack') bjUpdate();
  else if (scene === 'craps') crUpdate();
}
function render() {
  if (scene === 'floor') floorRender();
  else if (scene === 'blackjack') bjRender();
  else if (scene === 'craps') crRender();
  if (scene !== 'floor') {
    const vg = ctx.createRadialGradient(W/2, 110, 60, W/2, 110, 200);
    vg.addColorStop(0, 'rgba(255,190,90,0.04)');
    vg.addColorStop(1, 'rgba(8,5,14,0.35)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }
  if (started) drawHUD(ctx);
  if (trans.active) {
    const a = trans.t < 15 ? trans.t / 15 : (30 - trans.t) / 15;
    ctx.fillStyle = 'rgba(6,4,10,' + Math.min(1, a) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}
function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}
if (document.fonts && document.fonts.load) {
  Promise.all([
    document.fonts.load('8px "Press Start 2P"'),
    document.fonts.load('16px "Press Start 2P"')
  ]).catch(() => {}).then(() => requestAnimationFrame(loop));
} else {
  requestAnimationFrame(loop);
}

/* warn before closing with a hand in flight (the journal still settles
   it fairly if the tab is force-closed anyway) */
addEventListener('beforeunload', e => {
  const bjLive = scene === 'blackjack' && ['dealing','player','dealerTurn'].includes(bj.state);
  const crLive = scene === 'craps' && crTotalBets() > 0;
  if (bjLive || crLive) { e.preventDefault(); e.returnValue = ''; }
});

/* ── Web3 integration map (next phase) ────────────────────────────────
   Entry:  clublounge.html (wallet flow lives there) links to this page.
           It can hand a session over via sessionStorage 'clubnile_session'
           = { wallet, tokenId, name } — picked up below.
   Gate:   verify MembersOnly.balanceOf(wallet) > 0 before enabling play.
   Chips:  replace localStorage balance with items.getChips(wallet); every
           chip movement in this file already flows through setChips().
   Buy-in: Gamble.commitWager(tokenId, wager) per table session (burns
           chips on-chain, returns a nonce).
   Payout: Worker oracle signs (tokenId, wager, payout, gameId, nonce,
           player) → Gamble.claimWinnings / resolveGame mints the payout.
   Tips:   items.safeTransferFrom(you, them, 0, amount) — chips are the
           ERC-1155 token 0 and already wallet-to-wallet transferable.
   Dice:   already server-authoritative (ClubNileRoom DO).            */
try {
  const s = JSON.parse(sessionStorage.getItem('clubnile_session') || 'null');
  if (s && s.name) {
    myName = sanitizeName(s.name) || myName;
    localStorage.setItem('clubnile_name', myName);
    chatNameEl.value = myName;
  }
} catch (e) { /* no session — guest play with local chips */ }

/* test hook (only with ?debug=1 in the URL) */
if (new URLSearchParams(location.search).has('debug')) {
  window.CN = {
    enterCraps, enterBlackjack, leaveTable, player, cr, bj, social, popups, sound, SPRITES,
    get chips() { return chips; }, setChips,
    skipTitle() { started = true; titleAlpha = 0; }
  };
}
</script>
