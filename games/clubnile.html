<!DOCTYPE html>
<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* ============================================================
   CLUB NILE — mobile-first shell.
   The console frame (egypt-console.png, 832x1248) scales to the
   viewport WIDTH first; every overlay (screen window, d-pad,
   A/B buttons, labels) is positioned in PERCENTAGES of the frame
   so it adapts to any phone size. The game canvas has a fixed
   internal retro resolution (240x240) stretched into the window.
   ============================================================ */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  height: 100%;
  background: #0c0912;
  overflow: hidden;
  touch-action: none;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
  font-family: 'Press Start 2P', monospace;
}
body {
  display: flex;
  justify-content: center;
  align-items: center;
  background:
    radial-gradient(ellipse at 50% 0%, #1a1326 0%, #0c0912 70%);
}
/* Frame container: full phone width, capped by viewport height */
#console {
  position: relative;
  width: min(100vw, calc(100dvh * 832 / 1248));
  aspect-ratio: 832 / 1248;
  container-type: inline-size;
}
#console img.frame {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 2;
  pointer-events: none;
}
/* Game canvas sits inside the frame's transparent screen window.
   Window measured on the 832x1248 art: x 36-795, y 36-793. */
#screen {
  position: absolute;
  left: 4.33%;
  top: 2.88%;
  width: 91.2%;
  height: 60.65%;
  z-index: 1;
  background: #0a0710;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}
/* ---- Touch controls: transparent hotspots over the printed
        d-pad and buttons, all in % of the frame.
        RIGHT button = A (select) · LEFT button = B (back) ---- */
.hot { position: absolute; z-index: 3; touch-action: none; }
#dpad  { left: 9%;  top: 68.5%; width: 34%; height: 24%; }
#btn-b { left: 51%; top: 78%;   width: 23%; height: 15.5%; border-radius: 50%; }
#btn-a { left: 70%; top: 71%;   width: 23%; height: 15.5%; border-radius: 50%; }
.hot.pressed {
  background: radial-gradient(circle, rgba(255,235,170,0.28) 0%, rgba(255,235,170,0) 70%);
}
/* Small A / B letters under the buttons (sized in % of frame width) */
.btn-label {
  position: absolute;
  z-index: 3;
  width: 8%;
  padding: 0.6cqw 0;
  text-align: center;
  color: #f2d488;
  font-size: 3.2cqw;
  letter-spacing: 0.2cqw;
  background: rgba(24,14,4,0.5);
  border-radius: 2cqw;
  text-shadow: 0 1px 2px rgba(20,10,0,0.9);
  pointer-events: none;
}
#label-b { left: 58.5%; top: 93.5%; }
#label-a { left: 77.5%; top: 86.8%; }
/* Desktop keyboard hint (hidden on touch devices) */
#kbd-hint {
  position: fixed;
  bottom: 0.5%;
  left: 50%;
  transform: translateX(-50%);
  color: #d9ae5f;
  font-size: 8px;
  letter-spacing: 1px;
  text-align: center;
  background: rgba(12,9,18,0.7);
  padding: 6px 10px;
  border-radius: 6px;
  z-index: 4;
  display: none;
}
@media (pointer: fine) { #kbd-hint { display: block; } }
</style>
</head>
<body>

<div id="console">
  <canvas id="screen" width="240" height="240"></canvas>
  <img class="frame" src="../assets/membersonly/egypt-console.png" alt="Club Nile console">
  <div class="hot" id="dpad"></div>
  <div class="hot" id="btn-b"></div>
  <div class="hot" id="btn-a"></div>
  <div class="btn-label" id="label-b">B</div>
  <div class="btn-label" id="label-a">A</div>
</div>
<div id="kbd-hint">ARROWS / WASD MOVE &nbsp;·&nbsp; E / ENTER = A &nbsp;·&nbsp; ESC = B</div>

<script>
'use strict';
/* ==========================================================================
   CLUB NILE — a 1920s Egyptian speakeasy casino (top-down, LTTP-style).
   All art is procedural pixel art drawn at boot; no sprite sheets needed.
   Internal resolution: 240x240 (15x15 tiles of 16px), scaled by CSS.

   Scenes: 'floor' (walkable casino) · 'blackjack' · 'craps' (table views).
   Table scenes use a seat roster (seats[]) so that once wallet sign-in
   lands, remote players from the Worker/Durable Object can fill seats —
   mirroring the on-chain flow: Gamble.commitWager() buy-in → play off
   chain → oracle-signed Gamble.claimWinnings() payout.
   ========================================================================== */

const TS = 16, COLS = 15, ROWS = 15, W = 240, H = 240;
const cvs = document.getElementById('screen');
const ctx = cvs.getContext('2d');
ctx.imageSmoothingEnabled = false;

/* ---------------------------- palette ---------------------------- */
const C = {
  floorA:'#e0c48e', floorB:'#d5b67c', floorDot:'#c8a86e',
  wall:'#b98f4e', wallDark:'#9a743c', wallLine:'#8a6733', wallGold:'#e7c060',
  sideWall:'#7d5f33', sideWallDark:'#6a5029',
  rug:'#8e2433', rugDark:'#7a1e2c', rugGold:'#d9ae5f',
  wood:'#7a4a2b', woodLight:'#9c6a3c', woodDark:'#5e3820',
  feltGreen:'#2e7d4f', feltGreenDark:'#256641',
  feltBlue:'#2b4d8c', feltBlueDark:'#22407a',
  gold:'#f5d76e', goldDark:'#c9a13b',
  white:'#f7f3e8', black:'#17121a',
  red:'#c0392b',
  flame1:'#ffb347', flame2:'#ffd97a', flame3:'#ff8c42',
  leaf:'#3f8f4f', leafDark:'#2f6f3c', pot:'#b05c35', potDark:'#8e4628',
  shadow:'rgba(20,10,5,0.25)',
  uiBg:'rgba(18,13,31,0.94)'
};
const FONT = '8px "Press Start 2P", monospace';

/* ============================ sprites ============================ */
/* 12x16 chibi characters: head (8 rows) + body (5) + legs (3).
   Chars: H hat, h hat accent, K hair, S skin, E eye,
          T top, t top accent, B bottom, F shoes, . empty      */

const HEADS = {
  fez: {
    down:['....HHHH....','...HHHHHh...','...SSSSSS...','..SSSSSSSS..','..SESSSSES..','..SSSSSSSS..','...SSSSSS...','.....SS.....'],
    up:  ['....HHHH....','...HHHHHH...','...KKKKKK...','..KKKKKKKK..','..KKKKKKKK..','..KKKKKKKK..','...KKKKKK...','.....SS.....'],
    side:['...HHHH.....','..HHHHHh....','..SSSSSS....','.SSSSSSSS...','.SESSSSSS...','.SSSSSSSS...','..SSSSSS....','.....SS.....']
  },
  nemes: {
    down:['...HHHHHH...','..HhHHHHhH..','..HSSSSSSH..','.HHSSSSSSHH.','.HHSESSESHH.','.HHSSSSSSHH.','..HSSSSSSH..','..H..SS..H..'],
    up:  ['...HHHHHH...','..HhHHHHhH..','..HHHHHHHH..','.HHhHHHHhHH.','.HHHHHHHHHH.','.HHhHHHHhHH.','..HHHHHHHH..','..H..HH..H..'],
    side:['..HHHHHH....','.HhHHHHH....','.HSSSSSH....','.HSSSSSHH...','.HSESSSHH...','.HSSSSSHH...','.HSSSSSH....','....SS.H....']
  },
  bob: {
    down:['....KKKK....','...KKKKKKh..','..KhhhhhhK..','..KSSSSSSK..','..KSESSESK..','..KSSSSSSK..','...SSSSSS...','.....SS.....'],
    up:  ['....KKKK....','...KKKKKKh..','..KhhhhhhK..','..KKKKKKKK..','..KKKKKKKK..','..KKKKKKKK..','...KKKKKK...','.....SS.....'],
    side:['...KKKK.....','..KKKKKh....','.Khhhhhh....','.KSSSSKK....','.KSESSKK....','.KSSSSKK....','..SSSSK.....','.....SS.....']
  }
};
const BODIES = {
  suit: ['...TTttTT...','..TTTttTTT..','.STTTTTTTTS.','..TTTTTTTT..','...BBBBBB...'],
  dress:['...TTTTTT...','..STTTTTTS..','..STTTTTTS..','..TTTTTTTT..','.TTTTTTTTTT.']
};
const LEGS = {
  suit: [ ['...BB..BB...','...BB..BB...','...FF..FF...'], ['...BB..BB...','..BB....BB..','..FF....FF..'] ],
  dress:[ ['...SS..SS...','...SS..SS...','...FF..FF...'], ['...SS..SS...','..SS....SS..','..FF....FF..'] ]
};

function paintRows(g, rows, pal, yOff) {
  for (let y = 0; y < rows.length; y++) {
    const r = rows[y];
    for (let x = 0; x < 12; x++) {
      const ch = r[x];
      if (ch === '.' || !pal[ch]) continue;
      g.fillStyle = pal[ch];
      g.fillRect(x, y + yOff, 1, 1);
    }
  }
}
function buildFrame(head, body, legs, pal, mirror) {
  const c = document.createElement('canvas');
  c.width = 12; c.height = 16;
  const g = c.getContext('2d');
  paintRows(g, head, pal, 0);
  paintRows(g, body, pal, 8);
  paintRows(g, legs, pal, 13);
  if (!mirror) return c;
  const m = document.createElement('canvas');
  m.width = 12; m.height = 16;
  const mg = m.getContext('2d');
  mg.translate(12, 0); mg.scale(-1, 1);
  mg.drawImage(c, 0, 0);
  return m;
}
function makeCharacter(headStyle, bodyStyle, pal) {
  const hd = HEADS[headStyle], bd = BODIES[bodyStyle], lg = LEGS[bodyStyle];
  const out = {};
  out.down  = [0,1].map(f => buildFrame(hd.down, bd, lg[f], pal, false));
  out.up    = [0,1].map(f => buildFrame(hd.up,   bd, lg[f], pal, false));
  out.left  = [0,1].map(f => buildFrame(hd.side, bd, lg[f], pal, false));
  out.right = [0,1].map(f => buildFrame(hd.side, bd, lg[f], pal, true));
  return out;
}

const SPRITES = {
  player:    makeCharacter('fez',   'suit',  {H:'#c0392b',h:C.gold,K:'#2e1f14',S:'#f0c8a0',E:C.black,T:'#f5eedd',t:C.black,B:'#26202e',F:C.black}),
  bartender: makeCharacter('fez',   'suit',  {H:'#c0392b',h:C.gold,K:'#14100d',S:'#e3b184',E:C.black,T:'#fbf7ec',t:'#a32638',B:C.black,F:'#0e0b09'}),
  crapsDealer:makeCharacter('nemes','suit',  {H:'#2f7f96',h:C.gold,S:'#e3b184',E:C.black,T:'#7e2433',t:C.gold,B:C.black,F:'#0e0b09'}),
  bjDealer:  makeCharacter('nemes', 'suit',  {H:'#345b9e',h:C.gold,S:'#caa27a',E:C.black,T:'#1f6b46',t:C.gold,B:C.black,F:'#0e0b09'}),
  guestF:    makeCharacter('bob',   'dress', {K:'#171114',h:'#e05a70',S:'#f0c8a0',E:C.black,T:'#b02a3c',B:'#b02a3c',F:C.gold}),
  guestM:    makeCharacter('fez',   'suit',  {H:'#171114',h:'#171114',K:'#171114',S:'#e9bd93',E:C.black,T:'#22242b',t:'#fbf7ec',B:'#171114',F:'#0e0b09'})
};

/* ============================ map ============================ */
const BAR = { c0:4, c1:10, row:3 };
const CRAPS_T = { c0:2, c1:5, r0:8, r1:9 };
const BJ_T = { c0:9, c1:12, r0:8, r1:9 };
const PALMS = [[1,4],[13,4],[1,12],[13,12]];
const DOOR = { c:7, r:14 };
const RUG = { c0:5, c1:9, r0:5, r1:12 };

const solid = new Set();
const key = (c,r) => c + ',' + r;
for (let c = 0; c < COLS; c++) { solid.add(key(c,0)); solid.add(key(c,1)); solid.add(key(c,14)); }
for (let r = 0; r < ROWS; r++) { solid.add(key(0,r)); solid.add(key(14,r)); }
for (let c = BAR.c0; c <= BAR.c1; c++) solid.add(key(c, BAR.row));
for (let c = CRAPS_T.c0; c <= CRAPS_T.c1; c++) for (let r = CRAPS_T.r0; r <= CRAPS_T.r1; r++) solid.add(key(c,r));
for (let c = BJ_T.c0; c <= BJ_T.c1; c++) for (let r = BJ_T.r0; r <= BJ_T.r1; r++) solid.add(key(c,r));
PALMS.forEach(([c,r]) => solid.add(key(c,r)));
solid.add(key(7,2));   // bartender
solid.add(key(3,7));   // craps dealer
solid.add(key(11,7));  // blackjack dealer

const talkMap = {};
for (let c = BAR.c0; c <= BAR.c1; c++) talkMap[key(c, BAR.row)] = 'bartender';
talkMap[key(7,2)] = 'bartender';
for (let c = CRAPS_T.c0; c <= CRAPS_T.c1; c++) for (let r = CRAPS_T.r0; r <= CRAPS_T.r1; r++) talkMap[key(c,r)] = 'craps';
talkMap[key(3,7)] = 'craps';
for (let c = BJ_T.c0; c <= BJ_T.c1; c++) for (let r = BJ_T.r0; r <= BJ_T.r1; r++) talkMap[key(c,r)] = 'blackjack';
talkMap[key(11,7)] = 'blackjack';
talkMap[key(DOOR.c, DOOR.r)] = 'door';

/* ============================ chips ============================ */
/* Local stand-in for on-chain chips (MembersOnlyItems token 0).
   Table buy-ins/payouts mirror Gamble.commitWager/claimWinnings. */
let chips = parseInt(localStorage.getItem('clubnile_chips') || '500', 10);
function setChips(v) {
  chips = Math.max(0, v);
  localStorage.setItem('clubnile_chips', String(chips));
}

/* ============================ dialogue ============================ */
const NPC_TALK = {
  bartender: {
    name: 'PTAH · BARTENDER',
    lines: [
      ["Welcome to Club Nile, friend. Finest speakeasy this side of the pyramids."],
      ["What'll it be? Gin fizz? Nile mud?", "...We serve chips. Only chips."],
      ["Hold on to your chips for tournament night. Big prizes for the top stacks."],
      ["Word is the pharaoh himself couldn't get a table on tournament night."]
    ]
  },
  craps: {
    name: 'NEFERU · CRAPS',
    lines: [["Feeling lucky? The bones are warm tonight.", "Take a seat at the craps table?  A: SIT · B: LATER"]],
    action: 'craps',
    broke: ["No chips, no dice, friend.", "Ptah pours courage at the bar. Come back with a stack."]
  },
  blackjack: {
    name: 'AMEN-RA · BLACKJACK',
    lines: [["Twenty-one is a sacred number, you know.", "Take a seat at the blackjack table?  A: SIT · B: LATER"]],
    action: 'blackjack',
    broke: ["The felt is for players holding chips.", "Come back when your pockets jingle."]
  },
  door: {
    name: 'CLUB NILE',
    lines: [["Leave the party?", "A to head out. B to stay."]],
    action: 'exit'
  },
  guestF: {
    name: 'ZELDA · FLAPPER',
    lines: [
      ["Some party, huh? The band doesn't stop 'til sunrise."],
      ["I hear the chips here are older than the Sphinx."]
    ]
  },
  guestM: {
    name: 'ARCHIE · REGULAR',
    lines: [
      ["Swell joint, isn't it? Don't tell the coppers."],
      ["Lost my whole stack at craps. Worth it."]
    ]
  }
};
const talkIdx = {};
function nextLine(id) {
  const t = NPC_TALK[id];
  if (t.action && t.broke && chips < 5) return { pages: t.broke, action: null };
  talkIdx[id] = (talkIdx[id] || 0);
  const pages = t.lines[talkIdx[id] % t.lines.length];
  talkIdx[id]++;
  return { pages, action: t.action || null };
}

/* ============================ entities ============================ */
const player = { x: 7.5*TS, y: 13*TS - 2, dir: 'up', frame: 0, animT: 0, moving: false };
const npcs = [
  { id:'bartender',  sprite:'bartender',  x: 7.5*TS, y: 3*TS - 3,  dir:'down' },
  { id:'craps',      sprite:'crapsDealer',x: 3.5*TS, y: 8*TS - 3,  dir:'down' },
  { id:'blackjack',  sprite:'bjDealer',   x: 11.5*TS,y: 8*TS - 3,  dir:'down' }
];
const guests = [
  { id:'guestF', sprite:'guestF', x: 5.5*TS, y: 6.5*TS, dir:'down', frame:0, animT:0, moveT:0, dx:0, dy:0 },
  { id:'guestM', sprite:'guestM', x: 9.5*TS, y: 11.5*TS, dir:'left', frame:0, animT:0, moveT:0, dx:0, dy:0 }
];

/* ============================ input ============================ */
const input = { up:false, down:false, left:false, right:false };
let aQueued = false, bQueued = false;      // A = select · B = back

addEventListener('keydown', e => {
  const k = e.key;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(k)) e.preventDefault();
  if (k === 'ArrowUp'    || k === 'w' || k === 'W') { input.up = true;    if (!e.repeat) tapQ.up = true; }
  if (k === 'ArrowDown'  || k === 's' || k === 'S') { input.down = true;  if (!e.repeat) tapQ.down = true; }
  if (k === 'ArrowLeft'  || k === 'a' || k === 'A') { input.left = true;  if (!e.repeat) tapQ.left = true; }
  if (k === 'ArrowRight' || k === 'd' || k === 'D') { input.right = true; if (!e.repeat) tapQ.right = true; }
  if (!e.repeat && (k === 'Enter' || k === ' ' || k === 'e' || k === 'E' || k === 'z' || k === 'Z')) aQueued = true;
  if (!e.repeat && (k === 'Escape' || k === 'x' || k === 'X' || k === 'Backspace')) bQueued = true;
});
addEventListener('keyup', e => {
  const k = e.key;
  if (k === 'ArrowUp'    || k === 'w' || k === 'W') input.up = false;
  if (k === 'ArrowDown'  || k === 's' || k === 'S') input.down = false;
  if (k === 'ArrowLeft'  || k === 'a' || k === 'A') input.left = false;
  if (k === 'ArrowRight' || k === 'd' || k === 'D') input.right = false;
});
/* edge-triggered d-pad taps (menus). Taps are ALSO queued straight from
   keydown so a quick press between frames is never lost. */
let tapUp = false, tapDown = false, tapLeft = false, tapRight = false;
const tapQ = { up:false, down:false, left:false, right:false };
let prevIn = { up:false, down:false, left:false, right:false };
function readTaps() {
  tapUp = (input.up && !prevIn.up) || tapQ.up;
  tapDown = (input.down && !prevIn.down) || tapQ.down;
  tapLeft = (input.left && !prevIn.left) || tapQ.left;
  tapRight = (input.right && !prevIn.right) || tapQ.right;
  tapQ.up = tapQ.down = tapQ.left = tapQ.right = false;
  prevIn = { ...input };
}

const dpadEl = document.getElementById('dpad');
function dpadFrom(e) {
  const r = dpadEl.getBoundingClientRect();
  const nx = (e.clientX - r.left) / r.width - 0.5;
  const ny = (e.clientY - r.top) / r.height - 0.5;
  input.up = input.down = input.left = input.right = false;
  if (Math.abs(nx) < 0.08 && Math.abs(ny) < 0.08) return;
  if (Math.abs(nx) > Math.abs(ny)) { if (nx < 0) input.left = true; else input.right = true; }
  else { if (ny < 0) input.up = true; else input.down = true; }
}
dpadEl.addEventListener('pointerdown', e => { dpadEl.setPointerCapture(e.pointerId); dpadEl.classList.add('pressed'); dpadFrom(e); });
dpadEl.addEventListener('pointermove', e => { if (dpadEl.classList.contains('pressed')) dpadFrom(e); });
['pointerup','pointercancel'].forEach(ev => dpadEl.addEventListener(ev, () => {
  dpadEl.classList.remove('pressed');
  input.up = input.down = input.left = input.right = false;
}));

function bindButton(id, fn) {
  const el = document.getElementById(id);
  el.addEventListener('pointerdown', e => { e.preventDefault(); el.classList.add('pressed'); fn(); });
  ['pointerup','pointercancel','pointerleave'].forEach(ev => el.addEventListener(ev, () => el.classList.remove('pressed')));
}
bindButton('btn-a', () => { aQueued = true; });   // right button = A = select
bindButton('btn-b', () => { bQueued = true; });   // left button  = B = back

/* ============================ dialogue box ============================ */
const dlg = { open:false, id:null, name:'', pages:[], page:0, chars:0, action:null };
const DLG_SPEED = 0.5;   // characters revealed per frame (slower = cosier)

function wrapText(text, maxW) {
  const words = text.split(' ');
  const lines = [];
  let cur = '';
  ctx.font = FONT;
  for (const w of words) {
    const test = cur ? cur + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; }
    else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}
function openDialog(id) {
  const t = NPC_TALK[id];
  const line = nextLine(id);
  dlg.open = true; dlg.id = id; dlg.name = t.name;
  dlg.pages = line.pages;
  dlg.page = 0; dlg.chars = 0;
  dlg.action = line.action;
  const npc = npcs.find(n => n.id === id);
  if (npc) {
    if (player.y > npc.y + 8) npc.dir = 'down';
    else if (player.x < npc.x - 8) npc.dir = 'left';
    else if (player.x > npc.x + 8) npc.dir = 'right';
  }
}
function dialogSelect() {
  const full = dlg.pages[dlg.page].length;
  if (dlg.chars < full) { dlg.chars = full; return; }
  if (dlg.page < dlg.pages.length - 1) { dlg.page++; dlg.chars = 0; return; }
  dlg.open = false;
  if (dlg.action === 'exit') { window.location.href = '../clublounge.html'; return; }
  if (dlg.action === 'craps') startTransition(() => enterCraps());
  if (dlg.action === 'blackjack') startTransition(() => enterBlackjack());
}

/* ============================ interaction ============================ */
function facingTile() {
  const tc = Math.floor(player.x / TS), tr = Math.floor((player.y - 4) / TS);
  let dc = 0, dr = 0;
  if (player.dir === 'up') dr = -1; else if (player.dir === 'down') dr = 1;
  else if (player.dir === 'left') dc = -1; else dc = 1;
  return key(tc + dc, tr + dr);
}
function nearGuest() {
  for (const g of guests) {
    const d = Math.abs(g.x - player.x) + Math.abs(g.y - player.y);

function blocked(px, py) {
  const pts = [[px-4,py-2],[px+3,py-2],[px-4,py+3],[px+3,py+3]];
  for (const [x,y] of pts) {
    if (solid.has(key(Math.floor(x/TS), Math.floor(y/TS)))) return true;
  }
  return false;
}
function moveEntity(ent, dx, dy, speed) {
  let moved = false;
  if (dx) {
    const nx = ent.x + dx * speed;
    if (!blocked(nx, ent.y)) { ent.x = nx; moved = true; }
  }
  if (dy) {
    const ny = ent.y + dy * speed;
    if (!blocked(ent.x, ny)) { ent.y = ny; moved = true; }
  }
  return moved;
}

function newDeck() {
  const d = [];
  for (let s = 0; s < 4; s++) for (let r = 1; r <= 13; r++) d.push({ r, s });
  for (let i = d.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [d[i], d[j]] = [d[j], d[i]];
  }
  return d;
}
function handValue(hand) {
  let v = 0, aces = 0;
  for (const c of hand) {
    if (c.r === 1) { aces++; v += 11; }
    else v += Math.min(c.r, 10);
  }
  while (v > 21 && aces > 0) { v -= 10; aces--; }
  return v;
}

const bj = {
  state:'bet', betIdx:1, bet:0, deck:[], dealer:[], hole:true,
  seats:[], timer:0, dealQ:[], menuIdx:0, result:'', flash:0
};
function enterBlackjack() {
  scene = 'blackjack';
  bj.state = 'bet'; bj.menuIdx = 0; bj.result = '';
  bj.dealer = []; bj.hole = true;
  /* seat roster — index 1 is always you; others may be lounge guests.
     Future: remote players from the table Durable Object fill these. */
  bj.seats = [null, null, null, null].map((_, i) => {
    if (i === 1) return { sprite:'player', you:true, hand:[], done:false, out:false };
    if (Math.random() < 0.5) return { sprite: (i % 2) ? 'guestM' : 'guestF', you:false, hand:[], done:false, out:false };
    return null;
  });
}
function bjOccupied() { return bj.seats.map((s,i)=>({s,i})).filter(o => o.s); }
function bjStartHand() {
  bj.bet = BETS[bj.betIdx];
  setChips(chips - bj.bet);             // buy-in (≙ commitWager)
  bj.deck = newDeck();
  bj.dealer = []; bj.hole = true; bj.result = '';
  for (const o of bjOccupied()) { o.s.hand = []; o.s.done = false; o.s.out = false; }
  bj.dealQ = [];
  for (let round = 0; round < 2; round++) {
    for (const o of bjOccupied()) bj.dealQ.push(o.i);
    bj.dealQ.push(-1);                  // dealer
  }
  bj.state = 'dealing'; bj.timer = 0;
}
function bjUpdate() {
  const you = bj.seats[1];
  if (bj.state === 'bet') {
    if (chips < BETS[0]) {
      if (bQueued) { bQueued = false; startTransition(() => leaveTable('blackjack')); }
      aQueued = false;
      return;
    }
    if (tapUp)   { do { bj.betIdx = (bj.betIdx + 1) % BETS.length; } while (BETS[bj.betIdx] > chips); }
    if (tapDown) { do { bj.betIdx = (bj.betIdx + BETS.length - 1) % BETS.length; } while (BETS[bj.betIdx] > chips); }
    if (BETS[bj.betIdx] > chips) bj.betIdx = 0;
    if (aQueued) { aQueued = false; bjStartHand(); }
    if (bQueued) { bQueued = false; startTransition(() => leaveTable('blackjack')); }
  }
  else if (bj.state === 'dealing') {
    aQueued = bQueued = false;
    if (++bj.timer >= 16) {
      bj.timer = 0;
      const next = bj.dealQ.shift();
      if (next === -1) bj.dealer.push(bj.deck.pop());
      else bj.seats[next].hand.push(bj.deck.pop());
      if (!bj.dealQ.length) {
        if (handValue(you.hand) === 21) { you.done = true; bj.state = 'others'; bj.timer = 0; }
        else { bj.state = 'player'; bj.menuIdx = 0; }
      }
    }
  }
  else if (bj.state === 'player') {
    const canDouble = you.hand.length === 2 && chips >= bj.bet;
    const menu = canDouble ? ['HIT','STAND','DOUBLE'] : ['HIT','STAND'];
    if (tapLeft)  bj.menuIdx = (bj.menuIdx + menu.length - 1) % menu.length;
    if (tapRight) bj.menuIdx = (bj.menuIdx + 1) % menu.length;
    if (bj.menuIdx >= menu.length) bj.menuIdx = 0;
    if (aQueued) {
      aQueued = false;
      const pick = menu[bj.menuIdx];
      if (pick === 'HIT') {
        you.hand.push(bj.deck.pop());
        const v = handValue(you.hand);
        if (v > 21) { you.out = true; you.done = true; bj.state = 'others'; bj.timer = 0; }
        else if (v === 21) { you.done = true; bj.state = 'others'; bj.timer = 0; }
      } else if (pick === 'STAND') {
        you.done = true; bj.state = 'others'; bj.timer = 0;
      } else if (pick === 'DOUBLE') {
        setChips(chips - bj.bet); bj.bet *= 2;
        you.hand.push(bj.deck.pop());
        if (handValue(you.hand) > 21) you.out = true;
        you.done = true; bj.state = 'others'; bj.timer = 0;
      }
    }
    bQueued = false;
  }
  else if (bj.state === 'others') {
    /* seated guests play out their hands, one visible move at a time */
    aQueued = bQueued = false;
    if (++bj.timer >= 22) {
      bj.timer = 0;
      const g = bjOccupied().find(o => !o.s.you && !o.s.done);
      if (g) {
        if (handValue(g.s.hand) < 16) {
          g.s.hand.push(bj.deck.pop());
          if (handValue(g.s.hand) > 21) { g.s.out = true; g.s.done = true; }
        } else g.s.done = true;
      } else { bj.state = 'dealerTurn'; bj.hole = false; bj.timer = 0; }
    }
  }
  else if (bj.state === 'dealerTurn') {
    aQueued = bQueued = false;
    if (++bj.timer >= 26) {
      bj.timer = 0;
      if (handValue(bj.dealer) < 17) bj.dealer.push(bj.deck.pop());
      else {
        /* settle — payout mint (≙ oracle-signed claimWinnings) */
        const dv = handValue(bj.dealer), pv = handValue(you.hand);
        const natural = pv === 21 && you.hand.length === 2;
        let payout = 0;
        if (you.out) { bj.result = 'BUST  -' + bj.bet; }
        else if (natural && !(dv === 21 && bj.dealer.length === 2)) {
          payout = bj.bet + Math.floor(bj.bet * 1.5);
          bj.result = 'BLACKJACK!  +' + Math.floor(bj.bet * 1.5);
        }
        else if (dv > 21 || pv > dv) { payout = bj.bet * 2; bj.result = 'YOU WIN  +' + bj.bet; }
        else if (pv === dv) { payout = bj.bet; bj.result = 'PUSH'; }
        else { bj.result = 'DEALER WINS  -' + bj.bet; }
        if (payout) setChips(chips + payout);
        bj.flash = payout > bj.bet ? 40 : 0;
        bj.state = 'result';
      }
    }
  }
  else if (bj.state === 'result') {
    if (bj.flash > 0) bj.flash--;
    if (aQueued) { aQueued = false; bj.state = 'bet'; }
    if (bQueued) { bQueued = false; startTransition(() => leaveTable('blackjack')); }
  }
}
function drawHand(g, hand, x, y, hideFirst) {
  for (let i = 0; i < hand.length; i++) {
    const img = (hideFirst && i === 0) ? cardBack : cardFace(hand[i].r, hand[i].s);
    g.drawImage(img, x + i * 7, y - ((hideFirst && i === 0) ? 0 : 0));
  }
}
function bjRender() {

  drawHand(ctx, bj.dealer, 120 - Math.max(1, bj.dealer.length) * 7 / 2 - 5, 60, bj.hole);
  if (!bj.hole && bj.dealer.length) {

const CR_NUMS = [4, 5, 6, 8, 9, 10];

const crRoom = makeCanvas(W, H, g => {

  g.fillRect(30, 50, 180, 1);
});
const cr = {
  state:'bet', betIdx:1, bet:0, point:0, dice:[3,4], rolling:0,
  result:'', seats:[], flash:0, phase:'comeout'
};
function enterCraps() {
  scene = 'craps';
  cr.state = 'bet'; cr.point = 0; cr.result = ''; cr.rolling = 0;
  cr.dice = [3, 4];
  cr.seats = [null, null, null, null].map((_, i) => {
    if (i === 1) return { sprite:'player', you:true };
    if (Math.random() < 0.5) return { sprite: (i % 2) ? 'guestM' : 'guestF', you:false };
    return null;
  });
}
function crRoll() {
  cr.rolling = 34;
}
function crSettle(win, msg) {
  if (win) { setChips(chips + cr.bet * 2); cr.flash = 40; }   // 1:1 pass line
  else cr.flash = 0;
  cr.result = msg;
  cr.state = 'result';
  cr.point = 0;
}
function crUpdate() {
  if (cr.rolling > 0) {
    aQueued = bQueued = false;
    if (cr.rolling % 4 === 0) {
      cr.dice = [1 + Math.floor(Math.random() * 6), 1 + Math.floor(Math.random() * 6)];
    }
    if (--cr.rolling === 0) {
      const sum = cr.dice[0] + cr.dice[1];
      if (cr.state === 'comeout') {
        if (sum === 7 || sum === 11) crSettle(true, sum + '!  WINNER  +' + cr.bet);
        else if (sum === 2 || sum === 3 || sum === 12) crSettle(false, 'CRAPS ' + sum + '  -' + cr.bet);
        else { cr.point = sum; cr.state = 'point'; }
      } else if (cr.state === 'point') {
        if (sum === cr.point) crSettle(true, 'HIT THE POINT!  +' + cr.bet);
        else if (sum === 7) crSettle(false, 'SEVEN OUT  -' + cr.bet);
      }
    }
    return;
  }
  if (cr.state === 'bet') {
    if (chips < BETS[0]) {
      if (bQueued) { bQueued = false; startTransition(() => leaveTable('craps')); }
      aQueued = false;
      return;
    }
    if (tapUp)   { do { cr.betIdx = (cr.betIdx + 1) % BETS.length; } while (BETS[cr.betIdx] > chips); }
    if (tapDown) { do { cr.betIdx = (cr.betIdx + BETS.length - 1) % BETS.length; } while (BETS[cr.betIdx] > chips); }
    if (BETS[cr.betIdx] > chips) cr.betIdx = 0;
    if (aQueued) {
      aQueued = false;
      cr.bet = BETS[cr.betIdx];
      setChips(chips - cr.bet);          // pass-line stake (≙ commitWager)
      cr.state = 'comeout';
    }
    if (bQueued) { bQueued = false; startTransition(() => leaveTable('craps')); }
  }
  else if (cr.state === 'comeout' || cr.state === 'point') {
    if (aQueued) { aQueued = false; crRoll(); }
    bQueued = false;
  }
  else if (cr.state === 'result') {
    if (cr.flash > 0) cr.flash--;
    if (aQueued) { aQueued = false; cr.state = 'bet'; }
    if (bQueued) { bQueued = false; startTransition(() => leaveTable('craps')); }
  }
}
function crRender() {
  ctx.drawImage(crRoom, 0, 0);

  for (let i = 0; i < 4; i++) {

    if (!seat) {
      ctx.fillStyle = C.woodDark; ctx.fillRect(pos.x - 4, pos.y - 2, 8, 4);

    drawSeated(ctx, seat.sprite, pos.x, pos.y + hop);
    if (seat.you) {
      ctx.fillStyle = C.gold; ctx.font = FONT; ctx.textBaseline = 'top';
      ctx.fillText('YOU', pos.x - 11, pos.y + 5);
    }
  }
  /* UI band */
  uiPanel();
  ctx.font = FONT; ctx.textBaseline = 'top';
  if (cr.state === 'bet') {
    if (chips < BETS[0]) {
      uiText('OUT OF CHIPS', C.white, 190);
      uiText('B: LEAVE TABLE', C.gold, 214);
    } else {
      uiText('PASS LINE BET:  ' + BETS[cr.betIdx], C.white, 190);
      uiText('UP/DOWN: BET   A: SET   B: LEAVE', C.gold, 214);
    }
  } else if (cr.state === 'comeout') {
    uiText(cr.rolling ? 'ROLLING...' : 'COME OUT ROLL', C.white, 190);
    if (!cr.rolling) uiText('A: ROLL THE BONES', C.gold, 214);
  } else if (cr.state === 'point') {
    uiText('POINT IS ' + cr.point + '  ·  ROLL IT AGAIN', C.white, 190);
    if (!cr.rolling) uiText('A: ROLL   (SEVEN LOSES)', C.gold, 214);
  } else if (cr.state === 'result') {
    const win = cr.flash > 0 && Math.floor(tick / 6) % 2;
    uiText(cr.result, win ? C.gold : C.white, 190);
    uiText('A: NEW BET   B: LEAVE', C.gold, 214);
  }
}

/* ============================ particles ============================ */
const confetti = [];
for (let i = 0; i < 14; i++) {
  confetti.push({
    x: 16 + Math.random() * 208, y: Math.random() * 240,
    v: 0.08 + Math.random() * 0.15,
    col: [C.gold, '#e05a70', '#2f7f96', C.white][i % 4],

  });

/* ============================ title + state ============================ */
let titleAlpha = 1, started = false, tick = 0;

/* ============================ floor update ============================ */
function floorUpdate() {
  if (dlg.open) {
    dlg.chars += DLG_SPEED;
    if (aQueued) { aQueued = false; dialogSelect(); }
    if (bQueued) { bQueued = false; dlg.open = false; }
    return;
  }
  let dx = 0, dy = 0;
  if (input.left) { dx = -1; player.dir = 'left'; }
  else if (input.right) { dx = 1; player.dir = 'right'; }
  if (input.up) { dy = -1; if (!dx) player.dir = 'up'; }
  else if (input.down) { dy = 1; if (!dx) player.dir = 'down'; }
  player.moving = !!(dx || dy);
  if (player.moving) {
    moveEntity(player, dx, dy, WALK_SPEED);
    player.animT++;
    if (player.animT % 13 === 0) player.frame = 1 - player.frame;
  } else { player.frame = 0; }

  if (aQueued) {
    aQueued = false;
    const t = interactTarget();
    if (t) {
      if (t.guest) {
        t.guest.dir = player.x < t.guest.x ? 'left' : 'right';
        t.guest.moveT = 120;
        t.guest.dx = 0; t.guest.dy = 0;
      }
      openDialog(t.id);
    }
  }
  if (bQueued) bQueued = false;

  for (const g of guests) {
    if (dlg.open && dlg.id === g.id) continue;
    g.moveT--;
    if (g.moveT <= 0) {
      g.moveT = 50 + Math.floor(Math.random() * 90);
      const roll = Math.random();
      if (roll < 0.4) { g.dx = 0; g.dy = 0; }
      else {
        const dirs = [[0,-1,'up'],[0,1,'down'],[-1,0,'left'],[1,0,'right']];
        const d = dirs[Math.floor(Math.random() * 4)];
        g.dx = d[0]; g.dy = d[1]; g.dir = d[2];
      }
    }
    if (g.dx || g.dy) {
      const moved = moveEntity(g, g.dx, g.dy, GUEST_SPEED);
      if (!moved) { g.dx = 0; g.dy = 0; }
      else {
        g.animT++;
        if (g.animT % 18 === 0) g.frame = 1 - g.frame;
      }
    } else g.frame = 0;
    g.x = Math.max(1.5*TS, Math.min(13.5*TS - 1, g.x));
    g.y = Math.max(4.5*TS, Math.min(13.5*TS - 1, g.y));
  }

  for (const p of confetti) {
    p.y += p.v; p.sway += 0.02;
    p.x += Math.sin(p.sway) * 0.1;
    if (p.y > 236) { p.y = 34; p.x = 16 + Math.random() * 208; }
  }
}

function floorRender() {
  ctx.drawImage(bg, 0, 0);
  drawFlame(ctx, 3*TS + 4, 18);
  drawFlame(ctx, 11*TS + 4, 18);

  const items = [];
  items.push({ y: BAR.row*TS + 16, draw: g => g.drawImage(barCanvas, BAR.c0*TS, BAR.row*TS - 6) });
  items.push({ y: (CRAPS_T.r1+1)*TS, draw: g => g.drawImage(crapsCanvas, CRAPS_T.c0*TS, CRAPS_T.r0*TS) });
  items.push({ y: (BJ_T.r1+1)*TS,    draw: g => g.drawImage(bjCanvas, BJ_T.c0*TS, BJ_T.r0*TS) });
  PALMS.forEach(([c, r]) => items.push({ y: (r+1)*TS, draw: g => g.drawImage(palmCanvas, c*TS, r*TS - 9) }));
  npcs.forEach(n => items.push({ y: n.y, draw: g => drawEntity(g, { ...n, staticNPC: true }, tick + n.x) }));
  guests.forEach(gu => items.push({ y: gu.y, draw: g => drawEntity(g, gu, 0) }));
  items.push({ y: player.y, draw: g => drawEntity(g, { ...player, sprite: 'player' }, 0) });
  items.sort((a, b) => a.y - b.y);
  for (const it of items) it.draw(ctx);

  for (const p of confetti) {
    ctx.fillStyle = p.col;
    ctx.globalAlpha = 0.7;
    ctx.fillRect(Math.round(p.x), Math.round(p.y), 1, 2);
  }
  ctx.globalAlpha = 1;

  if (started && !dlg.open) {
    const t = interactTarget();
    if (t) {
      const bounce = Math.floor(tick / 20) % 2;
      ctx.font = FONT;
      ctx.fillStyle = C.gold;
      ctx.fillText('!', Math.round(player.x) - 2, Math.round(player.y) - 28 - bounce);
    }
  }

  const vg = ctx.createRadialGradient(W/2, H/2 - 10, 60, W/2, H/2, 190);
  vg.addColorStop(0, 'rgba(255,190,90,0.05)');
  vg.addColorStop(1, 'rgba(8,5,14,0.42)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  if (dlg.open) drawDialog(ctx);
  if (titleAlpha > 0) drawTitle(ctx);
}

/* ============================ main loop ============================ */
function update() {
  tick++;
  readTaps();
  if (started && titleAlpha > 0) titleAlpha = Math.max(0, titleAlpha - 0.03);
  if (!started && (input.up || input.down || input.left || input.right || aQueued)) {
    started = true; aQueued = false;
  }
  if (trans.active) {
    trans.t++;
    if (trans.t === 15 && trans.mid) { trans.mid(); trans.mid = null; }
    if (trans.t >= 30) trans.active = false;
    aQueued = bQueued = false;
    return;
  }
  if (!started) { aQueued = bQueued = false; return; }
  if (scene === 'floor') floorUpdate();
  else if (scene === 'blackjack') bjUpdate();
  else if (scene === 'craps') crUpdate();
}
function render() {
  if (scene === 'floor') floorRender();
  else if (scene === 'blackjack') bjRender();
  else if (scene === 'craps') crRender();
  if (scene !== 'floor') {
    const vg = ctx.createRadialGradient(W/2, 110, 60, W/2, 110, 200);
    vg.addColorStop(0, 'rgba(255,190,90,0.04)');
    vg.addColorStop(1, 'rgba(8,5,14,0.35)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }
  if (started) drawHUD(ctx);
  if (trans.active) {
    const a = trans.t < 15 ? trans.t / 15 : (30 - trans.t) / 15;
    ctx.fillStyle = 'rgba(6,4,10,' + Math.min(1, a) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}
function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}
if (document.fonts && document.fonts.load) {
  Promise.all([
    document.fonts.load('8px "Press Start 2P"'),
    document.fonts.load('16px "Press Start 2P"')
  ]).catch(() => {}).then(() => requestAnimationFrame(loop));
} else {
  requestAnimationFrame(loop);
}
</script>
