<script>
'use strict';
/* ==========================================================================
   CLUB NILE — a 1920s Egyptian speakeasy casino (top-down, LTTP-style).
   Scenes: 'floor' · 'blackjack' · 'craps'.

   MULTIPLAYER: real players only at the tables. A lightweight WebSocket
   layer connects to the Worker's ClubNileRoom Durable Object:
     'lobby' room     — casino-wide chat (always connected)
     'craps'/'blackjack' rooms — table presence, emoji reactions, chip tips
   Game hands/rolls stay client-side for now; when wallet sign-in lands,
   buy-ins move to Gamble.commitWager and payouts to oracle-signed
   claimWinnings, and tips become on-chain ERC-1155 chip transfers.
   ========================================================================== */

const TS = 16, COLS = 15, ROWS = 15, W = 240, H = 240;
const cvs = document.getElementById('screen');
const ctx = cvs.getContext('2d');
ctx.imageSmoothingEnabled = false;

/* ---------------------------- palette ---------------------------- */
/* SNES-grade palette: every material gets a 3-4 tone ramp
   (highlight / base / shadow) instead of a single flat NES colour */
const C = {
  floorA:'#ecd9a8', floorB:'#e0c98f', floorC:'#d4b97b', floorDot:'#c2a266',
  wall:'#c89a54', wallLight:'#dcb26b', wallDark:'#a37c40', wallLine:'#8a6733',
  wallGold:'#f2cf6e', wallGoldDark:'#b98d3e',
  sideWall:'#8a6a3a', sideWallLight:'#9d7c46', sideWallDark:'#6e5330',
  rug:'#a3253a', rugDark:'#87182b', rugLight:'#bf3a4c', rugGold:'#e8bc63',
  wood:'#8a5230', woodLight:'#a8693f', woodDark:'#5e3820', woodHi:'#c07f4e',
  feltGreen:'#2e7d4f', feltGreenHi:'#3c9a64', feltGreenDark:'#236743',
  feltBlue:'#2b4d8c', feltBlueHi:'#3a63ad', feltBlueDark:'#223f74',
  gold:'#f5d76e', goldHi:'#ffeaa0', goldDark:'#c9a13b',
  white:'#f7f3e8', black:'#17121a',
  red:'#c0392b', dim:'#8d8398',
  flame1:'#ffb347', flame2:'#ffd97a', flame3:'#ff8c42',
  leaf:'#43a05a', leafHi:'#5cbd6e', leafDark:'#2f6f3c',
  pot:'#b05c35', potHi:'#cf7743', potDark:'#8e4628',
  shadow:'rgba(20,10,5,0.28)',
  uiBg:'rgba(18,13,31,0.94)'
};
const FONT = '8px "Press Start 2P", monospace';
/* deterministic 2D hash for dithering/texture */
function h2(x, y) { return (((x * 73856093) ^ (y * 19349663)) >>> 0) % 97; }

/* ============================ sprites ============================ */
const HEADS = {
  fez: {
    down:['....HHHH....','...HHHHHh...','...SSSSSS...','..SSSSSSSS..','..SESSSSES..','..SSSSSSSS..','...SSSSSS...','.....SS.....'],
    up:  ['....HHHH....','...HHHHHH...','...KKKKKK...','..KKKKKKKK..','..KKKKKKKK..','..KKKKKKKK..','...KKKKKK...','.....SS.....'],
    side:['...HHHH.....','..HHHHHh....','..SSSSSS....','.SSSSSSSS...','.SESSSSSS...','.SSSSSSSS...','..SSSSSS....','.....SS.....']
  },
  nemes: {
    down:['...HHHHHH...','..HhHHHHhH..','..HSSSSSSH..','.HHSSSSSSHH.','.HHSESSESHH.','.HHSSSSSSHH.','..HSSSSSSH..','..H..SS..H..'],
    up:  ['...HHHHHH...','..HhHHHHhH..','..HHHHHHHH..','.HHhHHHHhHH.','.HHHHHHHHHH.','.HHhHHHHhHH.','..HHHHHHHH..','..H..HH..H..'],
    side:['..HHHHHH....','.HhHHHHH....','.HSSSSSH....','.HSSSSSHH...','.HSESSSHH...','.HSSSSSHH...','.HSSSSSH....','....SS.H....']
  },
  bob: {
    down:['....KKKK....','...KKKKKKh..','..KhhhhhhK..','..KSSSSSSK..','..KSESSESK..','..KSSSSSSK..','...SSSSSS...','.....SS.....'],
    up:  ['....KKKK....','...KKKKKKh..','..KhhhhhhK..','..KKKKKKKK..','..KKKKKKKK..','..KKKKKKKK..','...KKKKKK...','.....SS.....'],
    side:['...KKKK.....','..KKKKKh....','.Khhhhhh....','.KSSSSKK....','.KSESSKK....','.KSSSSKK....','..SSSSK.....','.....SS.....']
  }
};
const BODIES = {
  suit: ['...TTttTT...','..TTTttTTT..','.STTTTTTTTS.','..TTTTTTTT..','...BBBBBB...'],
  dress:['...TTTTTT...','..STTTTTTS..','..STTTTTTS..','..TTTTTTTT..','.TTTTTTTTTT.']
};
const LEGS = {
  suit: [ ['...BB..BB...','...BB..BB...','...FF..FF...'], ['...BB..BB...','..BB....BB..','..FF....FF..'] ],
  dress:[ ['...SS..SS...','...SS..SS...','...FF..FF...'], ['...SS..SS...','..SS....SS..','..FF....FF..'] ]
};
function paintRows(g, rows, pal, yOff) {
  for (let y = 0; y < rows.length; y++) {
    const r = rows[y];
    for (let x = 0; x < 12; x++) {
      const ch = r[x];
      if (ch === '.' || !pal[ch]) continue;
      g.fillStyle = pal[ch];
      g.fillRect(x, y + yOff, 1, 1);
    }
  }
}
/* SNES-ifier: dark selective outline + top-light shading pass, the way
   LTTP sprites read — light from above, shadow on the underside edges */
function snesify(c) {
  const w = c.width, h = c.height;
  const g = c.getContext('2d');
  const src = g.getImageData(0, 0, w, h);
  const out = g.createImageData(w, h);
  const A = (x, y) => (x < 0 || y < 0 || x >= w || y >= h) ? 0 : src.data[(y * w + x) * 4 + 3];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = (y * w + x) * 4;
    if (src.data[i + 3] > 0) {
      let r = src.data[i], gg = src.data[i + 1], b = src.data[i + 2];
      if (A(x, y - 1) === 0) { r = Math.min(255, r * 1.22 + 12); gg = Math.min(255, gg * 1.22 + 12); b = Math.min(255, b * 1.18 + 8); }
      else if (A(x, y + 1) === 0 || A(x + 1, y) === 0) { r *= 0.76; gg *= 0.76; b *= 0.8; }
      out.data[i] = r; out.data[i + 1] = gg; out.data[i + 2] = b; out.data[i + 3] = 255;
    } else if (A(x - 1, y) || A(x + 1, y) || A(x, y - 1) || A(x, y + 1)) {
      out.data[i] = 38; out.data[i + 1] = 22; out.data[i + 2] = 26; out.data[i + 3] = 255;
    }
  }
  g.putImageData(out, 0, 0);
}
function buildFrame(head, body, legs, pal, mirror) {
  const c = document.createElement('canvas');
  c.width = 14; c.height = 18;      // 1px margin all round for the outline
  const g = c.getContext('2d');
  g.translate(1, 1);
  paintRows(g, head, pal, 0);
  paintRows(g, body, pal, 8);
  paintRows(g, legs, pal, 13);
  g.setTransform(1, 0, 0, 1, 0, 0);
  snesify(c);
  if (!mirror) return c;
  const m = document.createElement('canvas');
  m.width = 14; m.height = 18;
  const mg = m.getContext('2d');
  mg.translate(14, 0); mg.scale(-1, 1);
  mg.drawImage(c, 0, 0);
  return m;
}
function makeCharacter(headStyle, bodyStyle, pal) {
  const hd = HEADS[headStyle], bd = BODIES[bodyStyle], lg = LEGS[bodyStyle];
  const out = {};
  out.down  = [0,1].map(f => buildFrame(hd.down, bd, lg[f], pal, false));
  out.up    = [0,1].map(f => buildFrame(hd.up,   bd, lg[f], pal, false));
  out.left  = [0,1].map(f => buildFrame(hd.side, bd, lg[f], pal, false));
  out.right = [0,1].map(f => buildFrame(hd.side, bd, lg[f], pal, true));
  return out;
}
const SPRITES = {
  player:    makeCharacter('fez',   'suit',  {H:'#c0392b',h:C.gold,K:'#2e1f14',S:'#f0c8a0',E:C.black,T:'#f5eedd',t:C.black,B:'#26202e',F:C.black}),
  bartender: makeCharacter('fez',   'suit',  {H:'#c0392b',h:C.gold,K:'#14100d',S:'#e3b184',E:C.black,T:'#fbf7ec',t:'#a32638',B:C.black,F:'#0e0b09'}),
  crapsDealer:makeCharacter('nemes','suit',  {H:'#2f7f96',h:C.gold,S:'#e3b184',E:C.black,T:'#7e2433',t:C.gold,B:C.black,F:'#0e0b09'}),
  bjDealer:  makeCharacter('nemes', 'suit',  {H:'#345b9e',h:C.gold,S:'#caa27a',E:C.black,T:'#1f6b46',t:C.gold,B:C.black,F:'#0e0b09'}),
  guestF:    makeCharacter('bob',   'dress', {K:'#171114',h:'#e05a70',S:'#f0c8a0',E:C.black,T:'#b02a3c',B:'#b02a3c',F:C.gold}),
  guestM:    makeCharacter('fez',   'suit',  {H:'#171114',h:'#171114',K:'#171114',S:'#e9bd93',E:C.black,T:'#22242b',t:'#fbf7ec',B:'#171114',F:'#0e0b09'}),
  /* remote player variants (picked by their sprite index 0-2) */
  remote0:   makeCharacter('fez',   'suit',  {H:'#171114',h:'#171114',K:'#171114',S:'#e9bd93',E:C.black,T:'#22242b',t:'#fbf7ec',B:'#171114',F:'#0e0b09'}),
  remote1:   makeCharacter('bob',   'dress', {K:'#171114',h:'#e05a70',S:'#f0c8a0',E:C.black,T:'#b02a3c',B:'#b02a3c',F:C.gold}),
  remote2:   makeCharacter('fez',   'suit',  {H:'#2f7f96',h:C.gold,K:'#14100d',S:'#e3b184',E:C.black,T:'#38626e',t:C.gold,B:'#1c2b30',F:'#0e0b09'})
};
const REMOTE_SPRITES = ['remote0','remote1','remote2'];

/* ============================ map (floor) ============================ */
const BAR = { c0:4, c1:10, row:3 };
const CRAPS_T = { c0:2, c1:5, r0:8, r1:9 };
const BJ_T = { c0:9, c1:12, r0:8, r1:9 };
const PALMS = [[1,4],[13,4],[1,12],[13,12]];
const DOOR = { c:7, r:14 };
const RUG = { c0:5, c1:9, r0:5, r1:12 };

const solid = new Set();
const key = (c,r) => c + ',' + r;
for (let c = 0; c < COLS; c++) { solid.add(key(c,0)); solid.add(key(c,1)); solid.add(key(c,14)); }
for (let r = 0; r < ROWS; r++) { solid.add(key(0,r)); solid.add(key(14,r)); }
for (let c = BAR.c0; c <= BAR.c1; c++) solid.add(key(c, BAR.row));
for (let c = CRAPS_T.c0; c <= CRAPS_T.c1; c++) for (let r = CRAPS_T.r0; r <= CRAPS_T.r1; r++) solid.add(key(c,r));
for (let c = BJ_T.c0; c <= BJ_T.c1; c++) for (let r = BJ_T.r0; r <= BJ_T.r1; r++) solid.add(key(c,r));
PALMS.forEach(([c,r]) => solid.add(key(c,r)));
solid.add(key(7,2));
solid.add(key(3,7));
solid.add(key(11,7));

const talkMap = {};
for (let c = BAR.c0; c <= BAR.c1; c++) talkMap[key(c, BAR.row)] = 'bartender';
talkMap[key(7,2)] = 'bartender';
for (let c = CRAPS_T.c0; c <= CRAPS_T.c1; c++) for (let r = CRAPS_T.r0; r <= CRAPS_T.r1; r++) talkMap[key(c,r)] = 'craps';
talkMap[key(3,7)] = 'craps';
for (let c = BJ_T.c0; c <= BJ_T.c1; c++) for (let r = BJ_T.r0; r <= BJ_T.r1; r++) talkMap[key(c,r)] = 'blackjack';
talkMap[key(11,7)] = 'blackjack';
talkMap[key(DOOR.c, DOOR.r)] = 'door';

/* ============================ chips ============================ */
let chips = parseInt(localStorage.getItem('clubnile_chips') || '500', 10);
function setChips(v) {
  chips = Math.max(0, v);
  localStorage.setItem('clubnile_chips', String(chips));
}
/* ── stake journal (anti-scum failsafe) ──────────────────────────────
   Every hand in flight is journaled with enough state to SETTLE it, not
   refund it — quitting, reloading or crashing mid-hand can never dodge
   a loss:
   · blackjack: you stand on the cards you had; the dealer plays out
   · craps: place/hardways come down (as allowed at a real table), but a
     pass bet with the point ON is a contract bet and rides to resolution */
function journal(obj) {
  if (obj) localStorage.setItem('clubnile_pending2', JSON.stringify(obj));
  else localStorage.removeItem('clubnile_pending2');
}
function simulatePassBet(point) {
  for (;;) {
    const sum = (1 + Math.floor(Math.random() * 6)) + (1 + Math.floor(Math.random() * 6));
    if (sum === point) return true;
    if (sum === 7) return false;
  }
}
const bootNotes = [];
(function settleOrphan() {
  /* legacy numeric journal (pre-settlement builds): plain refund once */
  const legacy = parseInt(localStorage.getItem('clubnile_pending') || '0', 10);
  if (legacy > 0) { setChips(chips + legacy); bootNotes.push('Interrupted game — ' + legacy + ' chips returned'); }
  localStorage.removeItem('clubnile_pending');
  let j = null;
  try { j = JSON.parse(localStorage.getItem('clubnile_pending2') || 'null'); } catch (e) {}
  localStorage.removeItem('clubnile_pending2');
  if (!j) return;
  if (j.g === 'bj') {
    const bet = Math.max(0, Math.floor(j.bet || 0));
    if (!bet) return;
    const deck = (Array.isArray(j.deck) && j.deck.length >= 10) ? j.deck : newDeck();
    const hand = Array.isArray(j.hand) ? j.hand : [];
    const dealer = Array.isArray(j.dealer) ? j.dealer : [];
    while (hand.length < 2) hand.push(deck.pop());
    while (dealer.length < 2) dealer.push(deck.pop());
    while (handValue(dealer) < 17) dealer.push(deck.pop());
    const pv = handValue(hand), dv = handValue(dealer);
    let payout = 0, msg;
    if (pv > 21) msg = 'bust, -' + bet;
    else if (dv > 21 || pv > dv) { payout = bet * 2; msg = 'you won! +' + bet; }
    else if (pv === dv) { payout = bet; msg = 'push'; }
    else msg = 'dealer ' + dv + ' beats ' + pv + ', -' + bet;
    if (payout) setChips(chips + payout);
    bootNotes.push('Interrupted blackjack hand settled: ' + msg);
  } else if (j.g === 'cr') {
    const bets = j.bets || {};
    const point = Math.floor(j.point || 0);
    let refund = 0;
    for (const k in bets) if (k !== 'pass') refund += Math.max(0, Math.floor(bets[k] || 0));
    const pass = Math.max(0, Math.floor(bets.pass || 0));
    if (!point) refund += pass;
    if (refund > 0) { setChips(chips + refund); bootNotes.push('Craps bets taken down: ' + refund + ' chips returned'); }
    if (point && pass > 0) {
      if (simulatePassBet(point)) { setChips(chips + pass * 2); bootNotes.push('Your pass bet rode on: point ' + point + ' hit! +' + pass); }
      else bootNotes.push('Your pass bet rode on: seven out, -' + pass);
    }
  }
})();

/* ?ws=ws://localhost:PORT override for local testing */
const WS_BASE = new URLSearchParams(location.search).get('ws') ||
                'wss://last-chad-runner.severin20.workers.dev';

function makeRoom(room, handlers) {
  const obj = {
    status: 'connecting', closed: false, ws: null,
    send(m) { if (this.ws && this.ws.readyState === 1) this.ws.send(JSON.stringify(m)); },
    close() { this.closed = true; try { this.ws && this.ws.close(); } catch (e) {} }
  };
  let delay = 1000;
  function connect() {
    if (obj.closed) return;
    let ws;
    try {
      ws = new WebSocket(WS_BASE + '/clubnile/ws?room=' + encodeURIComponent(room) +
        '&name=' + encodeURIComponent(myName) + '&sprite=' + mySprite);
    } catch (e) { obj.status = 'off'; retry(); return; }
    obj.ws = ws;
    ws.onopen = () => { obj.status = 'on'; delay = 1000; };
    ws.onmessage = e => {
      let m; try { m = JSON.parse(e.data); } catch (err) { return; }
      const h = handlers[m.t];
      if (h) h(m);
    };
    ws.onclose = () => { obj.status = 'off'; retry(); };
    ws.onerror = () => {};
  }
  function retry() {
    if (obj.closed) return;
    setTimeout(connect, delay);
    delay = Math.min(delay * 2, 15000);
  }
  connect();
  return obj;
}

/* ============================ floor background ============================ */
const bg = document.createElement('canvas');
bg.width = W; bg.height = H;
(function paintBackground() {
  const g = bg.getContext('2d');
  /* ── sandstone floor: 3-tone checker + dithered grain + inlays ── */
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const t = (c + r) % 2 ? C.floorA : C.floorB;
      g.fillStyle = t;
      g.fillRect(c*TS, r*TS, TS, TS);
      /* per-tile bevel: light top edge, dark bottom edge */
      g.fillStyle = 'rgba(255,246,220,0.35)';
      g.fillRect(c*TS, r*TS, TS, 1);
      g.fillStyle = 'rgba(140,110,70,0.25)';
      g.fillRect(c*TS, r*TS + TS - 1, TS, 1);
      /* grain dither */
      for (let k = 0; k < 4; k++) {
        const hx = h2(c * 4 + k, r), px = hx % TS, py = h2(r * 4 + k, c) % TS;
        g.fillStyle = hx % 2 ? C.floorC : C.floorDot;
        g.fillRect(c*TS + px, r*TS + py, 1, 1);
      }
      /* occasional scarab inlay tile */
      if (h2(c, r) % 19 === 3 && r > 2 && r < 13) {
        const ix = c*TS + 5, iy = r*TS + 5;
        g.fillStyle = C.floorDot;
        g.fillRect(ix + 2, iy, 2, 1); g.fillRect(ix + 1, iy + 1, 4, 2);
        g.fillRect(ix, iy + 2, 1, 1); g.fillRect(ix + 5, iy + 2, 1, 1);
        g.fillRect(ix + 2, iy + 3, 2, 2);
        g.fillStyle = 'rgba(255,246,220,0.5)';
        g.fillRect(ix + 2, iy + 1, 1, 1);
      }
    }
  }
  /* ── rug: tone-ramped weave, double gold border, fringe, medallion ── */
  const rx = RUG.c0*TS, ry = RUG.r0*TS, rw = (RUG.c1-RUG.c0+1)*TS, rh = (RUG.r1-RUG.r0+1)*TS;
  for (let y = 0; y < rh; y++) {
    const band = y < 3 ? C.rugLight : (y > rh - 4 ? C.rugDark : C.rug);
    g.fillStyle = band;
    g.fillRect(rx, ry + y, rw, 1);
  }
  /* weave dither */
  for (let y = 2; y < rh - 2; y += 2) for (let x = (y % 4) ? 2 : 4; x < rw - 2; x += 4) {
    g.fillStyle = (h2(x, y) % 2) ? C.rugDark : C.rugLight;
    g.fillRect(rx + x, ry + y, 1, 1);
  }
  g.strokeStyle = C.rugGold; g.lineWidth = 1;
  g.strokeRect(rx + 1.5, ry + 1.5, rw - 3, rh - 3);
  g.strokeStyle = 'rgba(135,24,43,0.9)';
  g.strokeRect(rx + 3.5, ry + 3.5, rw - 7, rh - 7);
  /* fringe ticks top & bottom */
  g.fillStyle = C.rugGold;
  for (let x = 2; x < rw - 2; x += 4) {
    g.fillRect(rx + x, ry - 1, 1, 1);
    g.fillRect(rx + x + 1, ry + rh, 1, 1);
  }
  /* corner ankh accents + centre medallion */
  const med = (cx, cy, big) => {
    g.fillStyle = C.rugGold;
    g.fillRect(cx - 1, cy - (big ? 6 : 3), 2, big ? 12 : 6);
    g.fillRect(cx - (big ? 6 : 3), cy - 1, big ? 12 : 6, 2);
    g.fillStyle = C.rugLight;
    g.fillRect(cx - 1, cy - 1, 2, 2);
    if (big) {
      g.strokeStyle = C.rugGold;
      g.beginPath(); g.arc(cx, cy, 9, 0, Math.PI * 2); g.stroke();
      g.strokeStyle = 'rgba(232,188,99,0.45)';
      g.beginPath(); g.arc(cx, cy, 13, 0, Math.PI * 2); g.stroke();
    }
  };
  med(rx + rw/2, ry + rh/2, true);

function drawDie(g, x, y, val, size) {
  const s = size || 12;
  g.fillStyle = '#8f8878'; g.fillRect(x, y, s, s);
  g.fillStyle = C.white; g.fillRect(x+1, y+1, s-2, s-2);

  g.fillStyle = '#d9d2be'; g.fillRect(x+1, y+s-2, s-2, 1); g.fillRect(x+s-2, y+1, 1, s-2);
  g.fillStyle = C.black;
  const c = x + s/2 - 1, m = y + s/2 - 1, l = x + 2, r = x + s - 4, t = y + 2, b = y + s - 4;
  const pips = {
    1:[[c,m]], 2:[[l,t],[r,b]], 3:[[l,t],[c,m],[r,b]],
    4:[[l,t],[r,t],[l,b],[r,b]], 5:[[l,t],[r,t],[c,m],[l,b],[r,b]],
    6:[[l,t],[r,t],[l,m],[r,m],[l,b],[r,b]]
  };
  for (const [px,py] of pips[val]) g.fillRect(px, py, 2, 2);
}
function newDeck() {
  const d = [];
  for (let s = 0; s < 4; s++) for (let r = 1; r <= 13; r++) d.push({ r, s });
  for (let i = d.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [d[i], d[j]] = [d[j], d[i]];
  }
  return d;
}
function handValue(hand) {
  let v = 0, aces = 0;
  for (const c of hand) {
    if (c.r === 1) { aces++; v += 11; }
    else v += Math.min(c.r, 10);
  }
  while (v > 21 && aces > 0) { v -= 10; aces--; }
  return v;
}

/* ============================ table room backdrop ============================ */
function paintTableRoom(g) {
  /* long plank floor in low light */
  for (let y = 0; y < H; y += 8) {
    const row = y / 8;
    g.fillStyle = (row % 2) ? '#3a2a20' : '#3e2d22';
    g.fillRect(0, y, W, 8);
    g.fillStyle = 'rgba(24,15,10,0.7)';
    g.fillRect(0, y + 7, W, 1);                       // board seam
    g.fillStyle = 'rgba(70,45,28,0.9)';
    for (let x = (row * 53) % 48; x < W; x += 48) g.fillRect(x, y, 1, 7);
    g.fillStyle = 'rgba(200,150,100,0.06)';
    g.fillRect(0, y, W, 1);
    /* sparse grain flecks */
    g.fillStyle = 'rgba(30,18,12,0.5)';
    for (let k = 0; k < 5; k++) g.fillRect(h2(row, k * 7) * 2.4 % W, y + 2 + (h2(k, row) % 4), 2, 1);
  }
  /* warm light pool under the table */
  const pool = g.createRadialGradient(120, 105, 20, 120, 105, 130);
  pool.addColorStop(0, 'rgba(255,190,100,0.14)');
  pool.addColorStop(1, 'rgba(255,190,100,0)');
  g.fillStyle = pool;
  g.fillRect(0, 0, W, H);
  /* bevelled sandstone wall band */
  g.fillStyle = C.wall; g.fillRect(0, 0, W, 24);
  for (let row = 0; row < 3; row++) {
    const by = row * 8, off = (row % 2) ? 8 : 0;
    for (let x = -8; x < W; x += 16) {
      g.fillStyle = C.wallLight; g.fillRect(x + off, by, 16, 1);
      g.fillStyle = C.wallDark; g.fillRect(x + off, by + 7, 16, 1);
      g.fillStyle = C.wallLine; g.fillRect(x + off + 15, by, 1, 8);
    }
  }
  /* embossed ankhs */
  for (let x = 10; x < W - 8; x += 30) {
    g.fillStyle = 'rgba(90,64,30,0.8)';
    g.fillRect(x+3,5,1,2); g.fillRect(x+2,7,3,1); g.fillRect(x+3,8,1,4); g.fillRect(x+1,12,5,1);
    g.fillStyle = C.wallGold;
    g.fillRect(x+2,4,1,2); g.fillRect(x+1,6,3,1); g.fillRect(x+2,7,1,4); g.fillRect(x,11,5,1);
  }
  /* gilded cornice + cast shadow */
  g.fillStyle = C.goldHi;       g.fillRect(0, 20, W, 1);
  g.fillStyle = C.wallGold;     g.fillRect(0, 21, W, 2);
  g.fillStyle = C.wallGoldDark; g.fillRect(0, 23, W, 1);
  g.fillStyle = 'rgba(0,0,0,0.3)';
  g.fillRect(0, 24, W, 3);
}

/* ============================ shared table modal (emoji / tip) ============================ */
const TIP_AMTS = [5, 25, 100];
let modal = null;   // {type:'emoji', idx} | {type:'tip', tIdx, aIdx}

function openTipModal() {
  if (!social.roster.length) { flash('NO PLAYERS TO TIP'); return; }
  modal = { type: 'tip', tIdx: 0, aIdx: 0 };
}
function modalUpdate() {
  if (!modal) return false;
  if (modal.type === 'emoji') {
    if (tapLeft)  modal.idx = (modal.idx + EMOJIS.length - 1) % EMOJIS.length;
    if (tapRight) modal.idx = (modal.idx + 1) % EMOJIS.length;
    if (aQueued) { aQueued = false; sendEmoji(EMOJIS[modal.idx]); modal = null; }
    if (bQueued) { bQueued = false; modal = null; }
  } else if (modal.type === 'tip') {
    if (!social.roster.length) { modal = null; return true; }
    modal.tIdx = Math.min(modal.tIdx, social.roster.length - 1);

function drawPopups(seatPos) {
  for (let i = popups.length - 1; i >= 0; i--) {
    const p = popups[i];
    p.t++;
    if (p.t > p.life) { popups.splice(i, 1); continue; }
    const pos = seatPos(p.target);
    if (!pos) continue;
    const fade = p.t > p.life - 20 ? (p.life - p.t) / 20 : 1;
    ctx.globalAlpha = fade;
    if (p.kind === 'emoji') {
      const rise = Math.min(p.t / 3, 8);
      ctx.font = '12px sans-serif';
      ctx.fillText(p.str, pos.x - 6, pos.y - 30 - rise);
      ctx.font = FONT;

      ctx.fillStyle = C.gold;
      ctx.fillText(p.str, pos.x - p.str.length * 4, pos.y - 28 - rise);

function drawBubble(cx, bottomY, text) {
  ctx.font = FONT;
  let lines = wrapText(text, 84);
  if (lines.length > 2) { lines = lines.slice(0, 2); lines[1] += '…'; }
  const w = Math.min(92, Math.max(...lines.map(l => ctx.measureText(l).width)) + 8);
  const h = lines.length * 10 + 5;
  let x = Math.round(cx - w / 2);
  x = Math.max(2, Math.min(W - w - 2, x));
  const y = bottomY - h - 5;
  ctx.fillStyle = 'rgba(247,243,232,0.96)';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = C.black; ctx.lineWidth = 1;
  ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  ctx.fillStyle = 'rgba(247,243,232,0.96)';
  ctx.fillRect(cx - 2, y + h, 4, 3);
  ctx.fillStyle = C.black;
  ctx.textBaseline = 'top';
  for (let i = 0; i < lines.length; i++) ctx.fillText(lines[i], x + 4, y + 3 + i * 10);
}

function bjUpdate() {

  /* idle kick (only between hands — live hands run on the decision clock) */
  if (aQueued || bQueued || tapUp || tapDown || tapLeft || tapRight) lastActMs = Date.now();
  else if ((bj.state === 'bet' || bj.state === 'result') && Date.now() - lastActMs > IDLE_KICK_MS) {
    pushChat('', 'Idle at blackjack — seat freed', true);
    startTransition(() => leaveTable('blackjack'));
    return;
  }
  if (bj.state === 'bet') {
    if (chips < BETS[0]) {
      if (bQueued) { bQueued = false; startTransition(() => leaveTable('blackjack')); }
      aQueued = false;
      return;
    }
    if (tapUp)   { do { bj.betIdx = (bj.betIdx + 1) % BETS.length; } while (BETS[bj.betIdx] > chips); }
    if (tapDown) { do { bj.betIdx = (bj.betIdx + BETS.length - 1) % BETS.length; } while (BETS[bj.betIdx] > chips); }
    if (BETS[bj.betIdx] > chips) bj.betIdx = 0;
    const pick = bjMenu(['DEAL','EMOJI','TIP'], 'actIdx');
    if (aQueued) {
      aQueued = false;

      else if (pick === 'EMOJI') modal = { type:'emoji', idx:0 };
      else openTipModal();
    }
    if (bQueued) { bQueued = false; startTransition(() => leaveTable('blackjack')); }
  }
  else if (bj.state === 'dealing') {
    aQueued = bQueued = false;
    if (++bj.timer >= 16) {
      bj.timer = 0;
      const next = bj.dealQ.shift();
      if (next === 'dealer') bj.dealer.push(bj.deck.pop());
      else bj.hand.push(bj.deck.pop());
      bjJournal();
      if (!bj.dealQ.length) {
        if (handValue(bj.hand) === 21) { bj.state = 'dealerTurn'; bj.hole = false; bj.timer = 0; }
        else { bj.state = 'player'; bj.menuIdx = 0; bj.decideUntil = Date.now() + BJ_DECIDE_MS; }
      }
    }
  }
  else if (bj.state === 'player') {
    /* action clock: decide in time or the house stands you */
    if (Date.now() > bj.decideUntil) {
      flash('TIME · AUTO STAND');
      bj.state = 'dealerTurn'; bj.hole = false; bj.timer = 0;
      aQueued = bQueued = false;
      return;
    }
    const canDouble = bj.hand.length === 2 && chips >= bj.bet;
    const menu = canDouble ? ['HIT','STAND','DOUBLE'] : ['HIT','STAND'];
    const pick = bjMenu(menu, 'menuIdx');
    if (aQueued) {
      aQueued = false;
      if (pick === 'HIT') {
        bj.hand.push(bj.deck.pop());
        bj.decideUntil = Date.now() + BJ_DECIDE_MS;
        bjJournal();
        const v = handValue(bj.hand);
        if (v > 21) { bj.busted = true; bj.state = 'dealerTurn'; bj.hole = false; bj.timer = 0; }
        else if (v === 21) { bj.state = 'dealerTurn'; bj.hole = false; bj.timer = 0; }
      } else if (pick === 'STAND') {
        bj.state = 'dealerTurn'; bj.hole = false; bj.timer = 0;
      } else if (pick === 'DOUBLE') {
        setChips(chips - bj.bet); bj.bet *= 2;
        bj.hand.push(bj.deck.pop());
        bjJournal();
        if (handValue(bj.hand) > 21) bj.busted = true;
        bj.state = 'dealerTurn'; bj.hole = false; bj.timer = 0;
      }
    }
    bQueued = false;
  }
  else if (bj.state === 'dealerTurn') {
    aQueued = bQueued = false;
    if (++bj.timer >= 26) {
      bj.timer = 0;
      if (!bj.busted && handValue(bj.dealer) < 17) bj.dealer.push(bj.deck.pop());
      else {
        const dv = handValue(bj.dealer), pv = handValue(bj.hand);
        const natural = pv === 21 && bj.hand.length === 2;
        let payout = 0;
        if (bj.busted) { bj.result = 'BUST  -' + bj.bet; }
        else if (natural && !(dv === 21 && bj.dealer.length === 2)) {
          payout = bj.bet + Math.floor(bj.bet * 1.5);
          bj.result = 'BLACKJACK!  +' + Math.floor(bj.bet * 1.5);

        else if (dv > 21 || pv > dv) { payout = bj.bet * 2; bj.result = 'YOU WIN  +' + bj.bet; }
        else if (pv === dv) { payout = bj.bet; bj.result = 'PUSH'; }
        else { bj.result = 'DEALER WINS  -' + bj.bet; }
        if (payout) setChips(chips + payout);   // payout mint (≙ claimWinnings)
        journal(null);                          // stake settled — clear the journal
        bj.flash = payout > bj.bet ? 40 : 0;
        bj.state = 'result'; bj.actIdx = 0;
        lastActMs = Date.now();
      }
    }
  }
  else if (bj.state === 'result') {
    if (bj.flash > 0) bj.flash--;
    const pick = bjMenu(['AGAIN','EMOJI','TIP'], 'actIdx');
    if (aQueued) {
      aQueued = false;
      if (pick === 'AGAIN') bj.state = 'bet';
      else if (pick === 'EMOJI') modal = { type:'emoji', idx:0 };
      else openTipModal();
    }
    if (bQueued) { bQueued = false; startTransition(() => leaveTable('blackjack')); }
  }
}

function crCashOut(reason) {
  let refund = 0;
  for (const k in cr.bets) if (k !== 'pass') refund += cr.bets[k];
  if (cr.point === 0) refund += cr.bets.pass;
  const pass = cr.point !== 0 ? cr.bets.pass : 0;
  const point = cr.point;
  cr.bets = crBetKeys();
  if (refund > 0) setChips(chips + refund);
  if (pass > 0) {
    if (simulatePassBet(point)) {
      setChips(chips + pass * 2);
      pushChat('', reason + ' — pass bet rode on: point ' + point + ' hit! +' + pass, true);
    } else {
      pushChat('', reason + ' — pass bet rode on: seven out, -' + pass, true);
    }
  }
  crJournal();
}
/* sync to the live table clock (fresh join or reconnect) */
function crAdoptNet(g) {
  if (crTotalBets() > 0) {
    crCashOut('Table resync');
    flash('TABLE SYNC · BETS SETTLED');
  }
  cr.point = g.point || 0;
  cr.outcome = [];
  cr.mode = 'board';
  cr.net = { active: g.phase !== 'idle', phase: g.phase, until: Date.now() + (g.ms || 0), shooter: g.shooter };
}
/* connection lost mid-game: KEEP the point and every bet and continue
   solo — nothing refunds, so pulling the plug can't dodge a hand */
function crGoSolo() {
  cr.net = { active:false, phase:'', until:0, shooter:null };
  cr.postRoll = null; cr.rollLand = null;
  cr.outcome = [];
  if (cr.mode !== 'rolling') cr.mode = 'board';
  flash('CONNECTION LOST · PLAY ON SOLO');
}
function crShooterName() {
  if (cr.net.shooter === social.youId) return 'YOU';
  const p = social.roster.find(r => r.id === cr.net.shooter);
  return p ? p.name.slice(0, 8) : '...';
}
function crTotalBets() {
  return Object.values(cr.bets).reduce((a, b) => a + b, 0);
}
function crRows() {
  return [PLACE_NUMS.length, HARD_NUMS.length, 1, CR_MENU.length];
}
function crSpotKey() {
  const { row, col } = cr.cur;
  if (row === 0) return 'p' + PLACE_NUMS[col];
  if (row === 1) return 'h' + HARD_NUMS[col];
  if (row === 2) return 'pass';
  return null;
}
function crResolve() {
  const [d1, d2] = cr.dice;
  const sum = d1 + d2, hard = d1 === d2;
  const out = [];
  let winTot = 0, seven = false;
  if (cr.point === 0) {
    /* come out — place & hardway bets are OFF */
    if (sum === 7 || sum === 11) {
      if (cr.bets.pass) { const w = cr.bets.pass; setChips(chips + w * 2); winTot += w; out.push(sum + '! PASS WINS +' + w); cr.bets.pass = 0; }
      else out.push(sum + ' ON THE COME OUT');
    } else if (sum === 2 || sum === 3 || sum === 12) {
      if (cr.bets.pass) { out.push('CRAPS ' + sum + ' · PASS DOWN -' + cr.bets.pass); cr.bets.pass = 0; }
      else out.push('CRAPS ' + sum);
    } else {
      cr.point = sum;
      out.push('POINT IS ' + sum);
    }
  } else {
    if (sum === 7) {
      seven = true;
      let lost = cr.bets.pass;
      PLACE_NUMS.forEach(n => lost += cr.bets['p' + n]);
      HARD_NUMS.forEach(n => lost += cr.bets['h' + n]);
      out.push('SEVEN OUT');
      if (lost) out.push('-' + lost + ' CHIPS DOWN');
      cr.bets = crBetKeys();
      cr.point = 0;
    } else {
      if (sum === cr.point) {
        out.push('POINT ' + sum + ' HIT!');
        if (cr.bets.pass) { const w = cr.bets.pass; setChips(chips + w * 2); winTot += w; cr.bets.pass = 0; }
        cr.point = 0;
      }
      if (cr.bets['p' + sum]) {
        const [a, b] = PLACE_PAY[sum];
        const w = Math.floor(cr.bets['p' + sum] * a / b);
        setChips(chips + w); winTot += w;
        out.push('PLACE ' + sum + ' PAYS +' + w);
      }
      if (HARD_NUMS.includes(sum) && cr.bets['h' + sum]) {
        if (hard) {
          const w = cr.bets['h' + sum] * HARD_PAY[sum];
          setChips(chips + w); winTot += w;
          out.push('HARD ' + sum + '! +' + w);
        } else {
          out.push('EASY ' + sum + ' · HARD ' + sum + ' DOWN');
          cr.bets['h' + sum] = 0;
        }
      }
      if (!out.length) out.push(sum + ' · NO ACTION');
    }
  }
  cr.flash = winTot > 0 ? 40 : 0;
  cr.outcome = out.slice(0, 2);
  crJournal();
  if (cr.postRoll) {
    /* shared roll: server state is authoritative; board stays open and
       the outcome text clears when the next betting phase arrives */
    cr.point = cr.postRoll.point;
    cr.net.shooter = cr.postRoll.shooter;
    cr.postRoll = null;
    cr.mode = 'board';
  } else {
    cr.outT = seven || winTot > 0 ? 150 : 100;
    cr.mode = 'outcome';
  }
}
function crUpdate() {
  /* failsafe: dropped connection mid-game → refund and continue solo */
  if (cr.net.active && !(social.table && social.table.status === 'on')) crGoSolo();
  /* dice animation always progresses (server rolls arrive any time) */
  if (cr.mode === 'rolling') {
    aQueued = bQueued = false;
    if (cr.rollT % 4 === 0) {
      cr.dice = [1 + Math.floor(Math.random() * 6), 1 + Math.floor(Math.random() * 6)];
    }
    if (--cr.rollT <= 0) {
      if (cr.rollLand) { cr.dice = cr.rollLand; cr.rollLand = null; }
      crResolve();
    }
    return;
  }
  if (modalUpdate()) { lastActMs = Date.now(); return; }
  if (cr.mode === 'outcome') {          /* solo pause between rolls */
    if (cr.flash > 0) cr.flash--;
    if (--cr.outT <= 0 || aQueued) { aQueued = false; lastActMs = Date.now(); cr.mode = 'board'; }
    bQueued = false;
    return;
  }
  if (cr.flash > 0) cr.flash--;
  /* idle kick: frees the seat so the table never waits on a ghost */
  if (aQueued || bQueued || tapUp || tapDown || tapLeft || tapRight) lastActMs = Date.now();
  else if (Date.now() - lastActMs > IDLE_KICK_MS) {
    crCashOut('Idle at craps');
    pushChat('', 'Idle at craps — seat freed', true);
    startTransition(() => leaveTable('craps'));
    return;
  }
  /* board mode: cursor betting */
  const rows = crRows();
  if (tapUp)   { cr.cur.row = (cr.cur.row + 3) % 4; cr.cur.col = Math.min(cr.cur.col, rows[cr.cur.row] - 1); }
  if (tapDown) { cr.cur.row = (cr.cur.row + 1) % 4; cr.cur.col = Math.min(cr.cur.col, rows[cr.cur.row] - 1); }
  if (tapLeft)  cr.cur.col = (cr.cur.col + rows[cr.cur.row] - 1) % rows[cr.cur.row];
  if (tapRight) cr.cur.col = (cr.cur.col + 1) % rows[cr.cur.row];
  const unit = UNITS[cr.unitIdx];
  const spot = crSpotKey();
  const netOn = cr.net.active;
  const canBet = !netOn || cr.net.phase === 'betting' || cr.net.phase === 'outcome';
  if (aQueued) {
    aQueued = false;
    if (spot) {
      if (!canBet) flash('DICE ARE OUT · BETS CLOSED');
      else if (spot === 'pass' && cr.point !== 0) flash('PASS BETS: COME OUT ONLY');
      else if (chips < unit) flash('NOT ENOUGH CHIPS');
      else { cr.bets[spot] += unit; setChips(chips - unit); crJournal(); }
    } else {
      const item = CR_MENU[cr.cur.col];
      if (item === 'UNIT') cr.unitIdx = (cr.unitIdx + 1) % UNITS.length;
      else if (item === 'ROLL') {
        if (netOn) {
          if (cr.net.phase === 'action' && cr.net.shooter === social.youId) social.table.send({ t: 'roll' });
          else if (cr.net.phase === 'action') flash('WAITING ON THE SHOOTER');
          else flash('DICE ROLL ON THE TABLE CLOCK');
        } else {
          if (crTotalBets() === 0) flash('PLACE A BET FIRST');
          else { cr.mode = 'rolling'; cr.rollT = 34; }
        }
      }
      else if (item === 'EMOJI') modal = { type:'emoji', idx:0 };
      else if (item === 'TIP') openTipModal();
      else if (item === 'LEAVE') {
        crCashOut('Left the table');       // pass rides if the point is on
        startTransition(() => leaveTable('craps'));
      }
    }
  }
  if (bQueued) {
    bQueued = false;
    if (spot && cr.bets[spot] > 0) {
      if (!canBet) flash('DICE ARE OUT · BETS CLOSED');
      else if (spot === 'pass' && cr.point !== 0) flash('PASS RIDES UNTIL DECIDED');
      else {
        const take = Math.min(unit, cr.bets[spot]);
        cr.bets[spot] -= take;
        setChips(chips + take);
        crJournal();
      }
    }
  }
}
function crRender() {

  }

  const hop = (cr.flash > 0 && Math.floor(tick / 10) % 2) ? -1 : 0;

  /* shooter marker: a little die above whoever holds the dice */
  if (cr.net.active && cr.net.shooter) {
    const sp = seatPos(cr.net.shooter === social.youId ? 'you' : cr.net.shooter);
    if (sp) drawDie(ctx, sp.x + 7, sp.y - 24, 5, 8);

  const secs = Math.max(0, Math.ceil((cr.net.until - Date.now()) / 1000));

    /* solo pause between rolls */

    uiText(cr.outcome[0] || '', win ? C.gold : C.white, 190);
    if (cr.outcome[1]) uiText(cr.outcome[1], C.white, 206);
    uiText('A: CONTINUE', C.gold, 222);
  } else {
    let status;
    if (cr.net.active && cr.outcome.length) {
      /* shared roll result: alternate the outcome lines until next betting */
      status = cr.outcome[Math.floor(tick / 60) % cr.outcome.length];
    } else if (cr.net.active && cr.net.phase === 'betting') {
      status = 'BETS OPEN · ' + secs + 'S';
    } else if (cr.net.active && cr.net.phase === 'action') {

    } else {

function floorUpdate() {
  if (dlg.open) {
    dlg.chars += DLG_SPEED;
    if (aQueued) { aQueued = false; dialogSelect(); }
    if (bQueued) { bQueued = false; dlg.open = false; }
    return;
  }
  let dx = 0, dy = 0;
  if (input.left) { dx = -1; player.dir = 'left'; }
  else if (input.right) { dx = 1; player.dir = 'right'; }
  if (input.up) { dy = -1; if (!dx) player.dir = 'up'; }
  else if (input.down) { dy = 1; if (!dx) player.dir = 'down'; }
  player.moving = !!(dx || dy);
  if (player.moving) {
    moveEntity(player, dx, dy, WALK_SPEED);
    player.animT++;
    if (player.animT % 13 === 0) player.frame = 1 - player.frame;
  } else { player.frame = 0; }

  if (aQueued) {
    aQueued = false;
    const t = interactTarget();
    if (t) {
      if (t.guest) {
        t.guest.dir = player.x < t.guest.x ? 'left' : 'right';
        t.guest.moveT = 120;
        t.guest.dx = 0; t.guest.dy = 0;
      }
      openDialog(t.id);
    }
  }
  if (bQueued) bQueued = false;

  for (const g of guests) {
    g.moveT--;
    if (g.moveT <= 0) {
      g.moveT = 50 + Math.floor(Math.random() * 90);
      const roll = Math.random();
      if (roll < 0.4) { g.dx = 0; g.dy = 0; }
      else {
        const dirs = [[0,-1,'up'],[0,1,'down'],[-1,0,'left'],[1,0,'right']];
        const d = dirs[Math.floor(Math.random() * 4)];
        g.dx = d[0]; g.dy = d[1]; g.dir = d[2];
      }
    }
    if (g.dx || g.dy) {
      const moved = moveEntity(g, g.dx, g.dy, GUEST_SPEED);
      if (!moved) { g.dx = 0; g.dy = 0; }
      else {
        g.animT++;
        if (g.animT % 18 === 0) g.frame = 1 - g.frame;
      }
    } else g.frame = 0;
    g.x = Math.max(1.5*TS, Math.min(13.5*TS - 1, g.x));
    g.y = Math.max(4.5*TS, Math.min(13.5*TS - 1, g.y));
  }
  for (const p of confetti) {
    p.y += p.v; p.sway += 0.02;
    p.x += Math.sin(p.sway) * 0.1;
    if (p.y > 236) { p.y = 34; p.x = 16 + Math.random() * 208; }
  }
}

  g.fillRect(bx + 1, by + bh - 3, 2, 2); g.fillRect(bx + bw - 3, by + bh - 3, 2, 2);
  g.font = FONT;
  g.textBaseline = 'top';
  g.fillStyle = C.gold;
  g.fillText(dlg.name, bx + 8, by + 7);
  const full = dlg.pages[dlg.page];
  const shown = full.slice(0, Math.floor(dlg.chars));
  const lines = wrapText(shown, bw - 20);
  g.fillStyle = C.white;
  for (let i = 0; i < Math.min(lines.length, 3); i++) {
    g.fillText(lines[i], bx + 8, by + 22 + i * 13);
  }
  if (dlg.chars >= full.length && Math.floor(tick / 20) % 2) {
    g.fillStyle = C.gold;
    g.fillText('▼', bx + bw - 16, by + bh - 13);
  }
}
function drawTitle(g) {
  g.fillStyle = 'rgba(10,7,16,' + (0.85 * titleAlpha) + ')';
  g.fillRect(0, 0, W, H);
  g.globalAlpha = titleAlpha;
  g.textAlign = 'center'; g.textBaseline = 'middle';
  /* art-deco sunburst behind the title */
  g.strokeStyle = 'rgba(217,174,95,0.28)'; g.lineWidth = 1;
  for (let i = -4; i <= 4; i++) {
    g.beginPath();
    g.moveTo(W/2, 100);
    g.lineTo(W/2 + i * 26, 20);
    g.stroke();
  }
  g.font = '16px "Press Start 2P", monospace';
  g.fillStyle = '#5e2216';                       // deep drop shadow
  g.fillText('CLUB', W/2 + 1, 89.5);
  g.fillText('NILE', W/2 + 1, 111.5);
  const tGrad = g.createLinearGradient(0, 78, 0, 120);
  tGrad.addColorStop(0, C.goldHi);
  tGrad.addColorStop(0.5, C.gold);
  tGrad.addColorStop(1, C.goldDark);
  g.fillStyle = tGrad;
  g.fillText('CLUB', W/2, 88);
  g.fillText('NILE', W/2, 110);
  /* deco divider */
  g.fillStyle = C.rugGold;
  g.fillRect(W/2 - 40, 124, 80, 1);
  g.fillStyle = C.goldHi;
  g.fillRect(W/2 - 2, 122, 4, 4);
  g.font = FONT;
  g.fillStyle = C.white;
  g.fillText('EST. 1926', W/2, 136);
  g.fillStyle = C.rugGold;
  g.fillText('MEMBERS ONLY', W/2, 150);
  if (Math.floor(tick / 30) % 2) {
    g.fillStyle = C.white;
    g.fillText('PRESS A', W/2, 190);
  }
  g.globalAlpha = 1;
  g.textAlign = 'left';
  g.textBaseline = 'top';
}
function floorRender() {
  ctx.drawImage(bg, 0, 0);
  drawFlame(ctx, 3*TS + 4, 18);
  drawFlame(ctx, 11*TS + 4, 18);
  const items = [];
  items.push({ y: BAR.row*TS + 16, draw: g => g.drawImage(barCanvas, BAR.c0*TS, BAR.row*TS - 6) });
  items.push({ y: (CRAPS_T.r1+1)*TS, draw: g => g.drawImage(crapsCanvas, CRAPS_T.c0*TS, CRAPS_T.r0*TS) });
  items.push({ y: (BJ_T.r1+1)*TS,    draw: g => g.drawImage(bjCanvas, BJ_T.c0*TS, BJ_T.r0*TS) });
  PALMS.forEach(([c, r]) => items.push({ y: (r+1)*TS, draw: g => g.drawImage(palmCanvas, c*TS, r*TS - 9) }));
  npcs.forEach(n => items.push({ y: n.y, draw: g => drawEntity(g, { ...n, staticNPC: true }, tick + n.x) }));
  guests.forEach(gu => items.push({ y: gu.y, draw: g => drawEntity(g, gu, 0) }));
  items.push({ y: player.y, draw: g => drawEntity(g, { ...player, sprite: 'player' }, 0) });
  items.sort((a, b) => a.y - b.y);
  for (const it of items) it.draw(ctx);
  for (const p of confetti) {
    ctx.fillStyle = p.col;
    ctx.globalAlpha = 0.7;
    ctx.fillRect(Math.round(p.x), Math.round(p.y), 1, 2);
  }
  ctx.globalAlpha = 1;
  if (started && !dlg.open) {
    const t = interactTarget();
    if (t) {
      const bounce = Math.floor(tick / 20) % 2;
      ctx.font = FONT;
      ctx.fillStyle = C.gold;
      ctx.fillText('!', Math.round(player.x) - 2, Math.round(player.y) - 28 - bounce);
    }
  }
  /* popups over your head on the floor (chat bubbles, emoji) */
  drawPopups(target => target === 'you' ? { x: player.x, y: player.y - 6 } : null);
  const vg = ctx.createRadialGradient(W/2, H/2 - 10, 60, W/2, H/2, 190);
  vg.addColorStop(0, 'rgba(255,190,90,0.05)');
  vg.addColorStop(1, 'rgba(8,5,14,0.42)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
  if (dlg.open) drawDialog(ctx);
  if (titleAlpha > 0) drawTitle(ctx);
}

/* ============================ main loop ============================ */
function update() {
  tick++;
  readTaps();
  if (started && titleAlpha > 0) titleAlpha = Math.max(0, titleAlpha - 0.03);
  if (!started && (input.up || input.down || input.left || input.right || aQueued)) {
    started = true; aQueued = false;
  }
  if (trans.active) {
    trans.t++;
    if (trans.t === 15 && trans.mid) { trans.mid(); trans.mid = null; }
    if (trans.t >= 30) trans.active = false;
    aQueued = bQueued = false;
    return;
  }
  if (!started) { aQueued = bQueued = false; return; }
  if (chatOpen()) { aQueued = bQueued = false; return; }   // chat panel has focus
  if (scene === 'floor') floorUpdate();
  else if (scene === 'blackjack') bjUpdate();
  else if (scene === 'craps') crUpdate();
}
function render() {
  if (scene === 'floor') floorRender();
  else if (scene === 'blackjack') bjRender();
  else if (scene === 'craps') crRender();
  if (scene !== 'floor') {
    const vg = ctx.createRadialGradient(W/2, 110, 60, W/2, 110, 200);
    vg.addColorStop(0, 'rgba(255,190,90,0.04)');
    vg.addColorStop(1, 'rgba(8,5,14,0.35)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }
  if (started) drawHUD(ctx);
  if (trans.active) {
    const a = trans.t < 15 ? trans.t / 15 : (30 - trans.t) / 15;
    ctx.fillStyle = 'rgba(6,4,10,' + Math.min(1, a) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}
function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}
if (document.fonts && document.fonts.load) {
  Promise.all([
    document.fonts.load('8px "Press Start 2P"'),
    document.fonts.load('16px "Press Start 2P"')
  ]).catch(() => {}).then(() => requestAnimationFrame(loop));
} else {
  requestAnimationFrame(loop);
}

/* warn before closing with a hand in flight (the journal still settles
   it fairly if the tab is force-closed anyway) */
addEventListener('beforeunload', e => {
  const bjLive = scene === 'blackjack' && ['dealing','player','dealerTurn'].includes(bj.state);
  const crLive = scene === 'craps' && crTotalBets() > 0;
  if (bjLive || crLive) { e.preventDefault(); e.returnValue = ''; }
});

/* ── Web3 integration map (next phase) ────────────────────────────────
   Entry:  clublounge.html (wallet flow lives there) links to this page.
           It can hand a session over via sessionStorage 'clubnile_session'
           = { wallet, tokenId, name } — picked up below.
   Gate:   verify MembersOnly.balanceOf(wallet) > 0 before enabling play.
   Chips:  replace localStorage balance with items.getChips(wallet); every
           chip movement in this file already flows through setChips().
   Buy-in: Gamble.commitWager(tokenId, wager) per table session (burns
           chips on-chain, returns a nonce).
   Payout: Worker oracle signs (tokenId, wager, payout, gameId, nonce,
           player) → Gamble.claimWinnings / resolveGame mints the payout.
   Tips:   items.safeTransferFrom(you, them, 0, amount) — chips are the
           ERC-1155 token 0 and already wallet-to-wallet transferable.
   Dice:   already server-authoritative (ClubNileRoom DO).            */
try {
  const s = JSON.parse(sessionStorage.getItem('clubnile_session') || 'null');
  if (s && s.name) {
    myName = sanitizeName(s.name) || myName;
    localStorage.setItem('clubnile_name', myName);
    chatNameEl.value = myName;
  }
} catch (e) { /* no session — guest play with local chips */ }

/* test hook (only with ?debug=1 in the URL) */
if (new URLSearchParams(location.search).has('debug')) {
  window.CN = {
    enterCraps, enterBlackjack, leaveTable, player, cr, bj, social, popups,
    get chips() { return chips; }, setChips,
    skipTitle() { started = true; titleAlpha = 0; }
  };
}
</script>
