<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; connect-src 'self' https://api.avax-test.network https://api.avax.network https://rpc.ankr.com https://last-chad-runner.severin20.workers.dev https://cloud.walletconnect.com wss://relay.walletconnect.com wss://relay.walletconnect.org https://*.walletconnect.org https://*.walletconnect.com https://api.web3modal.org; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://fonts.reown.com; frame-src https://verify.walletconnect.com;">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Members Only</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:100vw;height:100vh;overflow:hidden;background:#000;font-family:'Press Start 2P',monospace;color:#ffe96a}

/* ── Door image ── */
.door{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.door img{width:100%;height:100%;object-fit:contain;object-position:center;background:#000}

/* ── Rain overlay ── */
.rain-overlay{
  position:fixed;inset:0;z-index:5;
  pointer-events:none;
  mix-blend-mode:screen;
}
.rain-overlay img{
  width:100%;height:100%;object-fit:cover;display:block;
}

/* ── Knocker hotspot ── */
.knocker{
  position:absolute;width:9%;aspect-ratio:1;height:auto;
  top:61.5%;left:70%;transform:translate(-50%,-50%);
  cursor:pointer;border-radius:50%;z-index:10;
  box-shadow:0 0 30px rgba(201,168,76,0.3),0 0 60px rgba(201,168,76,0.15);
  animation:knockGlow 2.5s ease-in-out infinite;
  border:none;
  background:transparent;
}
@keyframes knockGlow{
  0%,100%{box-shadow:0 0 30px rgba(201,168,76,0.3),0 0 60px rgba(201,168,76,0.15),0 0 100px rgba(201,168,76,0.08)}
  50%{box-shadow:0 0 45px rgba(255,233,106,0.7),0 0 90px rgba(201,168,76,0.4),0 0 140px rgba(201,168,76,0.2)}
}
.knocker:hover{box-shadow:0 0 35px rgba(255,233,106,0.8),0 0 70px rgba(201,168,76,0.4)}

/* ── Wallet button ── */
.wallet-btn{
  position:fixed;top:14px;right:14px;z-index:50;
  font-family:'Press Start 2P',monospace;font-size:0.45rem;
  padding:10px 16px;cursor:pointer;
  background:linear-gradient(180deg,#c9a84c,#8b6914);
  border:2px solid #d4a017;border-radius:4px;color:#1a1005;
  box-shadow:inset 0 1px 0 rgba(255,220,120,0.4),0 2px 6px rgba(0,0,0,0.5);
}
.wallet-btn:hover{background:linear-gradient(180deg,#dabb5e,#a07d1e)}
.wallet-btn.connected{font-size:0.4rem}

/* ── Black overlay for NFT selection ── */
.overlay{
  position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0.75);
  display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:20px;gap:16px;
}
.overlay.active{display:flex}

.ov-text{font-size:0.6rem;color:#c9a84c;text-align:center;line-height:2.2;min-height:2em}

.nft-grid{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:500px;margin-top:12px}
.nft-card{
  width:120px;height:160px;border:2px solid transparent;border-radius:6px;cursor:pointer;
  overflow:hidden;transition:all 0.3s;background:transparent;
}
.nft-card img{width:100%;height:80%;object-fit:contain;image-rendering:pixelated}
.nft-card .nft-id{font-size:0.35rem;text-align:center;padding:2px;color:#7a6020}
.nft-card:hover{border-color:#c9a84c;transform:scale(1.05)}
.nft-card.selected{border-color:#ffe96a;box-shadow:0 0 20px rgba(255,233,106,0.6)}
.nft-card.glow-gold{border-color:#ffe96a;box-shadow:0 0 25px rgba(255,233,106,0.8),0 0 50px rgba(201,168,76,0.4);animation:cardGlow 1.5s ease-in-out infinite}
@keyframes cardGlow{0%,100%{box-shadow:0 0 25px rgba(255,233,106,0.8),0 0 50px rgba(201,168,76,0.4)}50%{box-shadow:0 0 35px rgba(255,233,106,1),0 0 70px rgba(201,168,76,0.6)}}

.welcome{font-size:clamp(0.6rem,2.5vw,1rem);color:#c9a84c;text-align:center;line-height:2;margin-top:20px}
.status{font-size:0.8rem;color:#5c4409;text-align:center;min-height:1em;margin-top:8px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
.status.loading{animation:blink 1.5s ease-in-out infinite}
</style>
</head>
<body>

<!-- Door -->
<div class="door">
  <img src="assets/membersonly/door.jpg" alt="Members Only">
  <div class="knocker" id="knocker"></div>
</div>

<!-- Rain overlay (mix-blend-mode:screen makes black transparent, white rain visible) -->
<div class="rain-overlay">
  <img src="assets/rain.gif" alt="">
</div>

<button class="wallet-btn" id="walletBtn">CONNECT WALLET</button>

<!-- Black overlay -->
<div class="overlay" id="overlay">
  <div class="ov-text" id="ovText"></div>
  <div class="status" id="ovStatus"></div>
  <div class="nft-grid" id="nftGrid"></div>
  <div class="welcome" id="welcomeMsg"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
<script type="module">
import { connectWallet, autoReconnect, disconnect, ensureSigner, truncateAddress } from './js/wallet.js';
import { CONTRACT_ADDRESS, MEMBERS_ONLY_ABI, ITEMS_CONTRACT_ADDRESS, ITEMS_ABI, READ_RPC, READ_RPC_FALLBACK, getChadImageUrl } from './js/config.js';

let readProv = new ethers.providers.JsonRpcProvider(READ_RPC);

let addr = null;
const walletBtn = document.getElementById('walletBtn');
const knocker = document.getElementById('knocker');
const overlay = document.getElementById('overlay');
const ovText = document.getElementById('ovText');
const ovStatus = document.getElementById('ovStatus');
const nftGrid = document.getElementById('nftGrid');
const welcomeMsg = document.getElementById('welcomeMsg');

function onConnected(a) {
  addr = a;
  walletBtn.textContent = truncateAddress(a);
  walletBtn.classList.add('connected');
}

walletBtn.addEventListener('click', () => connectWallet(null, { onConnected }));
autoReconnect({ onConnected });

function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

async function typewrite(el, text, speed) {
  el.textContent = '';
  for (let i = 0; i < text.length; i++) {
    el.textContent += text[i];
    await delay(speed || 60);
  }
}

knocker.addEventListener('click', async () => {
  if (!addr) {
    connectWallet(null, { onConnected });
    return;
  }

  overlay.classList.add('active');
  nftGrid.innerHTML = '';
  welcomeMsg.textContent = '';
  ovText.textContent = '';
  ovStatus.textContent = 'Verifying Membership';
  ovStatus.classList.add('loading');

  let contract = new ethers.Contract(CONTRACT_ADDRESS, MEMBERS_ONLY_ABI, readProv);
  let memberBal = 0;
  let rpcFailed = false;
  try {
    memberBal = (await contract.balanceOf(addr)).toNumber();
  } catch (e) {
    console.error('NFT balanceOf failed (primary RPC):', e.message || e);
    rpcFailed = true;
  }

  // Fallback RPC if primary failed
  if (rpcFailed) {
    try {
      ovStatus.textContent = 'Retrying...';
      readProv = new ethers.providers.JsonRpcProvider(READ_RPC_FALLBACK);
      contract = new ethers.Contract(CONTRACT_ADDRESS, MEMBERS_ONLY_ABI, readProv);
      memberBal = (await contract.balanceOf(addr)).toNumber();
      rpcFailed = false;
    } catch (e2) {
      console.error('NFT balanceOf failed (fallback RPC):', e2.message || e2);
      ovStatus.textContent = 'Cannot reach network — try again';
      return;
    }
  }

  let hasInvitation = false;
  try {
    let invItemId = 0;
    try {
      invItemId = (await contract.invitationItemId()).toNumber();
    } catch (_) {
      // Contract may not have invitationItemId — fall back to item 1
      invItemId = 1;
    }
    if (invItemId > 0) {
      const items = new ethers.Contract(ITEMS_CONTRACT_ADDRESS, ITEMS_ABI, readProv);
      const invBal = (await items.balanceOf(addr, invItemId)).toNumber();
      hasInvitation = invBal > 0;
    }
  } catch (e) {
    console.error('Invitation check failed:', e.message || e);
  }

  if (memberBal === 0 && !hasInvitation) {
    ovStatus.textContent = ''; ovStatus.classList.remove('loading');
    await typewrite(ovText, 'No membership found. You need an invitation.');
    return;
  }

  ovStatus.textContent = ''; ovStatus.classList.remove('loading');
  nftGrid.innerHTML = '';

  for (let i = 0; i < memberBal; i++) {
    const tid = (await contract.tokenOfOwnerByIndex(addr, i)).toNumber();
    const name = await contract.tokenName(tid).catch(() => '');
    const card = document.createElement('div');
    card.className = 'nft-card';
    card.dataset.type = 'member';
    card.dataset.name = name || 'Member #' + tid;
    card.innerHTML = '<img src="' + getChadImageUrl(tid) + '"><div class="nft-id">' + (name || '#' + tid) + '</div>';
    card.addEventListener('click', () => selectCard(card));
    nftGrid.appendChild(card);
  }

  if (hasInvitation) {
    const card = document.createElement('div');
    card.className = 'nft-card';
    card.dataset.type = 'invitation';
    card.innerHTML = '<img src="assets/membersonly/invitation.jpg" style="width:100%;height:80%;object-fit:cover"><div class="nft-id">INVITATION</div>';
    card.addEventListener('click', () => selectCard(card));
    nftGrid.appendChild(card);
  }
});

async function selectCard(card) {
  nftGrid.querySelectorAll('.nft-card').forEach(c => c.classList.remove('selected', 'glow-gold'));
  card.classList.add('selected');

  if (card.dataset.type === 'member') {
    ovStatus.textContent = ''; ovStatus.classList.remove('loading');
    nftGrid.style.display = 'none';
    await typewrite(welcomeMsg, 'Welcome home ' + card.dataset.name);
    await delay(1500);
    window.location.href = 'clublounge.html';
  } else {
    card.classList.add('glow-gold');
    ovStatus.textContent = ''; ovStatus.classList.remove('loading');
    nftGrid.style.display = 'none';
    await typewrite(welcomeMsg, 'Your invitation has been accepted.');
    await delay(1500);
    window.location.href = 'mint.html';
  }
}

// Click outside overlay to close
overlay.addEventListener('click', (e) => {
  if (e.target === overlay) {
    overlay.classList.remove('active');
    nftGrid.style.display = '';
  }
});
</script>
</body>
</html>
