<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; connect-src 'self' https://api.avax-test.network https://api.avax.network https://rpc.ankr.com https://last-chad-runner.severin20.workers.dev https://cloud.walletconnect.com wss://relay.walletconnect.com wss://relay.walletconnect.org https://*.walletconnect.org https://*.walletconnect.com https://api.web3modal.org; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://fonts.reown.com; frame-src https://verify.walletconnect.com;">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Members Only</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* ============================================================
   The console starts powered OFF — a blank screen. Slide the
   power switch to ON: the Club Nile card slides down, fades,
   and the rainy door appears. Knock (or press A) to step in.
   ============================================================ */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  height: 100%;
  background: #0c0912;
  overflow: hidden;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  font-family: 'Press Start 2P', monospace;
}
body {
  display: flex;
  justify-content: center;
  align-items: center;
  background: radial-gradient(ellipse at 50% 0%, #1a1326 0%, #0c0912 70%);
}
#console {
  position: relative;
  width: min(100vw, calc(100dvh * 832 / 1248));
  aspect-ratio: 832 / 1248;
  container-type: inline-size;
}
#console img.frame {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 2;
  pointer-events: none;
}
/* screen window — powered off it's just dark glass */
#screen {
  position: absolute;
  left: 4.33%;
  top: 3.12%;
  width: 91.2%;
  height: 60.65%;
  z-index: 1;
  overflow: hidden;
  background: #0a0710;
}
/* the door scene, zoomed out to show the whole door */
#door-scene {
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity 0.8s ease;
  pointer-events: none;
}
#door-scene.show { opacity: 1; pointer-events: auto; }
#door-scene .door-img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;
  display: block;
  /* evening scene, lifted out of the murk — brighter, a touch warmer */
  filter: brightness(1.6) contrast(0.88) saturate(1.08);
}
/* a soft warm glow from the doorway lamp, so the lift reads as light not haze */
#door-scene::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  mix-blend-mode: screen;
  background:
    radial-gradient(ellipse at 50% 40%, rgba(255,208,132,0.30) 0%, rgba(255,208,132,0) 60%),
    linear-gradient(180deg, rgba(60,50,70,0.10) 0%, rgba(70,55,60,0.16) 100%);
}
.rain-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  mix-blend-mode: screen;
}
.rain-overlay img { width: 100%; height: 100%; object-fit: cover; display: block; }
/* boot splash: the game's own title card (sunburst + CLUB NILE),
   painted on a canvas, slides down then fades */
#boot {
  position: absolute;
  inset: 0;
  z-index: 2;
  background: #0a0710;
  transform: translateY(-105%);
  transition: transform 2.7s cubic-bezier(0.25, 0.9, 0.3, 1), opacity 0.8s ease;
}
#boot.in   { transform: translateY(4%); }   /* settles a touch low */
#boot.gone { opacity: 0; pointer-events: none; }
#boot canvas {
  width: 100%;
  height: 100%;
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}
/* blinking PRESS A once the card has landed */
#boot-press {
  position: absolute;
  left: 0;
  right: 0;
  top: 76%;
  text-align: center;
  font-size: 3.4cqw;
  letter-spacing: 0.4cqw;
  color: #f9f5ea;
  pointer-events: none;
  opacity: 0;
}
#boot-press.on { animation: pressBlink 0.9s steps(1) infinite; }
@keyframes pressBlink { 0%,50% { opacity: 1; } 50.01%,100% { opacity: 0; } }
/* bezel over the gold, same as the game */
#bezel {
  position: absolute;
  left: 3.37%;
  top: 2.56%;
  width: 93.24%;
  height: 61.77%;
  z-index: 3;
  pointer-events: none;
  border-style: solid;
  border-color: #0a0810;
  border-width: 0.84cqw 1.08cqw 0.84cqw 0.96cqw;
}
#bezel-in {
  position: absolute;
  left: 4.03%;
  top: 2.92%;
  width: 91.8%;
  height: 61.05%;
  z-index: 3;
  pointer-events: none;
  border: 0.3cqw solid #34303c;
}
/* knocker hotspot (positioned for the zoomed-out door) — invisible,
   no glow; the door speaks for itself */
.knocker {
  position: absolute;
  width: 10%;
  aspect-ratio: 1;
  top: 61.5%;
  left: 63%;
  transform: translate(-50%, -50%);
  cursor: pointer;
  border-radius: 50%;
  border: none;
  background: transparent;
}
/* A button on the console knocks too */
.hot {
  position: absolute;
  z-index: 3;
  touch-action: none;
  cursor: pointer;
}
#btn-a { left: 70%; top: 71%; width: 23%; height: 15.5%; border-radius: 50%; }
.hot.pressed {
  background: radial-gradient(circle, rgba(255,235,170,0.28) 0%, rgba(255,235,170,0) 70%);
}
/* power switch (same spot as in the game) */
#power {
  position: absolute;
  z-index: 3;
  left: 76%;
  top: 92.2%;
  width: 18%;
  height: 5%;
  touch-action: none;
  cursor: pointer;
}
#pw-track {
  position: absolute;
  inset: 0;
  background: rgba(24,14,4,0.72);
  border: 0.55cqw solid #8a6015;
  border-radius: 3.2cqw;
}
.pw-txt {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  font-size: 2.1cqw;
  letter-spacing: 0.2cqw;
  color: #b99a4e;
  pointer-events: none;
}
.pw-txt.pw-on  { left: 10%; }
.pw-txt.pw-off { right: 8%; }
#pw-knob {
  position: absolute;
  top: 7%;
  left: 3%;
  width: 46%;
  height: 86%;
  border-radius: 2.6cqw;
  background: linear-gradient(180deg, #e8c060, #8a6015);
  box-shadow: inset 0 0.3cqw 0 rgba(255,235,170,0.5), 0 0.4cqw 0.8cqw rgba(0,0,0,0.5);
  pointer-events: none;
}
/* stepping inside: fade the screen to black, then the game fades in */
.overlay {
  position: absolute;
  inset: 0;
  z-index: 4;
  background: #000;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.55s ease;
}
.overlay.active { opacity: 1; }
</style>
</head>
<body>

<div id="console">
  <div id="screen">
    <div id="door-scene">
      <img class="door-img" src="assets/membersonly/door.jpg" alt="Members Only">
      <div class="rain-overlay"><img src="assets/membersonly/rain.gif" alt=""></div>
      <button class="knocker" id="knocker" aria-label="Knock"></button>
    </div>
    <div id="boot"><canvas id="boot-cvs" width="480" height="480"></canvas><div id="boot-press">PRESS A</div></div>
    <div class="overlay" id="overlay"></div>
  </div>
  <img class="frame" src="assets/membersonly/egypt-console.png" alt="Members Only console">
  <div id="bezel"></div>
  <div id="bezel-in"></div>
  <div class="hot" id="btn-a" aria-label="A"></div>
  <div id="power">
    <div id="pw-track">
      <span class="pw-txt pw-on">ON</span>
      <span class="pw-txt pw-off">OFF</span>
      <div id="pw-knob"></div>
    </div>
  </div>
</div>

<script>
/* The console boots when the power switch slides ON: the Club Nile card
   drops onto the screen to a jingle, glints, and shows PRESS A. The NFT
   gate returns here later — membership checked before the game loads. */
const boot      = document.getElementById('boot');
const doorScene = document.getElementById('door-scene');
const knocker   = document.getElementById('knocker');
const overlay   = document.getElementById('overlay');
const btnA      = document.getElementById('btn-a');
const pressA    = document.getElementById('boot-press');

let powered = false;
let entering = false;
let stage = 'boot';                    // 'boot' (title card) → 'door' (rainy door)

/* arcade jingle on boot, blip on confirm */
const sndCapcom = new Audio('assets/membersonly/capcom.wav');
const sndSelect = new Audio('assets/membersonly/select.wav');
sndCapcom.preload = 'auto'; sndSelect.preload = 'auto';
function play(a) { try { a.currentTime = 0; a.play().catch(() => {}); } catch (e) {} }

/* three spaced knocks, synthesised — played when you rap the door */
const knock = (() => {
  let ac = null;
  function thud(t, freq, gain) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(freq, t);
    o.frequency.exponentialRampToValueAtTime(freq * 0.5, t + 0.11);
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + 0.2);
  }
  return { play() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!ac) { if (!AC) return; ac = new AC(); }
    if (ac.state === 'suspended') ac.resume();
    const t = ac.currentTime;
    thud(t,        172, 0.28);   // three deliberate, spaced raps
    thud(t + 0.34, 160, 0.26);
    thud(t + 0.68, 150, 0.24);
  } };
})();

/* rain, synthesised: filtered noise loop with a gentle swell — no file,
   CSP-clean, starts with the door scene and stops when we leave it */
const rain = (() => {
  let ac = null, src = null, gain = null;
  function start() {
    if (ac) { try { ac.resume(); } catch (e) {} return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    const buf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const d = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < d.length; i++) {
      const white = Math.random() * 2 - 1;
      last = (last + 0.02 * white) / 1.02;   // brownish noise
      d[i] = last * 3.2;
    }
    src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 5200;
    const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 420;
    gain = ac.createGain(); gain.gain.value = 0.0;
    src.connect(hp); hp.connect(lp); lp.connect(gain); gain.connect(ac.destination);
    src.start();
    /* slow shimmer so it breathes like real rainfall */
    const lfo = ac.createOscillator(); lfo.frequency.value = 0.15;
    const lfoGain = ac.createGain(); lfoGain.gain.value = 0.025;
    lfo.connect(lfoGain); lfoGain.connect(gain.gain); lfo.start();
    gain.gain.setTargetAtTime(0.11, ac.currentTime, 0.6);   // rain at 50% volume
  }
  function stop() {
    if (!ac || !gain) return;
    gain.gain.setTargetAtTime(0.0, ac.currentTime, 0.2);
  }
  return { start, stop };
})();

function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

/* the game's own title card: art-deco sunburst + gold CLUB NILE */
function paintBootCard() {
  const g = document.getElementById('boot-cvs').getContext('2d');
  g.setTransform(2, 0, 0, 2, 0, 0);
  const W = 240, H = 240;
  g.clearRect(0, 0, W, H);
  g.fillStyle = '#0a0710';
  g.fillRect(0, 0, W, H);
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.strokeStyle = 'rgba(217,174,95,0.28)'; g.lineWidth = 1;
  for (let i = -4; i <= 4; i++) {
    g.beginPath();
    g.moveTo(W/2, 100);
    g.lineTo(W/2 + i * 26, 20);
    g.stroke();
  }
  g.font = '16px "Press Start 2P", monospace';
  g.fillStyle = '#5e2216';
  g.fillText('CLUB', W/2 + 1, 89.5);
  g.fillText('NILE', W/2 + 1, 111.5);
  const tGrad = g.createLinearGradient(0, 78, 0, 120);
  tGrad.addColorStop(0, '#fff2b8');
  tGrad.addColorStop(0.5, '#ffdf7a');
  tGrad.addColorStop(1, '#cfa63e');
  g.fillStyle = tGrad;
  g.fillText('CLUB', W/2, 88);
  g.fillText('NILE', W/2, 110);
  g.fillStyle = '#f2c76a';
  g.fillRect(W/2 - 40, 124, 80, 1);
  g.fillStyle = '#fff2b8';
  g.fillRect(W/2 - 2, 122, 4, 4);
  g.font = '8px "Press Start 2P", monospace';
  g.fillStyle = '#f9f5ea';
  g.fillText('EST. 1926', W/2, 136);
  g.fillStyle = '#f2c76a';
  g.fillText('MEMBERS ONLY', W/2, 150);
}
if (document.fonts && document.fonts.load) {
  Promise.all([
    document.fonts.load('8px "Press Start 2P"'),
    document.fonts.load('16px "Press Start 2P"')
  ]).catch(() => {}).then(paintBootCard);
} else {
  paintBootCard();
}

let ready = false;                     // PRESS A is live on the title card
async function bootUp() {
  powered = true;
  ready = false;
  stage = 'boot';
  paintBootCard();
  pressA.classList.remove('on');
  doorScene.classList.remove('show');
  /* park the card above the screen with no animation, then slide in */
  boot.style.transition = 'none';
  boot.classList.remove('in', 'gone');
  void boot.offsetHeight;
  boot.style.transition = '';
  boot.classList.add('in');            // Club Nile title drifts down
  play(sndCapcom);                     // ...to the arcade jingle
  await delay(2900);                   // ...lands
  if (!powered) return;
  pressA.classList.add('on');          // PRESS A blinks
  ready = true;
}

function powerDown() {
  powered = false;
  entering = false;
  ready = false;
  stage = 'boot';
  try { sndCapcom.pause(); } catch (e) {}
  rain.stop();
  overlay.classList.remove('active');
  pressA.classList.remove('on');
  doorScene.classList.remove('show');
  boot.style.transition = 'none';
  boot.classList.remove('in', 'gone');
  void boot.offsetHeight;
  boot.style.transition = '';
}

/* the A button / tap / Enter drives the sequence one step at a time */
async function advance() {
  if (!powered || entering) return;
  if (stage === 'boot') {
    if (!ready) return;
    ready = false;
    play(sndSelect);                   // confirm blip
    pressA.classList.remove('on');
    doorScene.classList.add('show');   // rainy door fades in...
    boot.classList.add('gone');        // ...as the title card fades out
    rain.start();                      // ...and the rain comes up
    stage = 'door';
    return;
  }
  /* stage 'door' → three knocks, a beat, then step inside */
  entering = true;
  knock.play();                        // three spaced raps (~0.85s)
  rain.stop();
  await delay(900);                    // let the knocks finish...
  if (!powered) return;
  await delay(1000);                   // ...hold a 1-second pause...
  if (!powered) return;
  overlay.classList.add('active');     // ...then fade the screen to black...
  await delay(650);
  if (!powered) return;
  window.location.href = 'games/clubnile.html';   // ...and the game fades in
}

btnA.addEventListener('pointerdown', e => {
  e.preventDefault();
  btnA.classList.add('pressed');
  advance();
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev =>
  btnA.addEventListener(ev, () => btnA.classList.remove('pressed')));
boot.addEventListener('pointerdown', e => { e.preventDefault(); advance(); });
knocker.addEventListener('click', advance);
addEventListener('keydown', e => {
  if (['Enter', ' ', 'e', 'E', 'z', 'Z'].includes(e.key)) advance();
});

/* ── power switch: swipe the knob and hold half a second to flip it ── */
(function initPower() {
  const el = document.getElementById('power');
  const knob = document.getElementById('pw-knob');
  const MIN = 3, MAX = 51;
  let on = false, drag = null;
  const setKnob = f => { knob.style.left = (MIN + f * (MAX - MIN)) + '%'; };
  setKnob(0);
  function commit() {
    on = !on;
    setKnob(on ? 1 : 0);
    if (on) bootUp(); else powerDown();
  }
  el.addEventListener('pointerdown', e => {
    e.preventDefault();
    el.setPointerCapture(e.pointerId);
    drag = { x0: e.clientX, w: el.getBoundingClientRect().width * 0.48, f: on ? 1 : 0 };
  });
  el.addEventListener('pointermove', e => {
    if (!drag) return;
    const f = Math.max(0, Math.min(1, drag.f + (e.clientX - drag.x0) / drag.w));
    setKnob(f);
    /* no hold — the moment the knob slides across, it commits */
    if (on ? f < 0.25 : f > 0.75) { drag = null; commit(); }
  });
  ['pointerup', 'pointercancel'].forEach(ev => el.addEventListener(ev, () => {
    drag = null;
    setKnob(on ? 1 : 0);
  }));
})();
</script>
</body>
</html>
