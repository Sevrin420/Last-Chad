<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; connect-src 'self' https://api.avax.network https://rpc.ankr.com https://last-chad-runner.severin20.workers.dev https://cloud.walletconnect.com wss://relay.walletconnect.com wss://relay.walletconnect.org https://*.walletconnect.org https://*.walletconnect.com https://api.web3modal.org; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://fonts.reown.com; frame-src https://verify.walletconnect.com;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Members Only</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="nav.css">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{width:100vw;height:100vh;overflow:hidden;background:#000;font-family:'Press Start 2P',monospace;color:#ffe96a}

    .front-door{
      width:100%;height:100%;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:24px;
      position:relative;
    }

    .title{font-size:clamp(1rem,4vw,2rem);color:#c9a84c;text-align:center;letter-spacing:3px;
      text-shadow:0 0 20px rgba(201,168,76,0.3)}
    .subtitle{font-size:clamp(0.4rem,1.5vw,0.6rem);color:#5c4409;letter-spacing:2px;text-align:center}

    /* Buttons row */
    .door-btns{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:12px}
    .door-btn{
      font-family:'Press Start 2P',monospace;font-size:clamp(0.45rem,1.4vw,0.6rem);
      padding:14px 24px;cursor:pointer;border:2px solid #5c4409;border-radius:4px;
      color:#c9a84c;background:rgba(30,22,8,0.8);letter-spacing:1px;
      transition:all 0.15s;text-decoration:none;display:inline-block;
    }
    .door-btn:hover{border-color:#c9a84c;background:rgba(60,44,16,0.8);color:#ffe96a}
    .door-btn.gold{
      background:linear-gradient(180deg,#c9a84c,#8b6914);color:#1a1005;border-color:#d4a017;
      box-shadow:inset 0 1px 0 rgba(255,220,120,0.4),0 2px 6px rgba(0,0,0,0.5);
    }
    .door-btn.gold:hover{background:linear-gradient(180deg,#dabb5e,#a07d1e)}

    /* NFT grid */
    .nft-area{display:none;flex-direction:column;align-items:center;gap:12px;margin-top:16px}
    .nft-area.visible{display:flex}
    .nft-label{font-size:0.5rem;color:#5c4409}
    .nft-grid{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:500px}
    .nft-card{
      width:80px;height:100px;border:2px solid #333;border-radius:6px;cursor:pointer;
      overflow:hidden;transition:all 0.3s;background:rgba(0,0,0,0.5);position:relative;
    }
    .nft-card img{width:100%;height:70%;object-fit:cover;image-rendering:pixelated}
    .nft-card .nft-id{font-size:0.35rem;text-align:center;padding:2px;color:#7a6020}
    .nft-card:hover{border-color:#c9a84c;transform:scale(1.05)}
    .nft-card.selected{border-color:#ffe96a;box-shadow:0 0 20px rgba(255,233,106,0.6)}
    .nft-card.glow-gold{border-color:#ffe96a;box-shadow:0 0 25px rgba(255,233,106,0.8),0 0 50px rgba(201,168,76,0.4);
      animation:goldPulse 1.5s ease-in-out infinite}
    @keyframes goldPulse{0%,100%{box-shadow:0 0 25px rgba(255,233,106,0.8),0 0 50px rgba(201,168,76,0.4)}
      50%{box-shadow:0 0 35px rgba(255,233,106,1),0 0 70px rgba(201,168,76,0.6)}}

    /* Result area */
    .result{display:none;flex-direction:column;align-items:center;gap:16px;margin-top:20px}
    .result.visible{display:flex}
    .host-img{max-height:30vh;max-width:80vw;object-fit:contain;border-radius:8px;
      border:2px solid #c9a84c;box-shadow:0 0 30px rgba(201,168,76,0.3)}
    .welcome-msg{font-size:clamp(0.5rem,1.8vw,0.75rem);color:#c9a84c;text-align:center;line-height:2}
    .enter-btn{
      font-family:'Press Start 2P',monospace;font-size:clamp(0.5rem,1.6vw,0.7rem);
      padding:16px 32px;cursor:pointer;border:none;
      background:linear-gradient(180deg,#c9a84c,#8b6914);color:#1a1005;
      border-bottom:5px solid #7a6020;letter-spacing:2px;
    }
    .enter-btn:hover{background:linear-gradient(180deg,#dabb5e,#a07d1e)}
    .enter-btn:active{border-bottom-width:2px;transform:translateY(3px)}
    .mint-btn-reveal{
      font-family:'Press Start 2P',monospace;font-size:clamp(0.45rem,1.4vw,0.6rem);
      padding:14px 28px;cursor:pointer;border:2px solid #1a6b2a;border-radius:4px;
      background:linear-gradient(180deg,#1a6b2a,#0d3515);color:#fff;letter-spacing:1px;
    }
    .mint-btn-reveal:hover{background:linear-gradient(180deg,#228b3a,#145a22)}

    .status-msg{font-size:0.45rem;color:#5c4409;text-align:center;min-height:1em}
    .nav-wrapper{position:absolute;top:12px;left:12px;z-index:50}
  </style>
</head>
<body>
<div class="front-door">
  <div id="nav-placeholder"></div>

  <div class="title">MEMBERS ONLY</div>
  <div class="subtitle">AN EXCLUSIVE CASINO ON AVALANCHE</div>

  <div class="door-btns" id="doorBtns">
    <button class="door-btn gold" id="connectBtn">CONNECT WALLET</button>
    <a href="docs.html" class="door-btn">DOCS</a>
  </div>

  <div class="status-msg" id="statusMsg"></div>

  <!-- NFT selection after wallet connects -->
  <div class="nft-area" id="nftArea">
    <div class="nft-label">YOUR NFTS</div>
    <div class="nft-grid" id="nftGrid"></div>
  </div>

  <!-- Welcome message for Members Only NFT holders -->
  <div class="result" id="memberResult">
    <img class="host-img" src="assets/chazzyp/chazzypgamble.jpg" alt="Host" id="hostImg">
    <div class="welcome-msg" id="welcomeMsg"></div>
    <button class="enter-btn" id="enterClubBtn">ENTER THE CLUB</button>
  </div>

  <!-- Mint button for Token holders -->
  <div class="result" id="tokenResult">
    <button class="mint-btn-reveal" id="mintBtn">MINT YOUR MEMBERSHIP</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
<script src="nav.js"></script>
<script type="module">
import { connectWallet, autoReconnect, disconnect, truncateAddress } from './js/wallet.js';
import { CONTRACT_ADDRESS, MEMBERS_ONLY_ABI, ITEMS_CONTRACT_ADDRESS, ITEMS_ABI, READ_RPC, getChadImageUrl } from './js/config.js';

const readProv = new ethers.providers.JsonRpcProvider(READ_RPC);
const connectBtn = document.getElementById('connectBtn');
const statusMsg = document.getElementById('statusMsg');
const nftArea = document.getElementById('nftArea');
const nftGrid = document.getElementById('nftGrid');
const memberResult = document.getElementById('memberResult');
const tokenResult = document.getElementById('tokenResult');
const welcomeMsg = document.getElementById('welcomeMsg');
const enterClubBtn = document.getElementById('enterClubBtn');
const mintBtn = document.getElementById('mintBtn');

// Invitation is an ERC-1155 item in MembersOnlyItems
// TODO: Set this to the item ID after creating the invitation item
const INVITATION_ITEM_ID = 1;

let userAddr = null;

async function onConnected(addr) {
  userAddr = addr;
  connectBtn.textContent = truncateAddress(addr);
  connectBtn.classList.add('connected');
  statusMsg.textContent = 'Checking your wallet...';
  await loadNFTs(addr);
}

async function loadNFTs(addr) {
  const contract = new ethers.Contract(CONTRACT_ADDRESS, MEMBERS_ONLY_ABI, readProv);
  let memberBalance = 0;
  try { memberBalance = (await contract.balanceOf(addr)).toNumber(); } catch {}

  // Check for Member Token (invite NFT)
  let hasInvitation = false;
  try {
    const itemsContract = new ethers.Contract(ITEMS_CONTRACT_ADDRESS, ITEMS_ABI, readProv);
    const invBal = (await itemsContract.balanceOf(addr, INVITATION_ITEM_ID)).toNumber();
    hasInvitation = invBal > 0;
  } catch {}

  if (memberBalance === 0 && !hasInvitation) {
    statusMsg.textContent = 'No membership found. You need an invite to enter.';
    return;
  }

  statusMsg.textContent = 'Select an NFT';
  nftArea.classList.add('visible');
  nftGrid.innerHTML = '';

  // Show Members Only NFTs
  for (let i = 0; i < memberBalance; i++) {
    const tid = (await contract.tokenOfOwnerByIndex(addr, i)).toNumber();
    const name = await contract.tokenName(tid).catch(() => '');
    const card = document.createElement('div');
    card.className = 'nft-card';
    card.dataset.type = 'member';
    card.dataset.tid = tid;
    card.dataset.name = name || 'Member #' + tid;
    card.innerHTML = `<img src="${getChadImageUrl(tid)}"><div class="nft-id">${name || '#' + tid}</div>`;
    card.addEventListener('click', () => selectNFT(card));
    nftGrid.appendChild(card);
  }

  // Show Member Token if held (use a placeholder image)
  if (hasInvitation) {
    const card = document.createElement('div');
    card.className = 'nft-card';
    card.dataset.type = 'invitation';
    card.innerHTML = `<div style="width:100%;height:70%;background:#1a1005;display:flex;align-items:center;justify-content:center;font-size:1.2rem">🎫</div><div class="nft-id">INVITATION</div>`;
    card.addEventListener('click', () => selectNFT(card));
    nftGrid.appendChild(card);
  }
}

function selectNFT(card) {
  // Clear previous selections
  nftGrid.querySelectorAll('.nft-card').forEach(c => {
    c.classList.remove('selected', 'glow-gold');
  });
  memberResult.classList.remove('visible');
  tokenResult.classList.remove('visible');

  card.classList.add('selected');

  if (card.dataset.type === 'member') {
    // Members Only NFT — show welcome
    card.classList.add('selected');
    const name = card.dataset.name;
    welcomeMsg.textContent = 'Welcome home ' + name;
    memberResult.classList.add('visible');
    statusMsg.textContent = '';
  } else if (card.dataset.type === 'invitation') {
    // Invitation — glow gold, show mint
    card.classList.add('glow-gold');
    tokenResult.classList.add('visible');
    statusMsg.textContent = '';
  }
}

enterClubBtn.addEventListener('click', () => {
  window.location.href = 'clublounge.html';
});

mintBtn.addEventListener('click', () => {
  window.location.href = 'mint.html';
});

connectBtn.addEventListener('click', () => connectWallet(onConnected));
autoReconnect({ onConnected });
</script>
</body>
</html>
